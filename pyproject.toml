[project]
name = "lzug"
version = "0.1.0"
description = "Backend-Prototyp fuer die lzug Pruefungsrunden-App"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8.0",
  "ruff>=0.6.0",
  "black>=24.0.0",
]

[tool.unittest]
start-dir = "tests"

[tool.coverage.run]
branch = true
source = ["backend"]
omit = [
  "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "dist", "build", ".git", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.venv
  | dist
  | build
  | \.git
)/
'''
