[project]
name = "lzug"
# This is non-release packaging metadata. Runtime versions come solely from
# build-metadata.json, derived from the immutable commit and release tag.
version = "0.0.0"
description = "Backend fuer die lzug Pruefungsrunden-App"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
  "argon2-cffi>=23.1,<26.0",
  "cryptography>=50.0.0,<51.0",
  "fastapi==0.141.1",
  "holidays>=0.102,<1.0",
  "pyotp>=2.9,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "uvicorn==0.52.4",
  "icalendar>=7.3.0,<8.0",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.15.4,<8.0",
  "httpx2==2.12.0",
  "pip-audit>=2.9.0,<3.0",
  "ruff>=0.16.2",
  "black>=24.0.0",
  "mypy>=1.19,<3",
]

[tool.unittest]
start-dir = "."

[tool.coverage.run]
branch = true
source = ["backend"]
omit = [
  "backend/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-mermaid2-plugin>=1.2.3,<2.0",
    "mkdocstrings[python]>=1.0.6,<2.0",
]

[tool.setuptools]
package-dir = {"" = "backend/src"}

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".venv", "dist", "build", ".git", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "demo", "fixtures", "scripts", "tests"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.black]
line-length = 100
target-version = ["py314"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.venv
  | dist
  | build
  | \.git
)/
'''

[tool.mypy]
files = [
  "backend/src/backend/api_contracts.py",
  "backend/src/backend/transport.py",
  "backend/src/backend/models.py",
]
python_version = "3.14"
follow_imports = "skip"
warn_unused_configs = true
