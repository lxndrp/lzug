[project]
name = "lzug"
version = "0.1.0"
description = "Backend-Prototyp fuer die lzug Pruefungsrunden-App"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
  "argon2-cffi>=23.1,<26.0",
  "cryptography>=50.0.0,<51.0",
  "holidays>=0.102,<1.0",
  "pyotp>=2.9,<3.0",
  "SQLAlchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.15.3,<8.0",
  "pip-audit>=2.9.0,<3.0",
  "ruff>=0.16.1",
  "black>=24.0.0",
]

[tool.unittest]
start-dir = "backend/tests"

[tool.coverage.run]
branch = true
source = ["backend"]
omit = [
  "backend/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "mkdocs>=1.6,<2.0",
    "mkdocstrings[python]>=1.0.6,<2.0",
]

[tool.setuptools]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".venv", "dist", "build", ".git", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py314"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.venv
  | dist
  | build
  | \.git
)/
'''
