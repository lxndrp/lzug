  <title id="title">lzug Key Visual</title>
  <desc id="description">Eine eigenständige Urkunde steht rechts oben neben einem schlank abstrahierten Prüfling. Fünf kleinere Prüferköpfe mit leichten Büsten bilden das nachgeordnete Publikum; Bühne und Licht unterstützen das Motiv.</desc>
