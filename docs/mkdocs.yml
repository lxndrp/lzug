site_name: lzug technische Referenz
site_description: Versionierte technische Orientierung, Referenzen und Entscheidungen für lzug.
site_dir: ../site
docs_dir: .
strict: true
not_in_nav: |
  developers/decisions/*.md
  developers/reference/*
theme:
  name: mkdocs
plugins:
  - search
  - mermaid2
  - mkdocstrings:
      handlers:
        python:
          paths:
            - ..
          options:
            docstring_style: google
            show_source: false
            members_order: source
nav:
  - Start: index.md
  - Dokumentationslizenz: LICENSE.md
  - Für Entwickler:
      - Überblick: developers/index.md
      - Fachmodell und Verträge: developers/data-and-contracts.md
      - Architektur und Entscheidungen: developers/architecture.md
      - Komponenten: developers/components.md
      - Delivery und Veröffentlichung: developers/delivery.md
      - Entwicklung: developers/development.md
      - ADR-Register: developers/decisions/index.md
