[tools]
python = "3.14.6"
node = "26.5.0"
uv = "latest"

[settings]
python.uv_venv_auto = "create|source"

[tasks.setup]
description = "Recreate virtualenv and install locked dependencies"
run = """
uv venv --python "$(mise which python)" --clear --seed
uv sync --locked --extra dev
cd frontend && npm install
"""

[tasks.test]
description = "Run all tests"
run = """
.venv/bin/python -m unittest
cd frontend && npm run test:ci
"""

[tasks.quality]
description = "Run the complete local quality assurance suite"
run = """
set -e
.venv/bin/python -m ruff check .
.venv/bin/python -m black --check .
.venv/bin/python -m pip_audit --skip-editable --cache-dir /tmp/lzug-pip-audit
.venv/bin/python -m coverage run -m unittest
.venv/bin/python -m coverage report
cd frontend
npm run lint
npm run format:check
npm run build:ci
npm run test:coverage
npm run security:check
npm run test:e2e
"""

[tasks.dev]
description = "Start backend and frontend in parallel"
run = """
echo "Starting backend and frontend..."
(.venv/bin/python -m backend.app --init &) && (cd frontend && npm start)
"""
