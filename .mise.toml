[tools]
python = "3.14.6"
node = "26.5.0"
uv = "latest"

[settings]
python.uv_venv_auto = "create|source"

[tasks.setup]
description = "Recreate virtualenv and install locked dependencies"
run = """
uv venv --python "$(mise which python)" --clear --seed
uv sync --locked --extra dev
cd frontend && npm install
"""

[tasks.test]
description = "Run all tests"
run = """
.venv/bin/python -m unittest
cd frontend && npm run test:ci
"""

[tasks.docs]
description = "Build the local developer documentation and generated code reference"
run = """
set -e
.venv/bin/mkdocs build --strict --site-dir site
cd frontend
npm run docs
"""

[tasks."quality:backend"]
description = "Run backend lint, audit, tests, and coverage"
run = """
set -e
.venv/bin/python -m ruff check .
.venv/bin/python -m black --check .
.venv/bin/python -m pip_audit --skip-editable --cache-dir /tmp/lzug-pip-audit
.venv/bin/python -m coverage run -m unittest
.venv/bin/python -m coverage report
"""

[tasks."quality:frontend"]
description = "Run frontend lint, build, and unit tests"
run = """
set -e
cd frontend
npm run lint
npm run format:check
npm run build:ci
npm run test:coverage
"""

[tasks."quality:security"]
description = "Run the production npm critical security gate"
run = """
set -e
cd frontend
npm run security:check
"""

[tasks."quality:e2e"]
description = "Run browser E2E and accessibility tests"
run = """
set -e
cd frontend
npm run test:e2e
npm run test:a11y
"""

[tasks.quality]
description = "Run the complete local quality assurance suite in parallel"
run = "mise run --jobs 5 quality:backend ::: quality:frontend ::: quality:security ::: quality:e2e ::: docs"

[tasks.dev]
description = "Start backend and frontend in parallel"
run = """
echo "Starting backend and frontend..."
(.venv/bin/python -m backend.app --init &) && (cd frontend && npm start)
"""
