version: "3.52"

tasks:
  test:
    desc: Run Go operator CLI contract tests
    dir: operator-cli
    cmds:
      - go test ./...

  quality:
    desc: Run Go operator CLI tests, vet, and packaging configuration validation
    dir: operator-cli
    cmds:
      - task: test
      - go vet ./...
      - goreleaser check

  packaging-and-reproducibility:
    desc: Build CLI release artifacts twice and verify manifest-selected outputs
    dir: operator-cli
    cmds:
      - pwsh -NoProfile -File ../scripts/operator-reproducibility.ps1
