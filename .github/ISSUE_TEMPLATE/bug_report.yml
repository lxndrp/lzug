name: Bug report
description: Einen reproduzierbaren Fehler im Prototyp melden
title: "Bug: "
labels:
  - type: bug
body:
  - type: markdown
    attributes:
      value: |
        `lzug` ist ein nicht produktionsreifer Quellcode-Prototyp. Bitte keine vertraulichen oder personenbezogenen Daten einfügen.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduktion
      description: Welche Schritte führen zum Fehler?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Tatsächliches Verhalten
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Umgebung
      description: Browser, Betriebssystem und relevanter Commit oder Branch
  - type: textarea
    id: evidence
    attributes:
      label: Nachweise
      description: Logs oder Screenshots ohne vertrauliche Inhalte
