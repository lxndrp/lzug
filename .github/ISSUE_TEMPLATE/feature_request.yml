name: Feature request
description: Eine fachliche oder technische Weiterentwicklung vorschlagen
title: "Story: "
labels:
  - type: story
body:
  - type: markdown
    attributes:
      value: |
        Bitte den Nutzerwert und die fachliche Abgrenzung beschreiben. Produktions-, Self-Hosting- und Demo-Anforderungen gehören in das getrennte Release-Gate.
  - type: textarea
    id: why
    attributes:
      label: Why
      description: Wer soll was tun können und warum?
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What
      description: Ziel, Erhaltungsbedingungen und Nicht-Scope
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How
      description: Kurzer Lösungsvorschlag und verbindliche ADR-Verweise; nur ausfüllen, wenn ein konkreter Ansatz vorliegt
  - type: textarea
    id: evidence
    attributes:
      label: Nachweis
      description: Woran lässt sich die Umsetzung beobachten und prüfen?
    validations:
      required: true