version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      angular:
        applies-to: version-updates
        patterns:
          - "@angular/*"
      angular-security:
        applies-to: security-updates
        patterns:
          - "@angular/*"
      taiga-ui:
        applies-to: version-updates
        patterns:
          - "@taiga-ui/*"
      taiga-ui-security:
        applies-to: security-updates
        patterns:
          - "@taiga-ui/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
