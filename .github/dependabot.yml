version: 2

updates:
  - package-ecosystem: gomod
    directory: /operator-cli
    schedule:
      interval: weekly
    groups:
      golang-x:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns:
          - "golang.org/x/*"
      golang-x-security:
        applies-to: security-updates
        patterns:
          - "golang.org/x/*"
      gomod-routine:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-routine:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns:
          - "*"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      angular:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns:
          - "@angular/*"
      angular-security:
        applies-to: security-updates
        patterns:
          - "@angular/*"
      taiga-ui:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns:
          - "@taiga-ui/*"
      taiga-ui-security:
        applies-to: security-updates
        patterns:
          - "@taiga-ui/*"
      frontend-linting:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns:
          - "eslint"
          - "@eslint/js"
          - "eslint-config-prettier"
          - "typescript-eslint"
          - "@typescript-eslint/eslint-plugin"
          - "@typescript-eslint/parser"
      frontend-linting-security:
        applies-to: security-updates
        patterns:
          - "eslint"
          - "@eslint/js"
          - "eslint-config-prettier"
          - "typescript-eslint"
          - "@typescript-eslint/eslint-plugin"
          - "@typescript-eslint/parser"
      vitest:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns:
          - "vitest"
          - "@vitest/coverage-v8"
      frontend-routine:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns:
          - "*"
      vitest-security:
        applies-to: security-updates
        patterns:
          - "vitest"
          - "@vitest/coverage-v8"
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns:
          - "github/codeql-action/*"
      codeql-security:
        applies-to: security-updates
        patterns:
          - "github/codeql-action/*"
      actions-routine:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns:
          - "*"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
