version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      angular:
        applies-to: version-updates
        patterns:
          - "@angular/*"
      angular-security:
        applies-to: security-updates
        patterns:
          - "@angular/*"
      taiga-ui:
        applies-to: version-updates
        patterns:
          - "@taiga-ui/*"
      taiga-ui-security:
        applies-to: security-updates
        patterns:
          - "@taiga-ui/*"
      frontend-linting:
        applies-to: version-updates
        patterns:
          - "eslint"
          - "@eslint/js"
          - "eslint-config-prettier"
          - "typescript-eslint"
          - "@typescript-eslint/eslint-plugin"
          - "@typescript-eslint/parser"
      frontend-linting-security:
        applies-to: security-updates
        patterns:
          - "eslint"
          - "@eslint/js"
          - "eslint-config-prettier"
          - "typescript-eslint"
          - "@typescript-eslint/eslint-plugin"
          - "@typescript-eslint/parser"
      vitest:
        applies-to: version-updates
        patterns:
          - "vitest"
          - "@vitest/coverage-v8"
      vitest-security:
        applies-to: security-updates
        patterns:
          - "vitest"
          - "@vitest/coverage-v8"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql:
        applies-to: version-updates
        patterns:
          - "github/codeql-action/*"
      codeql-security:
        applies-to: security-updates
        patterns:
          - "github/codeql-action/*"
