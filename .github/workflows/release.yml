name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Annotated SemVer tag to create (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify master release evidence
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      target_sha: ${{ steps.release.outputs.target_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify master, SemVer, changelog, and complete quality evidence
        id: release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: backend/src
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/master
          master_sha=$(gh api "repos/$GH_REPO/git/ref/heads/master" --jq '.object.sha')
          test "$TARGET_SHA" = "$master_sha"
          version=$(RELEASE_TAG="$RELEASE_TAG" TARGET_SHA="$TARGET_SHA" python3 - <<'PY'
          import os
          from backend.build_metadata import BuildMetadata
          print(BuildMetadata.create(os.environ["TARGET_SHA"], os.environ["RELEASE_TAG"]).identity)
          PY
          )
          escaped_version=${version//./\\.}
          test "$(grep -Ec "^## \\[$escaped_version\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md)" = 1
          quality_runs=$(gh api "repos/$GH_REPO/actions/workflows/quality.yml/runs?branch=master&head_sha=$TARGET_SHA&status=success&per_page=100")
          jq -e --arg sha "$TARGET_SHA" '
            any(.workflow_runs[];
              .head_sha == $sha and .head_branch == "master" and
              (.event == "schedule" or .event == "workflow_dispatch") and
              .conclusion == "success")
          ' <<<"$quality_runs" >/dev/null
          printf 'release_tag=%s\ntarget_sha=%s\n' "$RELEASE_TAG" "$TARGET_SHA" >> "$GITHUB_OUTPUT"

  product:
    name: Publish stable product artifacts
    needs: preflight
    uses: ./.github/workflows/product-publish.yml
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    with:
      channel: stable
      product_tag: ${{ needs.preflight.outputs.release_tag }}
      target_sha: ${{ needs.preflight.outputs.target_sha }}

  demo-publish:
    name: Publish stable demo pair
    needs: [preflight, product]
    uses: ./.github/workflows/demo-publish.yml
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      channel: stable
      product_tag: ${{ needs.preflight.outputs.release_tag }}
      target_sha: ${{ needs.preflight.outputs.target_sha }}

  demo-deploy:
    name: Deploy stable demo pair
    needs: [preflight, demo-publish]
    uses: ./.github/workflows/demo-deploy.yml
    permissions:
      actions: read
      attestations: read
      contents: read
      id-token: write
      packages: read
    with:
      operation: deploy
      promotion_channel: stable
      app_image: ${{ needs.demo-publish.outputs.app_image }}
      seed_image: ${{ needs.demo-publish.outputs.seed_image }}
      product_tag: ${{ needs.preflight.outputs.release_tag }}
      product_commit: ${{ needs.preflight.outputs.target_sha }}
      runtime_contract: ${{ needs.demo-publish.outputs.runtime_contract }}
      schema_fingerprint: ${{ needs.demo-publish.outputs.schema_fingerprint }}
      seed_revision: ${{ needs.demo-publish.outputs.seed_revision }}
