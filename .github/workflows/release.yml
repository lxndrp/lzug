name: Release

on:
  issues:
    types:
      - closed
  workflow_dispatch:
    inputs:
      release_issue:
        description: Open release gate issue to retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.issue.milestone.number || inputs.release_issue || github.run_id }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Read milestone and CI release evidence
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.issue.pull_request == null && !contains(github.event.issue.labels.*.name, 'type: release'))
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
      issues: write
    outputs:
      eligible: ${{ steps.release.outputs.eligible }}
      release_issue: ${{ steps.release.outputs.release_issue }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      target_sha: ${{ steps.release.outputs.target_sha }}
    steps:
      - name: Find the release gate and its canonical tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          INPUT_ISSUE: ${{ inputs.release_issue }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          ineligible() {
            printf 'eligible=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          }

          issue_number=${INPUT_ISSUE:-$EVENT_ISSUE}
          test -n "$issue_number" || ineligible
          issue=$(gh api "repos/$GH_REPO/issues/$issue_number")
          milestone_number=$(jq -r '.milestone.number // empty' <<<"$issue")
          release_tag=$(jq -r '.milestone.title // empty' <<<"$issue")
          test -n "$milestone_number" && test -n "$release_tag" || ineligible
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || ineligible

          issues=$(gh api "repos/$GH_REPO/issues?milestone=$milestone_number&state=all&per_page=100")
          open_regular=$(jq '[.[] | select(.state == "open" and (.pull_request | not) and ([.labels[].name] | index("type: release") | not))] | length' <<<"$issues")
          gates=$(jq '[.[] | select((.pull_request | not) and ([.labels[].name] | index("type: release")))]' <<<"$issues")

          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ $(jq -r '([.labels[].name] | index("type: release")) != null' <<<"$issue") == true ]] || ineligible
            [[ $(jq -r '.state' <<<"$issue") == open ]] || ineligible
            release_issue=$issue_number
          else
            [[ "$open_regular" == 0 ]] || ineligible
            gate_count=$(jq 'length' <<<"$gates")
            if [[ "$gate_count" == 0 ]]; then
              release_issue=$(gh issue create --repo "$GH_REPO" --title "Release: $release_tag" \
                --milestone "$release_tag" --label 'type: release' --label 'review:operations' \
                --body "Automatisch erzeugtes Release-Gate für \`$release_tag\`. Die Freigabe des Environments \`release\` startet die Veröffentlichung aus dem annotierten Tag." )
              release_issue=${release_issue##*/}
            elif [[ "$gate_count" == 1 ]]; then
              release_issue=$(jq -r '.[0].number' <<<"$gates")
              [[ $(jq -r '.[0].state' <<<"$gates") == open ]] || ineligible
            else
              echo "Milestone $release_tag has multiple release gates." >&2
              exit 1
            fi
          fi

          tag_ref="repos/$GH_REPO/git/ref/tags/$release_tag"
          if reference=$(gh api "$tag_ref" 2>/dev/null); then
            [[ $(jq -r '.object.type' <<<"$reference") == tag ]] || {
              echo "Existing release tag is not annotated." >&2
              exit 1
            }
            tag_object=$(gh api "repos/$GH_REPO/git/tags/$(jq -r '.object.sha' <<<"$reference")")
            [[ $(jq -r '.object.type' <<<"$tag_object") == commit ]] || {
              echo "Annotated release tag does not target a commit." >&2
              exit 1
            }
            target_sha=$(jq -r '.object.sha' <<<"$tag_object")
          else
            [[ "$open_regular" == 0 ]] || ineligible
            target_sha=$(gh api "repos/$GH_REPO/git/ref/heads/master" --jq '.object.sha')
            checks=$(gh api "repos/$GH_REPO/commits/$target_sha/check-runs?filter=latest&per_page=100")
            for check in \
              'Quality / Backend' \
              'Quality / Frontend' \
              'Quality / Operator CLI' \
              'Quality / OCI' \
              'Quality / Documentation' \
              'Quality / Security' \
              'Quality / Overall'; do
              jq -e --arg check "$check" --arg sha "$target_sha" \
                'any(.check_runs[]; .name == $check and .head_sha == $sha and .conclusion == "success")' \
                <<<"$checks" >/dev/null || {
                  echo "Required CI check is not successful for $target_sha: $check" >&2
                  exit 1
                }
            done
          fi

          printf 'eligible=true\nrelease_issue=%s\nrelease_tag=%s\ntarget_sha=%s\n' \
            "$release_issue" "$release_tag" "$target_sha" >> "$GITHUB_OUTPUT"

  publish:
    name: Tag and publish release artifacts
    needs: preflight
    if: needs.preflight.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
      issues: write
      packages: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_ISSUE: ${{ needs.preflight.outputs.release_issue }}
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
    steps:
      - name: Checkout the release target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}
          fetch-depth: 0

      - name: Create or reuse the annotated canonical tag
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git cat-file -t "$RELEASE_TAG")" = tag
            test "$(git rev-parse "$RELEASE_TAG^{}")" = "$TARGET_SHA"
          else
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              tag --annotate "$RELEASE_TAG" "$TARGET_SHA" --message "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          git checkout --detach "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Derive release metadata, notes, and OCI references
        id: release
        run: |
          set -euo pipefail
          version=$(python3 scripts/build_metadata.py --tag "$RELEASE_TAG" --revision "$TARGET_SHA" --field identity)
          image="ghcr.io/${GH_REPO,,}"
          {
            echo "version=$version"
            echo "image=$image"
            echo "canonical_ref=$image:$version"
            echo 'image_refs<<EOF'
            echo "$image:$version"
            if [[ "$RELEASE_TAG" != *-rc.* ]]; then
              IFS=. read -r major minor _ <<<"$version"
              echo "$image:$major.$minor"
              echo "$image:$major"
            fi
            echo "$image:sha-$TARGET_SHA"
            echo EOF
          } >> "$GITHUB_OUTPUT"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\] - " { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"

      - name: Set up UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked SBOM dependencies
        run: uv sync --locked --extra dev

      - name: Download Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse an existing version image when completing v0.1.0
        id: existing_image
        env:
          IMAGE_REFS: ${{ steps.release.outputs.image_refs }}
        run: |
          set -euo pipefail
          reference='${{ steps.release.outputs.canonical_ref }}'
          if docker pull "$reference"; then
            while IFS= read -r reference; do
              docker pull "$reference"
              test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$reference")" = '${{ steps.release.outputs.version }}'
              test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$reference")" = "$TARGET_SHA"
            done <<< "$IMAGE_REFS"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish OCI image from the tag
        if: steps.existing_image.outputs.exists != 'true'
        id: image_build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.release.outputs.image_refs }}
          build-args: |
            BUILD_IDENTITY=${{ steps.release.outputs.version }}
            RELEASE_TAG=${{ env.RELEASE_TAG }}
            VCS_REF=${{ env.TARGET_SHA }}
          cache-from: type=gha,scope=lzug-release-${{ runner.arch }}
          provenance: false
          sbom: false

      - name: Resolve the published image digest
        id: image
        run: |
          set -euo pipefail
          digest="sha256:$(docker buildx imagetools inspect '${{ steps.release.outputs.canonical_ref }}' --raw | sha256sum | cut -d ' ' -f 1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Build CLI archives and release SBOMs
        env:
          SYFT_BINARY: ${{ steps.syft.outputs.cmd }}
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE: ${{ steps.release.outputs.canonical_ref }}
        run: |
          set -euo pipefail
          mkdir -p release-assets/cli "$RUNNER_TEMP/lzug-cli-build"
          python3 scripts/build_cli_release.py \
            --version "$VERSION" --revision "$TARGET_SHA" --tag "$RELEASE_TAG" \
            --output release-assets/cli --work-dir "$RUNNER_TEMP/lzug-cli-build"
          python3 scripts/sbom.py generate-dependencies \
            --source-version "$VERSION" --output "release-assets/lzug-$VERSION.dependencies.sbom.cdx.json"
          python3 scripts/sbom.py generate-image \
            --image "$IMAGE" --output "release-assets/lzug-$VERSION.image.sbom.cdx.json"
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64 windows-arm64; do
            archive_stem="lzug-admin-$VERSION-$target"
            python3 scripts/sbom.py generate-cli \
              --source-version "$VERSION" --source-name "$archive_stem" \
              --artifact "$RUNNER_TEMP/lzug-cli-build/binaries/lzug-admin-$target" \
              --output "release-assets/cli/$archive_stem.sbom.cdx.json"
          done
          (
            cd release-assets/cli
            for asset in $(find . -maxdepth 1 -type f -printf '%f\n' | sort); do
              sha256sum "$asset"
            done
          ) > "release-assets/cli/lzug-admin-$VERSION.checksums.txt"

      - name: Attest CLI archives
        id: cli_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release-assets/cli/*.tar.gz
            release-assets/cli/*.zip
          show-summary: true

      - name: Attest OCI provenance and SBOM
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest OCI SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: release-assets/lzug-${{ steps.release.outputs.version }}.image.sbom.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Create or update the draft release
        run: |
          set -euo pipefail
          if draft=$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft --jq '.isDraft' 2>/dev/null); then
            test "$draft" = true || {
              echo "A published GitHub Release already exists for $RELEASE_TAG." >&2
              exit 1
            }
            gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --title "lzug ${{ steps.release.outputs.version }}" --notes-file release-notes.md
          else
            prerelease=()
            [[ "$RELEASE_TAG" == *-rc.* ]] && prerelease=(--prerelease)
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --verify-tag --draft "${prerelease[@]}" \
              --title "lzug ${{ steps.release.outputs.version }}" --notes-file release-notes.md
          fi

      - name: Upload release assets and publish
        run: |
          set -euo pipefail
          find release-assets -type f -print0 | sort -z | \
            xargs -0 gh release upload "$RELEASE_TAG" --repo "$GH_REPO" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false

      - name: Close the successful release gate
        run: |
          gh issue close "$RELEASE_ISSUE" --repo "$GH_REPO" --comment \
            "Release $RELEASE_TAG wurde veröffentlicht: $GITHUB_SERVER_URL/$GH_REPO/releases/tag/$RELEASE_TAG"
