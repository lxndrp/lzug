name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release authorization and quality
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      build-identity: ${{ steps.release.outputs.build_identity }}
      image: ${{ steps.release.outputs.image }}
      canonical-ref: ${{ steps.release.outputs.canonical_ref }}
    steps:
      - name: Checkout the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate SemVer and changelog entry
        id: release
        run: |
          python3 scripts/build_metadata.py \
            --tag "$GITHUB_REF_NAME" \
            --revision "$GITHUB_SHA" \
            --output build-metadata.json >/dev/null
          python3 scripts/release.py prepare \
            --tag "$GITHUB_REF_NAME" \
            --sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --changelog CHANGELOG.md \
            --notes release-notes.md \
            --tags release-tags.txt \
            --github-output "$GITHUB_OUTPUT"

      - name: Require the tagged commit on master
        run: |
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Require successful quality workflows for the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for workflow in ci.yml; do
            run_id=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow" \
              --commit "$GITHUB_SHA" \
              --event push \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
            if [ -z "$run_id" ]; then
              echo "No successful $workflow push run found for $GITHUB_SHA." >&2
              exit 1
            fi
            printf '%s: %s\n' "$workflow" "$run_id"
          done

  build-test:
    name: Build, smoke-test, and scan release image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CANONICAL_REF: ${{ needs.verify.outputs.canonical-ref }}
      VERSION: ${{ needs.verify.outputs.version }}
      BUILD_IDENTITY: ${{ needs.verify.outputs.build-identity }}
    steps:
      - name: Checkout the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache: true

      - name: Prepare release notes and expected tags
        run: >-
          python3 scripts/release.py prepare
          --tag "$GITHUB_REF_NAME"
          --sha "$GITHUB_SHA"
          --repository "$GITHUB_REPOSITORY"
          --changelog CHANGELOG.md
          --notes release-notes.md
          --tags expected-release-tags.txt

      - name: Derive all tags without latest
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long

      - name: Validate generated image tags
        run: |
          printf '%s\n' "${{ steps.metadata.outputs.tags }}" > release-tags.txt
          cmp expected-release-tags.txt release-tags.txt
          python3 scripts/release.py check-tags \
            --tag "$GITHUB_REF_NAME" \
            --sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --tags release-tags.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the release image once
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            BUILD_IDENTITY=${{ env.BUILD_IDENTITY }}
            RELEASE_TAG=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/lzug-release-image.tar
          cache-from: type=gha,scope=lzug-oci-${{ runner.arch }}
          provenance: false
          sbom: false

      - name: Load and validate every tag on the exact image
        run: |
          docker load --input "${{ runner.temp }}/lzug-release-image.tar"
          expected_id=$(docker image inspect --format '{{.Id}}' "$CANONICAL_REF")
          while IFS= read -r reference; do
            test "$(docker image inspect --format '{{.Id}}' "$reference")" = "$expected_id"
          done < release-tags.txt
          test "$(docker image inspect --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}' "$CANONICAL_REF")" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{.Config.User}}' "$CANONICAL_REF")" = "10001:10001"

      - name: Test the exact release image
        run: |
          test "$(docker run --rm --entrypoint python "$CANONICAL_REF" -c 'import json; print(json.load(open("/app/build-metadata.json"))["identity"])')" = "$VERSION"
          scripts/container-smoke.sh "$CANONICAL_REF"

      - name: Compare release image and operator CLI identity
        run: |
          go build -trimpath \
            -ldflags="-s -w -X main.applicationVersion=$BUILD_IDENTITY -X main.applicationRevision=$GITHUB_SHA -X main.applicationTag=$GITHUB_REF_NAME" \
            -o lzug-admin ./cmd/lzug-admin
          docker run --rm --entrypoint cat "$CANONICAL_REF" \
            /app/build-metadata.json > image-build-metadata.json
          ./lzug-admin --build-metadata > cli-build-metadata.json
          cmp image-build-metadata.json cli-build-metadata.json

      - name: Generate release CycloneDX SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.69.3
          image-ref: ${{ env.CANONICAL_REF }}
          format: cyclonedx
          output: lzug.sbom.cdx.json
          scanners: vuln
          exit-code: "0"
          hide-progress: true

      - name: Validate the release SBOM
        run: >-
          python3 -c 'import json; from pathlib import Path;
          payload=json.loads(Path("lzug.sbom.cdx.json").read_text());
          assert payload["bomFormat"] == "CycloneDX";
          assert payload.get("components"), "SBOM contains no components"'

      - name: Block high and critical image findings
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.69.3
          image-ref: ${{ env.CANONICAL_REF }}
          scanners: vuln,secret,misconfig
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

      - name: Checksum the tested release inputs
        working-directory: ${{ runner.temp }}
        run: |
          cp "$GITHUB_WORKSPACE/lzug.sbom.cdx.json" .
          cp "$GITHUB_WORKSPACE/release-notes.md" .
          cp "$GITHUB_WORKSPACE/release-tags.txt" .
          sha256sum \
            lzug-release-image.tar \
            lzug.sbom.cdx.json \
            release-notes.md \
            release-tags.txt > release-inputs.sha256

      - name: Upload the tested release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lzug-release-inputs
          path: |
            ${{ runner.temp }}/lzug-release-image.tar
            ${{ runner.temp }}/lzug.sbom.cdx.json
            ${{ runner.temp }}/release-notes.md
            ${{ runner.temp }}/release-tags.txt
            ${{ runner.temp }}/release-inputs.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish GHCR image and GitHub release
    needs:
      - verify
      - build-test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      IMAGE: ${{ needs.verify.outputs.image }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the tested release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lzug-release-inputs
          path: ${{ runner.temp }}/lzug-release-inputs

      - name: Verify and load the tested image
        working-directory: ${{ runner.temp }}/lzug-release-inputs
        run: |
          sha256sum --check release-inputs.sha256
          docker load --input lzug-release-image.tar

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push all tags and require one digest
        id: publish
        working-directory: ${{ runner.temp }}/lzug-release-inputs
        run: |
          set -eu
          while IFS= read -r reference; do
            docker push "$reference"
          done < release-tags.txt

          digest=
          while IFS= read -r reference; do
            current="sha256:$(docker buildx imagetools inspect "$reference" --raw | sha256sum | cut -d ' ' -f 1)"
            if [ -z "$digest" ]; then
              digest=$current
            else
              test "$current" = "$digest"
            fi
          done < release-tags.txt
          test -n "$digest"
          printf 'digest=%s\n' "$digest" | tee -a "$GITHUB_OUTPUT"

      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest the CycloneDX SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: ${{ runner.temp }}/lzug-release-inputs/lzug.sbom.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify anonymous GHCR access
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect "$IMAGE@${{ steps.publish.outputs.digest }}" >/dev/null

      - name: Assemble release evidence and notes
        working-directory: ${{ runner.temp }}/lzug-release-inputs
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          PROVENANCE_URL: ${{ steps.provenance.outputs.attestation-url }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
          SBOM_URL: ${{ steps.sbom.outputs.attestation-url }}
        run: |
          cp "$PROVENANCE_BUNDLE" "lzug-$VERSION.provenance.json"
          cp "$SBOM_BUNDLE" "lzug-$VERSION.sbom-attestation.json"
          mv lzug.sbom.cdx.json "lzug-$VERSION.sbom.cdx.json"
          python3 "$GITHUB_WORKSPACE/scripts/release.py" finalize \
            --base release-notes.md \
            --output release-information.md \
            --tags release-tags.txt \
            --image "$IMAGE" \
            --digest "${{ steps.publish.outputs.digest }}" \
            --sbom-asset "lzug-$VERSION.sbom.cdx.json" \
            --provenance-url "$PROVENANCE_URL" \
            --sbom-url "$SBOM_URL" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --repository "$GITHUB_REPOSITORY"
          sha256sum \
            "lzug-$VERSION.sbom.cdx.json" \
            "lzug-$VERSION.provenance.json" \
            "lzug-$VERSION.sbom-attestation.json" > "lzug-$VERSION.checksums.txt"

      - name: Create or update the draft release
        working-directory: ${{ runner.temp }}/lzug-release-inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if state=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$state" = "true"
            gh release edit "$GITHUB_REF_NAME" \
              --title "lzug $VERSION" \
              --notes-file release-information.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              --title "lzug $VERSION" \
              --notes-file release-information.md
          fi

      - name: Upload all release evidence
        working-directory: ${{ runner.temp }}/lzug-release-inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "lzug-$VERSION.sbom.cdx.json#CycloneDX SBOM" \
            "lzug-$VERSION.provenance.json#Signed build provenance" \
            "lzug-$VERSION.sbom-attestation.json#Signed SBOM attestation" \
            "lzug-$VERSION.checksums.txt#Release evidence checksums"

      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
