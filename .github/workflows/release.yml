name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Annotated SemVer tag to create (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify master release evidence
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      target_sha: ${{ steps.release.outputs.target_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify master, SemVer, changelog, and complete quality evidence
        id: release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = refs/heads/master || {
            echo "Release must be dispatched from master." >&2
            exit 1
          }
          master_sha=$(gh api "repos/$GH_REPO/git/ref/heads/master" --jq '.object.sha')
          test "$TARGET_SHA" = "$master_sha" || {
            echo "Dispatched commit is no longer the current master SHA." >&2
            exit 1
          }

          version=$(RELEASE_TAG="$RELEASE_TAG" TARGET_SHA="$TARGET_SHA" python3 - <<'PY'
          import os
          from backend.build_metadata import BuildMetadata

          print(BuildMetadata.create(os.environ["TARGET_SHA"], os.environ["RELEASE_TAG"]).identity)
          PY
          )
          escaped_version=${version//./\\.}
          test "$(grep -Ec "^## \\[$escaped_version\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md)" = 1 || {
            echo "CHANGELOG.md must contain exactly one dated section for $version." >&2
            exit 1
          }

          quality_runs=$(gh api \
            "repos/$GH_REPO/actions/workflows/quality.yml/runs?branch=master&head_sha=$TARGET_SHA&status=success&per_page=100")
          jq -e --arg sha "$TARGET_SHA" '
            any(.workflow_runs[];
              .head_sha == $sha and
              .head_branch == "master" and
              .conclusion == "success")
          ' <<<"$quality_runs" >/dev/null || {
            echo "No successful complete Quality workflow exists for master SHA $TARGET_SHA." >&2
            exit 1
          }

          printf 'release_tag=%s\ntarget_sha=%s\n' "$RELEASE_TAG" "$TARGET_SHA" >> "$GITHUB_OUTPUT"

  publish:
    name: Tag and publish release artifacts
    needs: preflight
    runs-on: ubuntu-latest
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
    steps:
      - name: Checkout the approved master commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}
          fetch-depth: 0

      - name: Create or reuse the annotated canonical tag
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git cat-file -t "$RELEASE_TAG")" = tag || {
              echo "Existing release tag is not annotated." >&2
              exit 1
            }
            test "$(git rev-parse "$RELEASE_TAG^{}")" = "$TARGET_SHA" || {
              echo "Existing release tag points to a different commit." >&2
              exit 1
            }
          else
            git -c user.name=github-actions \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              tag --annotate "$RELEASE_TAG" "$TARGET_SHA" --message "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Checkout the canonical tag
        run: |
          set -euo pipefail
          git checkout --detach "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Derive tag-bound release metadata and OCI references
        id: release
        run: |
          set -euo pipefail
          version=$(python3 scripts/build_metadata.py \
            --tag "$RELEASE_TAG" --revision "$TARGET_SHA" --field identity)
          image="ghcr.io/${GH_REPO,,}"
          {
            echo "version=$version"
            echo "image=$image"
            echo "canonical_ref=$image:$version"
            echo 'image_refs<<EOF'
            echo "$image:$version"
            if [[ "$RELEASE_TAG" != *-rc.* ]]; then
              IFS=. read -r major minor _ <<<"$version"
              echo "$image:$major.$minor"
              echo "$image:$major"
            fi
            echo "$image:sha-$TARGET_SHA"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Reject an already published release
        run: |
          set -euo pipefail
          if draft=$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" \
            --json isDraft --jq '.isDraft' 2>/dev/null); then
            test "$draft" = true || {
              echo "A published GitHub Release is terminal and will not be changed." >&2
              exit 1
            }
          fi

      - name: Extract release notes from the tagged changelog
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '
            index($0, "## [" version "] - ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: operator-cli/go.sum

      - name: Set up GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"

      - name: Set up UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install locked SBOM dependencies
        run: uv sync --locked --extra dev

      - name: Download Syft
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the OCI image from the tag
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.release.outputs.image_refs }}
          build-args: |
            BUILD_IDENTITY=${{ steps.release.outputs.version }}
            RELEASE_TAG=${{ env.RELEASE_TAG }}
            VCS_REF=${{ env.TARGET_SHA }}
          cache-from: type=gha,scope=lzug-release-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=lzug-release-${{ runner.arch }}
          provenance: false
          sbom: false

      - name: Build CLI archives and the aggregate release SBOM
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_NAME: ${{ steps.release.outputs.image }}
          SYFT_BINARY: ${{ steps.syft.outputs.cmd }}
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE: ${{ steps.release.outputs.canonical_ref }}
        run: |
          set -euo pipefail
          detailed_sboms="$RUNNER_TEMP/lzug-release-sboms"
          subject_checksums="$RUNNER_TEMP/lzug-release-subjects.checksums.txt"
          mkdir -p release-assets/cli "$detailed_sboms/cli"
          (cd operator-cli && goreleaser release --clean)
          cp operator-cli/dist/lzug-admin-"$VERSION"-*.tar.gz operator-cli/dist/lzug-admin-"$VERSION"-*.zip \
            release-assets/cli/
          python3 scripts/sbom.py generate-dependencies \
            --source-version "$VERSION" --output "$detailed_sboms/dependencies.cdx.json"
          python3 scripts/sbom.py generate-image \
            --image "$IMAGE" --output "$detailed_sboms/image.cdx.json"
          aggregate_inputs=(
            --input "$detailed_sboms/dependencies.cdx.json"
            --input "$detailed_sboms/image.cdx.json"
          )
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64 windows-arm64; do
            archive_stem="lzug-admin-$VERSION-$target"
            goos="${target%-*}"
            goarch="${target#*-}"
            binary=$(jq -er --arg goos "$goos" --arg goarch "$goarch" \
              '.[] | select(.type == "Binary" and .goos == $goos and .goarch == $goarch) | .path' \
              operator-cli/dist/artifacts.json)
            binary="operator-cli/$binary"
            python3 scripts/sbom.py generate-cli \
              --source-version "$VERSION" --source-name "$archive_stem" \
              --artifact "$binary" --output "$detailed_sboms/cli/$archive_stem.cdx.json"
            aggregate_inputs+=(--input "$detailed_sboms/cli/$archive_stem.cdx.json")
          done
          python3 scripts/sbom.py aggregate \
            "${aggregate_inputs[@]}" \
            --source-version "$VERSION" --release-tag "$RELEASE_TAG" --revision "$TARGET_SHA" \
            --output "release-assets/lzug-$VERSION.sbom.cdx.json"
          python3 scripts/sbom.py validate \
            --kind release --input "release-assets/lzug-$VERSION.sbom.cdx.json"
          (
            cd release-assets/cli
            for asset in ./*.tar.gz ./*.zip; do
              sha256sum "${asset#./}"
            done
          ) > "$subject_checksums"
          printf '%s  %s\n' "${IMAGE_DIGEST#sha256:}" "$IMAGE_NAME" >> "$subject_checksums"

      - name: Attest CLI archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release-assets/cli/*.tar.gz
            release-assets/cli/*.zip
          show-summary: true

      - name: Attest the aggregate release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: ${{ runner.temp }}/lzug-release-subjects.checksums.txt
          sbom-path: release-assets/lzug-${{ steps.release.outputs.version }}.sbom.cdx.json
          show-summary: true

      - name: Attest OCI provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest the OCI SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: ${{ runner.temp }}/lzug-release-sboms/image.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Create or update the draft release
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GH_REPO" \
              --title "lzug ${{ steps.release.outputs.version }}" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            prerelease=()
            [[ "$RELEASE_TAG" == *-rc.* ]] && prerelease=(--prerelease)
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --verify-tag --draft \
              "${prerelease[@]}" --title "lzug ${{ steps.release.outputs.version }}" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Upload the seven release assets and publish last
        run: |
          set -euo pipefail
          find release-assets -type f -print0 | sort -z | \
            xargs -0 gh release upload "$RELEASE_TAG" --repo "$GH_REPO" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false

  promote-demo:
    name: Promote stable release to public demo
    if: ${{ !contains(needs.preflight.outputs.release_tag, '-rc.') }}
    needs: [preflight, publish]
    uses: ./.github/workflows/demo-promote.yml
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      product_tag: ${{ needs.preflight.outputs.release_tag }}
