name: Wiki post-publish check

on:
  gollum:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check published Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository checks
        uses: actions/checkout@v7

      - name: Checkout published Wiki default branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: published-wiki
          persist-credentials: false

      - name: Check portable Markdown and public-safety policy
        run: python3 scripts/check_wiki.py published-wiki --sitemap "$RUNNER_TEMP/sitemap.xml"

      - name: Check Wiki source links with Lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          workingDirectory: published-wiki
          args: --fallback-extensions md --no-progress '*.md'

      - name: Check published Wiki routes from the generated sitemap
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --max-redirects 0 --no-progress "${{ runner.temp }}/sitemap.xml"

      - name: Upload generated sitemap for diagnostics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wiki-sitemap
          path: ${{ runner.temp }}/sitemap.xml
          if-no-files-found: warn
          retention-days: 7
