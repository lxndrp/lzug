name: Wiki post-publish check

on:
  gollum:
  workflow_dispatch:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check published Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository checks
        uses: actions/checkout@v7

      - name: Checkout published Wiki default branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: published-wiki
          persist-credentials: false

      - name: Check portable Markdown and public-safety policy
        run: python3 scripts/check_wiki.py published-wiki

      - name: Check published Wiki with Gollum
        run: >-
          docker run --rm --network none --user "$(id -u):$(id -g)" --entrypoint ruby
          -v "$PWD:/workspace:ro" -w /workspace
          ghcr.io/gollum/gollum@sha256:6dc5ba588bca0d7c5a5964e0537d0ee4cfa7d0738959b530f9bebaa776d1c641
          scripts/check_wiki.rb published-wiki

      - name: Check rendered GitHub Wiki routes
        run: >-
          python3 scripts/check_wiki_http.py published-wiki
          "https://github.com/${{ github.repository }}/wiki"
