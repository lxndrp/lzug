name: Wiki post-publish check

on:
  gollum:

permissions:
  contents: read

concurrency:
  group: wiki-post-publish
  cancel-in-progress: true

jobs:
  check:
    name: Check published Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout published Wiki default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}.wiki
          path: published-wiki
          persist-credentials: false

      - name: Derive published routes from the Wiki sidebar
        run: python3 scripts/check_wiki.py published-wiki --routes "$RUNNER_TEMP/wiki-routes.md"

      - name: Check published Wiki routes without redirects
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --max-redirects 0 --no-progress "${{ runner.temp }}/wiki-routes.md"
