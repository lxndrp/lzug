name: Wiki pre-publish check

on:
  workflow_dispatch:
    inputs:
      wiki_ref:
        description: "Branch, tag, or commit in the separate Wiki repository to review"
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Check Wiki candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository checks
        uses: actions/checkout@v7

      - name: Checkout Wiki candidate
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          ref: ${{ inputs.wiki_ref }}
          path: wiki-candidate
          persist-credentials: false

      - name: Check portable Markdown and public-safety policy
        run: python3 scripts/check_wiki.py wiki-candidate --sitemap "$RUNNER_TEMP/sitemap.xml"

      - name: Check Wiki source links with Lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          workingDirectory: wiki-candidate
          args: --fallback-extensions md --no-progress '*.md'
