name: Quality

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current master SHA to verify for the next release
        required: true
        type: string
      force_full:
        description: Run deterministic Quality jobs even when recent evidence exists
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

env:
  IMAGE_REF: lzug-app:0.0.0-dev.local
  QUALITY_REVISION: ${{ github.sha }}

concurrency:
  group: quality-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  workflows:
    name: GitHub Actions workflows
    needs: revision
    if: needs.revision.outputs.decision == 'execute'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
      - run: mise install aqua:go-task/task@3.52.0 aqua:rhysd/actionlint@1.7.12
      - run: mise exec --no-deps aqua:go-task/task@3.52.0 aqua:rhysd/actionlint@1.7.12 -- task quality:workflows

  revision:
    name: Bind complete evidence to master
    runs-on: ubuntu-24.04
    outputs:
      decision: ${{ steps.evidence.outputs.decision }}
      source_run_id: ${{ steps.evidence.outputs.source_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/master
          if test "$GITHUB_EVENT_NAME" = workflow_dispatch; then
            test "$EXPECTED_SHA" = "$GITHUB_SHA" || {
              echo "Master changed or expected_sha is missing; dispatch the intended master SHA again." >&2
              exit 1
            }
          fi
      - name: Select reusable complete evidence
        id: evidence
        env:
          CURRENT_RUN_ID: ${{ github.run_id }}
          FORCE_FULL: ${{ inputs.force_full || false }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GH_REPO/actions/workflows/quality.yml/runs?branch=master&per_page=100" > "$RUNNER_TEMP/quality-runs.json"
          gh api --paginate --slurp "repos/$GH_REPO/actions/artifacts?per_page=100" > "$RUNNER_TEMP/quality-artifacts.json"
          args=(
            --runs "$RUNNER_TEMP/quality-runs.json"
            --artifacts "$RUNNER_TEMP/quality-artifacts.json"
            --sha "$TARGET_SHA"
            --current-run-id "$CURRENT_RUN_ID"
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --required-artifact quality-evidence-v2
            --required-artifact backend-coverage
            --required-artifact frontend-coverage
            --required-artifact lzug-documentation
            --required-artifact lzug-sboms
          )
          if test "$FORCE_FULL" = true; then
            args+=(--force-full)
          fi
          python3 scripts/quality_evidence.py "${args[@]}" > "$RUNNER_TEMP/quality-decision.json"
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/quality-decision.json"
          decision=$(jq -r .decision "$RUNNER_TEMP/quality-decision.json")
          source_run_id=$(jq -r '.run_id // ""' "$RUNNER_TEMP/quality-decision.json")
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$source_run_id" >> "$GITHUB_OUTPUT"
          test "$decision" != in_progress || {
            echo "A matching Quality run is already active; no duplicate full run is started." >&2
            exit 1
          }

  backend:
    name: Backend
    needs: revision
    if: needs.revision.outputs.decision == 'execute'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - run: uv sync --locked --extra dev
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: operator-cli/go.sum
      - name: Build the operator CLI socket test binary once
        working-directory: operator-cli
        run: go test -c -o "$RUNNER_TEMP/lzug-admin-socket-tests" ./internal/admincli
      - env:
          LZUG_SOCKET_TEST_BINARY: ${{ runner.temp }}/lzug-admin-socket-tests
        run: task backend:quality
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend
    needs: revision
    if: needs.revision.outputs.decision == 'execute'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
      - run: mise install aqua:PowerShell/PowerShell@7.5.3
      - run: npm ci --prefix frontend
      - run: task brand:check frontend:quality
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: frontend/coverage/frontend/lcov.info
          if-no-files-found: error
          retention-days: 7

  transport:
    name: OpenAPI transport drift
    needs: revision
    if: needs.revision.outputs.decision == 'execute'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
      - run: mise install aqua:PowerShell/PowerShell@7.5.3
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - run: uv sync --locked --extra dev && npm ci --prefix frontend
      - run: task frontend:transport

  docs:
    name: Documentation
    needs: revision
    if: needs.revision.outputs.decision == 'execute'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - run: uv sync --locked --extra dev && npm ci --prefix frontend
      - run: task docs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lzug-documentation
          path: site
          if-no-files-found: error
          retention-days: 7

  cli:
    name: CLI
    needs: revision
    if: needs.revision.outputs.decision == 'execute'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: operator-cli/go.sum
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - run: task operator:quality quality:operator-packaging-and-reproducibility

  infra:
    name: Infrastructure
    needs: revision
    if: needs.revision.outputs.decision == 'execute'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - run: task quality:infra

  delivery:
    name: Delivery and demo contracts
    needs: revision
    if: needs.revision.outputs.decision == 'execute'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - run: uv sync --locked --extra dev
      - run: task delivery:test demo:test delivery:tooling

  container:
    name: Container
    needs: revision
    if: needs.revision.outputs.decision == 'execute'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: operator-cli/go.sum
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
      - run: mise install aqua:PowerShell/PowerShell@7.5.3
      - run: uv sync --locked --extra dev
      - id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.0
      - env:
          SYFT_BINARY: ${{ steps.syft.outputs.cmd }}
        run: task quality:oci quality:pester quality:demo
      - name: Publish Pester test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pester-results
          path: build/quality/pester/pester.xml
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lzug-sboms
          path: |
            build/quality/lzug.image.sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          version: v0.69.3
          image-ref: ${{ env.IMAGE_REF }}
          scanners: vuln,secret,misconfig
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

  e2e:
    name: Browser E2E
    needs: revision
    if: needs.revision.outputs.decision == 'execute'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - id: playwright-version
        run: node -e "console.log('version=' + require('./frontend/package-lock.json').packages['node_modules/@playwright/test'].version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
      - run: |
          uv sync --locked --extra dev
          npm ci --prefix frontend
          cd frontend && npx playwright install --with-deps chromium firefox webkit
      - name: Enable the Chromium user-namespace sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 0
      - run: npm --prefix frontend run test:e2e
      - run: npm --prefix frontend run test:ui-review
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-e2e-report
          path: frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7

  a11y:
    name: Accessibility
    needs: revision
    if: needs.revision.outputs.decision == 'execute'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - id: playwright-version
        run: node -e "console.log('version=' + require('./frontend/package-lock.json').packages['node_modules/@playwright/test'].version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
      - run: |
          uv sync --locked --extra dev
          npm ci --prefix frontend
          cd frontend && npx playwright install --with-deps chromium
      - name: Enable the Chromium user-namespace sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 0
      - run: npm --prefix frontend run test:a11y
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-a11y-report
          path: frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7

  codeql:
    needs: revision
    if: needs.revision.outputs.decision == 'execute'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write
    with:
      languages: '["python","javascript-typescript","go"]'
      revision: ${{ github.sha }}

  source-scan:
    name: Source secrets and misconfiguration
    needs: revision
    if: needs.revision.outputs.decision == 'execute' || needs.revision.outputs.decision == 'reused'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
          skip-dirs: .git,.venv,frontend/node_modules

  audits:
    name: Time-dependent security audits
    needs: revision
    if: needs.revision.outputs.decision == 'execute' || needs.revision.outputs.decision == 'reused'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - run: npm ci --prefix frontend
      - run: uv sync --locked --extra dev
      - run: task quality:security
      - name: Record reused evidence origin
        if: needs.revision.outputs.decision == 'reused'
        env:
          SOURCE_RUN_ID: ${{ needs.revision.outputs.source_run_id }}
        run: echo "Deterministic Quality evidence reused from run $SOURCE_RUN_ID; time-dependent security audit executed now." >> "$GITHUB_STEP_SUMMARY"

  complete-evidence:
    name: Record complete Quality evidence
    needs: [revision, workflows, backend, frontend, transport, docs, cli, infra, delivery, container, e2e, a11y, codeql, source-scan, audits]
    if: >-
      always() && needs.revision.outputs.decision == 'execute' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      !contains(needs.*.result, 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: Write immutable evidence marker
        env:
          QUALITY_REVISION: ${{ github.sha }}
          QUALITY_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p build/quality-evidence
          jq -n --arg revision "$QUALITY_REVISION" --arg run_id "$QUALITY_RUN_ID" \
            '{contract: "quality-evidence-v2", revision: $revision, run_id: ($run_id | tonumber)}' \
            > build/quality-evidence/quality-evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-evidence-v2
          path: build/quality-evidence/quality-evidence.json
          if-no-files-found: error
          retention-days: 30
