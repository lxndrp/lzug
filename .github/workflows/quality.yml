name: Quality

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current master SHA to verify for the next release
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE_REF: lzug:0.0.0-dev.local
  QUALITY_REVISION: ${{ github.sha }}

concurrency:
  group: quality-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  revision:
    name: Bind complete evidence to master
    runs-on: ubuntu-latest
    steps:
      - env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/master
          if test "$GITHUB_EVENT_NAME" = workflow_dispatch; then
            test "$EXPECTED_SHA" = "$GITHUB_SHA" || {
              echo "Master changed or expected_sha is missing; dispatch the intended master SHA again." >&2
              exit 1
            }
          fi

  fixtures:
    name: Synthetic fixture adapters
    needs: revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked --extra dev
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - run: task fixtures:check test:fixtures

  backend:
    name: Backend
    needs: revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - run: uv sync --locked --extra dev
      - run: task quality:backend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend
    needs: revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - run: npm ci --prefix frontend
      - run: task brand:check quality:frontend quality:security
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: frontend/coverage/frontend/lcov.info
          if-no-files-found: error
          retention-days: 7

  docs:
    name: Documentation
    needs: revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - run: uv sync --locked --extra dev && npm ci --prefix frontend
      - run: task docs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lzug-documentation
          path: site
          if-no-files-found: error
          retention-days: 7

  cli:
    name: CLI
    needs: revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: operator-cli/go.sum
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked --extra dev
      - id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.0
      - env:
          SYFT_BINARY: ${{ steps.syft.outputs.cmd }}
        run: task quality:operator quality:operator-packaging

  infra:
    name: Infrastructure
    needs: revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - run: task quality:infra

  delivery:
    name: Delivery and demo contracts
    needs: revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - run: uv sync --locked --extra dev
      - run: task test:delivery test:demo test:tooling

  container:
    name: Container
    needs: revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: operator-cli/go.sum
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - run: uv sync --locked --extra dev
      - id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.0
      - env:
          SYFT_BINARY: ${{ steps.syft.outputs.cmd }}
        run: task quality:oci quality:container quality:compose quality:operator-container quality:demo test:oci
      - name: Generate and validate the dependency SBOM
        env:
          SYFT_BINARY: ${{ steps.syft.outputs.cmd }}
        run: task quality:sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lzug-sboms
          path: |
            build/quality/lzug.dependencies.sbom.cdx.json
            build/quality/lzug.image.sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          version: v0.69.3
          image-ref: ${{ env.IMAGE_REF }}
          scanners: vuln,secret,misconfig
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

  e2e:
    name: Browser E2E
    needs: revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - id: playwright-version
        run: node -e "console.log('version=' + require('./frontend/package-lock.json').packages['node_modules/@playwright/test'].version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
      - run: |
          uv sync --locked --extra dev
          npm ci --prefix frontend
          cd frontend && npx playwright install --with-deps chromium firefox webkit
      - name: Enable the Chromium user-namespace sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 0
      - run: npm --prefix frontend run test:e2e
      - run: npm --prefix frontend run test:ui-review
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-e2e-report
          path: frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7

  a11y:
    name: Accessibility
    needs: revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - id: playwright-version
        run: node -e "console.log('version=' + require('./frontend/package-lock.json').packages['node_modules/@playwright/test'].version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
      - run: |
          uv sync --locked --extra dev
          npm ci --prefix frontend
          cd frontend && npx playwright install --with-deps chromium
      - name: Enable the Chromium user-namespace sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 0
      - run: npm --prefix frontend run test:a11y
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-a11y-report
          path: frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7

  codeql:
    needs: revision
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write
    with:
      languages: '["python","javascript-typescript","go"]'
      revision: ${{ github.sha }}

  source-scan:
    name: Source secrets and misconfiguration
    needs: revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
          skip-dirs: .git,.venv,frontend/node_modules
