name: Public site

on:
  pull_request:
    branches:
      - master
    paths: &publication-paths
      - ".github/workflows/publication.yml"
      - ".mise.toml"
      - "frontend/.node-version"
      - ".python-version"
      - "Taskfile.yml"
      - "backend/**"
      - "db/schema.sql"
      - "docs/**"
      - "frontend/e2e/run-playwright.mjs"
      - "frontend/e2e/serve-publication.mjs"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/playwright.publication.config.ts"
      - "frontend/publication-e2e/**"
      - "frontend/public/**"
      - "frontend/src/**"
      - "frontend/tsconfig*.json"
      - "docs/mkdocs.yml"
      - "docs/publication/**"
      - "pyproject.toml"
      - "docs/publication.py"
      - "scripts/validate_demo_url_contract.py"
      - "uv.lock"
  push:
    branches:
      - master
    paths: *publication-paths
  schedule:
    - cron: "29 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_URL: https://lzug.repertoire.papaspyrou.name
  DEMO_URL: ${{ vars.DEMO_URL || 'https://demo.example.invalid' }}

jobs:
  build:
    name: Build or reproduce static artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate the manual publication gate
        if: github.event_name == 'workflow_dispatch'
        run: |
          test "$GITHUB_REF" = "refs/heads/master" || {
            echo "Public site deployment may only be dispatched from master." >&2
            exit 1
          }

      - name: Validate the effective DEMO_URL before manual publication
        if: github.event_name == 'workflow_dispatch'
        env:
          EFFECTIVE_DEMO_URL: ${{ env.DEMO_URL }}
        run: >-
          python3 -m demo.contract validate-url
          --canonical --value "$EFFECTIVE_DEMO_URL"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
          cache: true

      - name: Install locked build dependencies
        run: |
          mise install hugo-extended@0.165.0
          uv sync --locked --extra dev
          npm ci --prefix frontend

      - name: Verify reproducible public artifact
        if: github.event_name == 'schedule'
        run: mise x hugo-extended@0.165.0 -- task docs:publication:check DEMO_URL="$DEMO_URL" BASE_URL="$BASE_URL"

      - name: Build public artifact
        if: github.event_name != 'schedule'
        run: mise x hugo-extended@0.165.0 -- task docs:publication DEMO_URL="$DEMO_URL" BASE_URL="$BASE_URL"

      - name: Check responsive themes and warm-up flow with Playwright
        if: github.event_name != 'schedule'
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: npm --prefix frontend run test:publication

      - name: Check public-site accessibility with Playwright and axe
        if: github.event_name != 'schedule'
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: npm --prefix frontend run test:publication:a11y

      - name: Upload checked artifact
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lzug-public-site
          path: build/publication
          if-no-files-found: error
          retention-days: 7

      - name: Prepare Pages deployment artifact after the manual gate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/publication
          include-hidden-files: true
          retention-days: 1

      - name: Upload browser evidence on failure
        if: failure() && github.event_name != 'schedule'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-site-browser-evidence
          path: |
            frontend/playwright-publication-browser-report
            frontend/playwright-publication-a11y-report
            build/publication-evidence
          if-no-files-found: warn
          retention-days: 7

  deploy:
    name: Deploy manually approved artifact
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify that Pages was configured after the separate Maintainer GO
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false

      - name: Deploy the checked artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
