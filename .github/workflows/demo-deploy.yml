name: Deploy public demo

on:
  workflow_call:
    inputs:
      operation:
        description: Deploy a verified pair or explicitly roll back to a known pair
        required: true
        type: string
      promotion_channel:
        description: Automatic caller identity (stable or snapshot)
        required: true
        type: string
      app_image:
        description: Immutable ghcr.io/lxndrp/lzug-demo-app@sha256 digest
        required: true
        type: string
      seed_image:
        description: Immutable ghcr.io/lxndrp/lzug-demo-seed@sha256 digest
        required: true
        type: string
      product_tag:
        description: Release or snapshot source tag shared by the verified pair
        required: true
        type: string
      product_commit:
        description: Full 40-character product commit shared by the pair
        required: true
        type: string
      runtime_contract:
        description: Versioned runtime contract from both attested image manifests
        required: true
        type: string
      schema_fingerprint:
        description: Full schema fingerprint from the verified seed manifest
        required: true
        type: string
      seed_revision:
        description: Full seed revision from the verified pair manifests
        required: true
        type: string
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy a newly approved pair or explicitly roll back to a known pair
        required: true
        type: choice
        options:
          - deploy
          - rollback
      app_image:
        description: Immutable ghcr.io/lxndrp/lzug-demo-app@sha256 digest
        required: true
        type: string
      seed_image:
        description: Immutable ghcr.io/lxndrp/lzug-demo-seed@sha256 digest
        required: true
        type: string
      product_tag:
        description: Release or snapshot source tag shared by the verified pair
        required: true
        type: string
      product_commit:
        description: Full 40-character product commit shared by the pair
        required: true
        type: string
      runtime_contract:
        description: Versioned runtime contract from both attested image manifests
        required: true
        type: string
      schema_fingerprint:
        description: Full schema fingerprint from the verified seed manifest
        required: true
        type: string
      seed_revision:
        description: Full seed revision from the verified seed manifest
        required: true
        type: string

permissions: {}

concurrency:
  group: demo-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.operation == 'rollback' && 'Roll back public demo' || 'Deploy public demo' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: demo
      url: ${{ vars.DEMO_URL }}
    permissions:
      actions: read
      attestations: read
      contents: read
      id-token: write
      packages: read
    env:
      APP_IMAGE: ${{ inputs.app_image }}
      SEED_IMAGE: ${{ inputs.seed_image }}
      PRODUCT_TAG: ${{ inputs.product_tag }}
      PRODUCT_COMMIT: ${{ inputs.product_commit }}
      RUNTIME_CONTRACT: ${{ inputs.runtime_contract }}
      SCHEMA_FINGERPRINT: ${{ inputs.schema_fingerprint }}
      SEED_REVISION: ${{ inputs.seed_revision }}
      DEMO_URL: ${{ vars.DEMO_URL }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate immutable platform inputs
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_CONTAINER_APP; do
            test -n "${!name:-}" || {
              echo "Required demo deployment variable is missing: $name" >&2
              exit 1
            }
          done
          [[ "$APP_IMAGE" =~ ^ghcr\.io/lxndrp/lzug-demo-app@sha256:[0-9a-f]{64}$ ]]
          [[ "$SEED_IMAGE" =~ ^ghcr\.io/lxndrp/lzug-demo-seed@sha256:[0-9a-f]{64}$ ]]
          [[ "$PRODUCT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SCHEMA_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SEED_REVISION" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RUNTIME_CONTRACT" = lzug-demo-health-ready-v1 ]]
          [[ "$DEMO_URL" = https://demo.lzug.repertoire.papaspyrou.name ]]
          case "${{ inputs.promotion_channel }}:${{ inputs.operation }}" in
            stable:deploy) test "$GITHUB_REF" = refs/heads/master; [[ "$PRODUCT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ;;
            snapshot:deploy) test "$GITHUB_REF" = "refs/tags/$PRODUCT_TAG"; [[ "$PRODUCT_TAG" =~ ^snapshot/v[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT\.[0-9a-f]{7}$ ]] ;;
            :rollback) test "$GITHUB_REF" = refs/heads/master ;;
            *) echo "Unsupported demo source or operation." >&2; exit 1 ;;
          esac

      - name: Authenticate to GHCR without a long-lived credential
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify provenance attestations for both selected digests
        run: |
          set -euo pipefail
          for image in "$APP_IMAGE" "$SEED_IMAGE"; do
            gh attestation verify "oci://$image" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "lxndrp/lzug/.github/workflows/demo-publish.yml" \
              --bundle-from-oci \
              --predicate-type https://slsa.dev/provenance/v1
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Log in to Azure using GitHub OIDC
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Promote and verify the immutable pair
        run: pwsh -NoProfile -File scripts/demo-deploy.ps1 -Operation "${{ inputs.operation }}" -PromotionChannel "${{ inputs.promotion_channel }}"

      - name: Explain failure and collect non-sensitive diagnostics
        if: failure()
        run: |
          {
            echo "### Demo ${{ inputs.operation }} failed"
            echo "The run is not deployment evidence. Inspect the first failed readiness, health, or smoke step."
            echo "Do not change one digest independently. Re-run only after correcting the platform fault, or dispatch an explicit \`rollback\` with a previously verified complete pair."
          } >> "$GITHUB_STEP_SUMMARY"
          if test -f "$RUNNER_TEMP/demo-previous.json"; then
            previous_app=$(jq -er '.app' "$RUNNER_TEMP/demo-previous.json")
            previous_seed=$(jq -er '.seed' "$RUNNER_TEMP/demo-previous.json")
            {
              echo "- Previous app digest: \`$previous_app\`"
              echo "- Previous seed digest: \`$previous_seed\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          az containerapp show --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" || true
