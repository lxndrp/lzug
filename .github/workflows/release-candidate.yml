name: Release candidate

on:
  issues:
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.event.issue.milestone.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Create or reset release gate
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      checks: read
      contents: read
      issues: write
    steps:
      - name: Pin the candidate before waiting for its quality checks
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          test "${#sha}" = 40
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted candidate tooling from master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          persist-credentials: false

      - name: Create a gate only after the pinned candidate is fully checked
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if python3 scripts/release_gate.py \
              --repository "$GITHUB_REPOSITORY" \
              candidate \
              --issue "$ISSUE_NUMBER" \
              --sha "$CANDIDATE_SHA"; then
              exit 0
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Candidate checks did not become successful within 30 minutes." >&2
              exit 1
            fi
            sleep 30
          done
