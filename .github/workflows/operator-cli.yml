name: Operator CLI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    name: Quality change classification
    runs-on: ubuntu-latest
    outputs:
      operator_cli: ${{ steps.changes.outputs.operator_cli }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths conservatively
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            python3 scripts/classify_quality_paths.py \
              --full-reason "full-$EVENT_NAME" \
              | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" \
            | python3 scripts/classify_quality_paths.py \
            | tee -a "$GITHUB_OUTPUT"

  test:
    name: Go contract tests
    needs: classify
    if: needs.classify.outputs.operator_cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
      - name: Test
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}
    needs: classify
    if: needs.classify.outputs.operator_cli == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
      - name: Build portable binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          application_version=$(cat VERSION)
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X main.applicationVersion=$application_version" \
            -o "dist/lzug-admin-${{ matrix.goos }}-${{ matrix.goarch }}" \
            ./cmd/lzug-admin

  gate:
    name: Quality / Operator CLI
    needs:
      - classify
      - test
      - build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected operator CLI check
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          SELECTED: ${{ needs.classify.outputs.operator_cli }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$CLASSIFY_RESULT" = "success"
          if [ "$SELECTED" = "false" ]; then
            test "$TEST_RESULT" = "skipped"
            test "$BUILD_RESULT" = "skipped"
            exit 0
          fi
          test "$SELECTED" = "true"
          test "$TEST_RESULT" = "success"
          test "$BUILD_RESULT" = "success"
