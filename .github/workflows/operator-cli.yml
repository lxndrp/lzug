name: Operator CLI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
      - name: Test
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
      - name: Build portable binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          application_version=$(cat VERSION)
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X main.applicationVersion=$application_version" \
            -o "dist/lzug-admin-${{ matrix.goos }}-${{ matrix.goarch }}" \
            ./cmd/lzug-admin
