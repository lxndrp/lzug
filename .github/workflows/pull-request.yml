name: Pull Request

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: read

env:
  IMAGE_REF: lzug:0.0.0-dev.local

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select quality domains
    runs-on: ubuntu-latest
    outputs:
      fixtures: ${{ steps.domains.outputs.fixtures == 'true' || steps.domains.outputs.full == 'true' || steps.unknown.outputs.unknown == 'true' }}
      docs: ${{ steps.domains.outputs.docs == 'true' || steps.domains.outputs.full == 'true' || steps.unknown.outputs.unknown == 'true' }}
      backend: ${{ steps.domains.outputs.backend == 'true' || steps.domains.outputs.full == 'true' || steps.unknown.outputs.unknown == 'true' }}
      frontend: ${{ steps.domains.outputs.frontend == 'true' || steps.domains.outputs.full == 'true' || steps.unknown.outputs.unknown == 'true' }}
      cli: ${{ steps.domains.outputs.cli == 'true' || steps.domains.outputs.full == 'true' || steps.unknown.outputs.unknown == 'true' }}
      container: ${{ steps.domains.outputs.container == 'true' || steps.domains.outputs.full == 'true' || steps.unknown.outputs.unknown == 'true' }}
      browser: ${{ steps.domains.outputs.browser == 'true' || steps.domains.outputs.full == 'true' || steps.unknown.outputs.unknown == 'true' }}
      infra: ${{ steps.domains.outputs.infra == 'true' || steps.domains.outputs.full == 'true' || steps.unknown.outputs.unknown == 'true' }}
      delivery: ${{ steps.domains.outputs.delivery == 'true' || steps.domains.outputs.full == 'true' || steps.unknown.outputs.unknown == 'true' }}
      visual: ${{ steps.domains.outputs.visual == 'true' }}
      source_scan: ${{ steps.domains.outputs.source_scan == 'true' || steps.domains.outputs.full == 'true' || steps.unknown.outputs.unknown == 'true' }}
      codeql_languages: ${{ (steps.domains.outputs.full == 'true' || steps.unknown.outputs.unknown == 'true') && '["python","javascript-typescript","go"]' || steps.codeql.outputs.changes }}
    steps:
      - name: Select known domains
        id: domains
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            fixtures:
              - 'fixtures/synthetic-fixtures.json'
              - 'fixtures/generate.py'
              - 'frontend/src/app/testing/synthetic-fixtures.generated.ts'
            docs:
              - '.github/workflows/publication.yml'
              - '.lychee.toml'
              - 'docs/**'
              - 'docs/mkdocs.yml'
              - 'README.md'
              - 'CHANGELOG.md'
              - 'THIRD_PARTY_NOTICES.md'
              - 'frontend/**/*.md'
              - 'frontend/THIRD_PARTY_NOTICES.md'
              - 'scripts/check_documentation.py'
              - 'scripts/validate_demo_url_contract.py'
              - 'tests/docs/**'
            backend:
              - 'backend/**'
              - 'db/**'
              - 'fixtures/**'
            frontend:
              - 'brand/**'
              - 'scripts/build-frontend.sh'
              - 'frontend/**'
              - '!frontend/**/*.md'
              - '!frontend/THIRD_PARTY_NOTICES.md'
            cli:
              - 'scripts/verify_cli_release.py'
              - 'scripts/operator-container-smoke.sh'
              - 'operator-cli/**'
              - 'operator-cli/.goreleaser.yml'
              - 'operator-cli/go.mod'
              - 'operator-cli/go.sum'
              - 'THIRD_PARTY_NOTICES.md'
            delivery:
              - 'backend/**'
              - 'demo/**'
              - 'fixtures/**'
              - 'scripts/demo_deployment.py'
              - 'scripts/demo_snapshot.py'
              - 'scripts/verify-demo-image-pair.sh'
            infra:
              - 'infra/**'
            container:
              - 'scripts/compose-smoke.sh'
              - 'scripts/compose_policy.py'
              - 'scripts/container-contract.sh'
              - 'scripts/container-smoke.sh'
              - 'scripts/operator-container-smoke.sh'
              - 'scripts/verify-demo-image-pair.sh'
              - '.dockerignore'
              - '.env.example'
              - 'Dockerfile'
              - 'demo/Dockerfile.demo'
              - 'demo/Dockerfile.demo-seed'
              - 'compose.yaml'
              - 'demo/**'
              - 'db/**'
              - 'fixtures/**'
              - 'frontend/demo-overlays/**'
              - 'scripts/build-frontend.sh'
              - 'scripts/demo-container-smoke.sh'
              - 'fixtures/generate.py'
            browser:
              - 'brand/**'
              - 'demo/**'
              - 'scripts/build-frontend.sh'
              - 'backend/**'
              - 'db/**'
              - 'fixtures/**'
              - 'frontend/src/**'
              - 'frontend/e2e/**'
              - 'frontend/playwright*.ts'
              - 'frontend/demo-overlays/**'
              - 'frontend/public/**'
              - '!backend/tests/**'
              - '!frontend/src/**/*.spec.ts'
            visual:
              - 'brand/**'
              - 'frontend/src/**/*.html'
              - 'frontend/src/**/*.scss'
              - 'frontend/src/**/*.css'
              - 'frontend/src/**/*.component.ts'
              - 'frontend/public/**'
              - 'frontend/demo-overlays/**'
              - 'frontend/e2e/ui-review.spec.ts'
              - 'frontend/playwright.ui-review.config.ts'
            source_scan:
              - '**'
              - '!**/*.md'
            full:
              - '.github/**'
              - '!.github/workflows/publication.yml'
              - 'tests/**'
              - '!tests/docs/**'
              - '.mise.toml'
              - 'frontend/.node-version'
              - '.python-version'
              - 'Taskfile.yml'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - 'operator-cli/go.mod'
              - 'operator-cli/go.sum'
              - 'scripts/build_metadata.py'
              - 'scripts/sbom.py'

      - name: Select CodeQL languages
        id: codeql
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            python:
              - '**/*.py'
              - '.python-version'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
              - '.github/workflows/pull-request.yml'
              - '.github/workflows/quality.yml'
            javascript-typescript:
              - '**/*.cjs'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.mjs'
              - '**/*.ts'
              - '**/*.tsx'
              - 'frontend/.node-version'
              - 'frontend/angular.json'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - 'frontend/tsconfig*.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/pull-request.yml'
              - '.github/workflows/quality.yml'
            go:
              - '**/*.go'
              - 'operator-cli/go.mod'
              - 'operator-cli/go.sum'
              - '.github/workflows/ci.yml'
              - '.github/workflows/pull-request.yml'
              - '.github/workflows/quality.yml'

      - name: Detect unknown paths
        id: unknown
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            unknown:
              - '**'
              - '!backend/**'
              - '!db/**'
              - '!demo/**'
              - '!brand/**'
              - '!docs/**'
              - '!fixtures/**'
              - '!frontend/**'
              - '!infra/**'
              - '!operator-cli/**'
              - '!scripts/build-frontend.sh'
              - '!scripts/build_metadata.py'
              - '!scripts/check_documentation.py'
              - '!scripts/compose-smoke.sh'
              - '!scripts/compose_policy.py'
              - '!scripts/container-contract.sh'
              - '!scripts/container-smoke.sh'
              - '!scripts/demo-container-smoke.sh'
              - '!scripts/demo_deployment.py'
              - '!scripts/demo_snapshot.py'
              - '!scripts/operator-container-smoke.sh'
              - '!scripts/sbom.py'
              - '!scripts/validate_demo_url_contract.py'
              - '!scripts/verify-demo-image-pair.sh'
              - '!scripts/verify_cli_release.py'
              - '!.github/**'
              - '!.lychee.toml'
              - '!.vscode/**'
              - '!.dockerignore'
              - '!.env.example'
              - '!.gitignore'
              - '!.mise.toml'
              - '!frontend/.node-version'
              - '!.python-version'
              - '!AGENTS.md'
              - '!CHANGELOG.md'
              - '!CODE_OF_CONDUCT.md'
              - '!CONTRIBUTING.md'
              - '!Dockerfile'
              - '!LICENSE'
              - '!README.md'
              - '!SECURITY.md'
              - '!SUPPORT.md'
              - '!THIRD_PARTY_NOTICES.md'
              - '!Taskfile.yml'
              - '!tests/**'
              - '!compose.yaml'
              - '!pyproject.toml'
              - '!uv.lock'

  fixtures:
    name: Synthetic fixture adapters
    needs: changes
    if: needs.changes.outputs.fixtures == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked --extra dev
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - run: task fixtures:check test:fixtures

  docs:
    name: Documentation details
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - name: Install locked dependencies
        run: uv sync --locked --extra dev && npm ci --prefix frontend
      - name: Build documentation
        run: task docs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lzug-documentation
          path: site
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend details
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Run backend quality
        run: task quality:backend && uv run coverage xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend details
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - name: Install locked dependencies
        run: npm ci --prefix frontend
      - name: Run frontend quality and production dependency audit
        run: task brand:check quality:frontend quality:security
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: frontend/coverage/frontend/lcov.info
          if-no-files-found: error
          retention-days: 7

  cli:
    name: CLI details
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: operator-cli/go.sum
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - name: Test the CLI and validate its packaging configuration
        run: task quality:operator

  delivery:
    name: Delivery and demo contracts
    needs: changes
    if: needs.changes.outputs.delivery == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - run: uv sync --locked --extra dev
      - run: task test:delivery test:demo test:tooling

  container:
    name: Container details
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: operator-cli/go.sum
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - name: Install locked backend dependencies
        run: uv sync --locked --extra dev
      - name: Download the pinned Syft binary
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.0
      - name: Build once and verify product packaging
        env:
          SYFT_BINARY: ${{ steps.syft.outputs.cmd }}
        run: task quality:oci quality:container quality:compose-config test:oci
      - name: Generate and validate the dependency SBOM
        env:
          SYFT_BINARY: ${{ steps.syft.outputs.cmd }}
        run: task quality:sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lzug-sboms
          path: |
            build/quality/lzug.dependencies.sbom.cdx.json
            build/quality/lzug.image.sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Block high and critical image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          version: v0.69.3
          image-ref: ${{ env.IMAGE_REF }}
          scanners: vuln,secret,misconfig
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

  infra:
    name: Infrastructure details
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - name: Validate and mock-plan the demo infrastructure
        run: task quality:infra

  e2e:
    name: Browser E2E details
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve Playwright version
        id: playwright-version
        run: node -e "console.log('version=' + require('./frontend/package-lock.json').packages['node_modules/@playwright/test'].version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
      - name: Install locked dependencies and browser engines
        run: |
          uv sync --locked --extra dev
          npm ci --prefix frontend
          cd frontend && npx playwright install --with-deps chromium
      - name: Install visual matrix engines
        if: needs.changes.outputs.visual == 'true'
        run: cd frontend && npx playwright install --with-deps firefox webkit
      - name: Enable the Chromium user-namespace sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 0
      - name: Run browser end-to-end tests
        run: npm --prefix frontend run test:e2e
      - name: Run focused cross-browser UI review
        if: needs.changes.outputs.visual == 'true'
        run: npm --prefix frontend run test:ui-review
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-e2e-report
          path: frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7

  a11y:
    name: Accessibility details
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve Playwright version
        id: playwright-version
        run: node -e "console.log('version=' + require('./frontend/package-lock.json').packages['node_modules/@playwright/test'].version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
      - name: Install locked dependencies and Chromium
        run: |
          uv sync --locked --extra dev
          npm ci --prefix frontend
          cd frontend && npx playwright install --with-deps chromium
      - name: Enable the Chromium user-namespace sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 0
      - name: Run accessibility tests
        run: npm --prefix frontend run test:a11y
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-a11y-report
          path: frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7

  codeql:
    needs: changes
    if: needs.changes.outputs.codeql_languages != '[]'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write
    with:
      languages: ${{ needs.changes.outputs.codeql_languages }}

  source-scan:
    name: Source secrets and misconfiguration
    needs: changes
    if: needs.changes.outputs.source_scan == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
          skip-dirs: .git,.venv,frontend/node_modules

  docs-gate:
    name: Pull Request / Documentation
    needs: [changes, docs, codeql, source-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.docs }}
          DETAIL: ${{ needs.docs.result }}
          CODEQL_SELECTED: ${{ needs.changes.outputs.codeql_languages != '[]' }}
          SCAN_SELECTED: ${{ needs.changes.outputs.source_scan }}
          CODEQL: ${{ needs.codeql.result }}
          SOURCE_SCAN: ${{ needs.source-scan.result }}
        run: |
          test "$CHANGES" = success
          test "$CODEQL_SELECTED:$CODEQL" = true:success || test "$CODEQL_SELECTED:$CODEQL" = false:skipped
          test "$SCAN_SELECTED:$SOURCE_SCAN" = true:success || test "$SCAN_SELECTED:$SOURCE_SCAN" = false:skipped
          test "$SELECTED:$DETAIL" = true:success || test "$SELECTED:$DETAIL" = false:skipped

