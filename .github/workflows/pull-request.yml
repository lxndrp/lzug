          test "$SCAN_SELECTED:$SOURCE_SCAN" = true:success || test "$SCAN_SELECTED:$SOURCE_SCAN" = false:skipped
          test "$SELECTED:$DETAIL" = true:success || test "$SELECTED:$DETAIL" = false:skipped
          test "$BROWSER:$E2E:$A11Y" = true:success:success || test "$BROWSER:$E2E:$A11Y" = false:skipped:skipped

  cli-gate:
    name: Pull Request / CLI
    needs: [changes, cli, codeql, source-scan]
    if: always()
    runs-on: ubuntu-latest
