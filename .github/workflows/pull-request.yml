name: Pull Request

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select quality domains
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.domains.outputs.docs == 'true' || steps.domains.outputs.full == 'true' || steps.unknown.outputs.unknown == 'true' }}
      backend: ${{ steps.domains.outputs.backend == 'true' || steps.domains.outputs.full == 'true' || steps.unknown.outputs.unknown == 'true' }}
      frontend: ${{ steps.domains.outputs.frontend == 'true' || steps.domains.outputs.full == 'true' || steps.unknown.outputs.unknown == 'true' }}
      cli: ${{ steps.domains.outputs.cli == 'true' || steps.domains.outputs.full == 'true' || steps.unknown.outputs.unknown == 'true' }}
      container: ${{ steps.domains.outputs.container == 'true' || steps.domains.outputs.full == 'true' || steps.unknown.outputs.unknown == 'true' }}
      infra: ${{ steps.domains.outputs.infra == 'true' || steps.domains.outputs.full == 'true' || steps.unknown.outputs.unknown == 'true' }}
      delivery: ${{ steps.domains.outputs.delivery == 'true' || steps.domains.outputs.full == 'true' || steps.unknown.outputs.unknown == 'true' }}
      source_scan: ${{ steps.domains.outputs.source_scan == 'true' || steps.domains.outputs.full == 'true' || steps.unknown.outputs.unknown == 'true' }}
      codeql_languages: ${{ (steps.domains.outputs.full == 'true' || steps.unknown.outputs.unknown == 'true') && '["python","javascript-typescript","go"]' || steps.codeql.outputs.changes }}
    steps:
      - name: Select known domains
        id: domains
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            docs:
              - '.github/workflows/publication.yml'
              - '.lychee.toml'
              - 'docs/**'
              - 'docs/mkdocs.yml'
              - 'README.md'
              - 'CHANGELOG.md'
              - 'THIRD_PARTY_NOTICES.md'
              - 'frontend/**/*.md'
              - 'frontend/THIRD_PARTY_NOTICES.md'
              - 'scripts/check_documentation.py'
              - 'scripts/validate_demo_url_contract.py'
              - 'tests/docs/**'
            backend:
              - 'backend/**'
              - 'db/**'
              - 'fixtures/**'
            frontend:
              - 'brand/**'
              - 'scripts/build-frontend.sh'
              - 'frontend/**'
              - '!frontend/**/*.md'
              - '!frontend/THIRD_PARTY_NOTICES.md'
            cli:
              - 'scripts/verify_cli_release.py'
              - 'scripts/operator-container-smoke.sh'
              - 'operator-cli/**'
              - 'operator-cli/.goreleaser.yml'
              - 'operator-cli/go.mod'
              - 'operator-cli/go.sum'
              - 'THIRD_PARTY_NOTICES.md'
            delivery:
              - 'backend/**'
              - 'demo/**'
              - 'fixtures/**'
              - 'scripts/demo_deployment.py'
              - 'scripts/demo_snapshot.py'
              - 'scripts/verify-demo-image-pair.sh'
            infra:
              - 'infra/**'
            container:
              - 'scripts/compose-smoke.sh'
              - 'scripts/compose_policy.py'
              - 'scripts/container-contract.sh'
              - 'scripts/container-smoke.sh'
              - 'scripts/operator-container-smoke.sh'
              - 'scripts/verify-demo-image-pair.sh'
              - '.dockerignore'
              - '.env.example'
              - 'Dockerfile'
              - 'demo/Dockerfile.demo'
              - 'demo/Dockerfile.demo-seed'
              - 'compose.yaml'
              - 'demo/**'
              - 'db/**'
              - 'fixtures/**'
              - 'frontend/demo-overlays/**'
              - 'scripts/build-frontend.sh'
              - 'scripts/demo-container-smoke.sh'
              - 'fixtures/generate.py'
            source_scan:
              - '**'
              - '!**/*.md'
            full:
              - '.github/**'
              - '!.github/workflows/publication.yml'
              - 'tests/**'
              - '!tests/docs/**'
              - '.mise.toml'
              - 'frontend/.node-version'
              - '.python-version'
              - 'Taskfile.yml'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - 'operator-cli/go.mod'
              - 'operator-cli/go.sum'
              - 'scripts/build_metadata.py'
              - 'scripts/sbom.py'

      - name: Select CodeQL languages
        id: codeql
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            python:
              - '**/*.py'
              - '.python-version'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
              - '.github/workflows/pull-request.yml'
              - '.github/workflows/quality.yml'
            javascript-typescript:
              - '**/*.cjs'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.mjs'
              - '**/*.ts'
              - '**/*.tsx'
              - 'frontend/.node-version'
              - 'frontend/angular.json'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - 'frontend/tsconfig*.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/pull-request.yml'
              - '.github/workflows/quality.yml'
            go:
              - '**/*.go'
              - 'operator-cli/go.mod'
              - 'operator-cli/go.sum'
              - '.github/workflows/ci.yml'
              - '.github/workflows/pull-request.yml'
              - '.github/workflows/quality.yml'

      - name: Detect unknown paths
        id: unknown
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            unknown:
              - '**'
              - '!backend/**'
              - '!db/**'
              - '!demo/**'
              - '!brand/**'
              - '!docs/**'
              - '!fixtures/**'
              - '!frontend/**'
              - '!infra/**'
              - '!operator-cli/**'
              - '!scripts/build-frontend.sh'
              - '!scripts/build_metadata.py'
              - '!scripts/check_documentation.py'
              - '!scripts/compose-smoke.sh'
              - '!scripts/compose_policy.py'
              - '!scripts/container-contract.sh'
              - '!scripts/container-smoke.sh'
              - '!scripts/demo-container-smoke.sh'
              - '!scripts/demo_deployment.py'
              - '!scripts/demo_snapshot.py'
              - '!scripts/operator-container-smoke.sh'
              - '!scripts/sbom.py'
              - '!scripts/validate_demo_url_contract.py'
              - '!scripts/verify-demo-image-pair.sh'
              - '!scripts/verify_cli_release.py'
              - '!.github/**'
              - '!.lychee.toml'
              - '!.vscode/**'
              - '!.dockerignore'
              - '!.env.example'
              - '!.gitignore'
              - '!.mise.toml'
              - '!frontend/.node-version'
              - '!.python-version'
              - '!AGENTS.md'
              - '!CHANGELOG.md'
              - '!CODE_OF_CONDUCT.md'
              - '!CONTRIBUTING.md'
              - '!Dockerfile'
              - '!LICENSE'
              - '!README.md'
              - '!SECURITY.md'
              - '!SUPPORT.md'
              - '!THIRD_PARTY_NOTICES.md'
              - '!Taskfile.yml'
              - '!tests/**'
              - '!compose.yaml'
              - '!pyproject.toml'
              - '!uv.lock'

  docs:
    name: Documentation details
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - name: Install locked dependencies
        run: uv sync --locked --extra dev && npm ci --prefix frontend
      - name: Build documentation
        run: task docs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lzug-documentation
          path: site
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend details
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Run pull-request backend quality
        run: task quality:backend:pr

  frontend:
    name: Frontend details
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - name: Install locked dependencies
        run: npm ci --prefix frontend
      - name: Run frontend quality and production dependency audit
        run: task brand:check quality:frontend quality:security
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: frontend/coverage/frontend/lcov.info
          if-no-files-found: error
          retention-days: 7

  cli:
    name: CLI details
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: operator-cli/go.sum
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - name: Test the CLI and validate its packaging configuration
        run: task quality:operator

  delivery:
    name: Delivery and tooling contracts
    needs: changes
    if: needs.changes.outputs.delivery == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - run: uv sync --locked --extra dev
      - run: task test:delivery test:tooling

  container:
    name: Container details
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - name: Install locked backend dependencies
        run: uv sync --locked --extra dev
      - name: Validate lzug container contracts without building an image
        run: task test:oci

  infra:
    name: Infrastructure details
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - name: Validate and mock-plan the demo infrastructure
        run: task quality:infra

  codeql:
    needs: changes
    if: needs.changes.outputs.codeql_languages != '[]'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write
    with:
      languages: ${{ needs.changes.outputs.codeql_languages }}

  source-scan:
    name: Source secrets and misconfiguration
    needs: changes
    if: needs.changes.outputs.source_scan == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
          skip-dirs: .git,.venv,frontend/node_modules

  docs-gate:
    name: Pull Request / Documentation
    needs: [changes, docs, codeql, source-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.docs }}
          DETAIL: ${{ needs.docs.result }}
          CODEQL_SELECTED: ${{ needs.changes.outputs.codeql_languages != '[]' }}
          SCAN_SELECTED: ${{ needs.changes.outputs.source_scan }}
          CODEQL: ${{ needs.codeql.result }}
          SOURCE_SCAN: ${{ needs.source-scan.result }}
        run: |
          test "$CHANGES" = success
          test "$CODEQL_SELECTED:$CODEQL" = true:success || test "$CODEQL_SELECTED:$CODEQL" = false:skipped
          test "$SCAN_SELECTED:$SOURCE_SCAN" = true:success || test "$SCAN_SELECTED:$SOURCE_SCAN" = false:skipped
          test "$SELECTED:$DETAIL" = true:success || test "$SELECTED:$DETAIL" = false:skipped

  backend-gate:
    name: Pull Request / Backend
    needs: [changes, backend, codeql, source-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.backend }}
          DETAIL: ${{ needs.backend.result }}
          CODEQL_SELECTED: ${{ needs.changes.outputs.codeql_languages != '[]' }}
          SCAN_SELECTED: ${{ needs.changes.outputs.source_scan }}
          CODEQL: ${{ needs.codeql.result }}
          SOURCE_SCAN: ${{ needs.source-scan.result }}
        run: |
          test "$CHANGES" = success
          test "$CODEQL_SELECTED:$CODEQL" = true:success || test "$CODEQL_SELECTED:$CODEQL" = false:skipped
          test "$SCAN_SELECTED:$SOURCE_SCAN" = true:success || test "$SCAN_SELECTED:$SOURCE_SCAN" = false:skipped
          test "$SELECTED:$DETAIL" = true:success || test "$SELECTED:$DETAIL" = false:skipped

  frontend-gate:
    name: Pull Request / Frontend
    needs: [changes, frontend, codeql, source-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.frontend }}
          DETAIL: ${{ needs.frontend.result }}
          CODEQL_SELECTED: ${{ needs.changes.outputs.codeql_languages != '[]' }}
          SCAN_SELECTED: ${{ needs.changes.outputs.source_scan }}
          CODEQL: ${{ needs.codeql.result }}
          SOURCE_SCAN: ${{ needs.source-scan.result }}
        run: |
          test "$CHANGES" = success
          test "$CODEQL_SELECTED:$CODEQL" = true:success || test "$CODEQL_SELECTED:$CODEQL" = false:skipped
          test "$SCAN_SELECTED:$SOURCE_SCAN" = true:success || test "$SCAN_SELECTED:$SOURCE_SCAN" = false:skipped
          test "$SELECTED:$DETAIL" = true:success || test "$SELECTED:$DETAIL" = false:skipped

  cli-gate:
    name: Pull Request / CLI
    needs: [changes, cli, codeql, source-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.cli }}
          DETAIL: ${{ needs.cli.result }}
          CODEQL_SELECTED: ${{ needs.changes.outputs.codeql_languages != '[]' }}
          SCAN_SELECTED: ${{ needs.changes.outputs.source_scan }}
          CODEQL: ${{ needs.codeql.result }}
          SOURCE_SCAN: ${{ needs.source-scan.result }}
        run: |
          test "$CHANGES" = success
          test "$CODEQL_SELECTED:$CODEQL" = true:success || test "$CODEQL_SELECTED:$CODEQL" = false:skipped
          test "$SCAN_SELECTED:$SOURCE_SCAN" = true:success || test "$SCAN_SELECTED:$SOURCE_SCAN" = false:skipped
          test "$SELECTED:$DETAIL" = true:success || test "$SELECTED:$DETAIL" = false:skipped

  container-gate:
    name: Pull Request / Container
    needs: [changes, container, infra, delivery, codeql, source-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.container }}
          DETAIL: ${{ needs.container.result }}
          DELIVERY_SELECTED: ${{ needs.changes.outputs.delivery }}
          DELIVERY: ${{ needs.delivery.result }}
          INFRA_SELECTED: ${{ needs.changes.outputs.infra }}
          INFRA_DETAIL: ${{ needs.infra.result }}
          CODEQL_SELECTED: ${{ needs.changes.outputs.codeql_languages != '[]' }}
          SCAN_SELECTED: ${{ needs.changes.outputs.source_scan }}
          CODEQL: ${{ needs.codeql.result }}
          SOURCE_SCAN: ${{ needs.source-scan.result }}
        run: |
          test "$CHANGES" = success
          test "$CODEQL_SELECTED:$CODEQL" = true:success || test "$CODEQL_SELECTED:$CODEQL" = false:skipped
          test "$SCAN_SELECTED:$SOURCE_SCAN" = true:success || test "$SCAN_SELECTED:$SOURCE_SCAN" = false:skipped
          test "$SELECTED:$DETAIL" = true:success || test "$SELECTED:$DETAIL" = false:skipped
          test "$INFRA_SELECTED:$INFRA_DETAIL" = true:success || test "$INFRA_SELECTED:$INFRA_DETAIL" = false:skipped
          test "$DELIVERY_SELECTED:$DELIVERY" = true:success || test "$DELIVERY_SELECTED:$DELIVERY" = false:skipped
