name: Security

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Quality change classification
    runs-on: ubuntu-latest
    outputs:
      security: ${{ steps.changes.outputs.security }}
      codeql: ${{ steps.changes.outputs.codeql }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Classify changed paths conservatively
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            python3 scripts/classify_quality_paths.py \
              --full-reason "full-$EVENT_NAME" \
              | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" \
            | python3 scripts/classify_quality_paths.py \
            | tee -a "$GITHUB_OUTPUT"

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: classify
    if: needs.classify.outputs.codeql == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          output: codeql-results
          upload: always

      - name: Block high and critical SAST findings
        env:
          SARIF_OUTPUT: ${{ steps.analyze.outputs.sarif-output }}
        run: python3 scripts/enforce_sarif_security.py "$SARIF_OUTPUT" --minimum 7.0

  source-scan:
    name: Source secrets and misconfiguration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Scan the source tree
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
          skip-dirs: .git,.venv,frontend/node_modules

  gate:
    name: Quality / Security
    needs:
      - classify
      - codeql
      - source-scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected security check
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          CODEQL_SELECTED: ${{ needs.classify.outputs.codeql }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          SOURCE_SCAN_RESULT: ${{ needs.source-scan.result }}
        run: |
          test "$CLASSIFY_RESULT" = "success"
          test "$SOURCE_SCAN_RESULT" = "success"
          if [ "$CODEQL_SELECTED" = "true" ]; then
            test "$CODEQL_RESULT" = "success"
          else
            test "$CODEQL_SELECTED" = "false"
            test "$CODEQL_RESULT" = "skipped"
          fi
