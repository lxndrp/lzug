name: Dependabot auto-merge

# Dependabot-triggered pull_request workflows receive a read-only token. This
# workflow therefore uses pull_request_target, but never checks out or executes
# pull-request code. All decisions use the base-branch workflow and GitHub API
# metadata only.
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    if: >-
      github.repository == 'lxndrp/lzug' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Fetch verified Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Classify update
        id: eligibility
        env:
          PACKAGE_ECOSYSTEM: ${{ steps.dependabot-metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.dependabot-metadata.outputs.update-type }}
        run: |
          case "${PACKAGE_ECOSYSTEM}:${UPDATE_TYPE}" in
            npm:version-update:semver-patch | \
              npm:version-update:semver-minor | \
              uv:version-update:semver-patch | \
              uv:version-update:semver-minor)
              echo "eligible=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Enable squash auto-merge
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          mergeable=UNKNOWN
          for attempt in 1 2 3 4 5; do
            if ! mergeable="$(gh pr view "$PR_URL" --json mergeable --jq '.mergeable')"; then
              echo "Could not determine mergeability on attempt $attempt."
              mergeable=UNKNOWN
            fi
            if [ "$mergeable" != "UNKNOWN" ]; then
              break
            fi
            sleep 2
          done

          if [ "$mergeable" != "MERGEABLE" ]; then
            echo "Auto-merge remains disabled because mergeability is $mergeable."
            exit 0
          fi

          gh pr merge --auto --squash "$PR_URL"
