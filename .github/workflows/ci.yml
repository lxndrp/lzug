name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"

      - name: Set up UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --locked --extra dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Format check with black
        run: uv run black --check .

      - name: Check synthetic fixture policy
        run: uv run python scripts/check_synthetic_fixtures.py

      - name: Run backend tests with coverage
        run: |
          uv run coverage run -m unittest
          uv run coverage report
          uv run coverage xml

      - name: Audit Python dependencies
        run: uv run pip-audit --skip-editable

      - name: Upload backend coverage
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint

      - name: Format check with Prettier
        run: npm run format:check

      - name: Build frontend
        run: npm run build:ci

      - name: Run frontend tests with coverage
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/frontend/lcov.info
          if-no-files-found: error
          retention-days: 7

  npm-security:
    name: npm production security gate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit critical production npm dependencies
        run: npm run security:check

  documentation:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"

      - name: Set up UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install documentation dependencies
        run: uv sync --locked --extra dev

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build documentation
        run: |
          uv run mkdocs build --strict --site-dir site
          cd frontend && npm run docs

      - name: Upload documentation
        uses: actions/upload-artifact@v7
        with:
          name: lzug-documentation
          path: site
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"

      - name: Set up UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --locked --extra dev

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser workflows
        working-directory: frontend
        run: npm run test:e2e

      - name: Check browser artifacts
        id: artifact_guard
        if: always()
        run: python scripts/check_ci_artifacts.py frontend/playwright-report frontend/test-results

      - name: Upload browser E2E report
        uses: actions/upload-artifact@v7
        if: failure() && steps.artifact_guard.outcome == 'success'
        with:
          name: playwright-e2e-report
          path: frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7

  a11y:
    name: Accessibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"

      - name: Set up UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --locked --extra dev

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run accessibility checks
        working-directory: frontend
        run: npm run test:a11y

      - name: Check browser artifacts
        id: artifact_guard
        if: always()
        run: python scripts/check_ci_artifacts.py frontend/playwright-report frontend/test-results

      - name: Upload accessibility report
        uses: actions/upload-artifact@v7
        if: failure() && steps.artifact_guard.outcome == 'success'
        with:
          name: playwright-a11y-report
          path: frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7
