name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Change classification
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      documentation: ${{ steps.changes.outputs.documentation }}
      overall: ${{ steps.changes.outputs.overall }}
      npm_security: ${{ steps.changes.outputs.npm_security }}
      compose: ${{ steps.changes.outputs.compose }}
      e2e: ${{ steps.changes.outputs.e2e }}
      a11y: ${{ steps.changes.outputs.a11y }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths conservatively
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            python3 scripts/classify_quality_paths.py \
              --full-reason "full-$EVENT_NAME" \
              | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" \
            | python3 scripts/classify_quality_paths.py \
            | tee -a "$GITHUB_OUTPUT"

  backend:
    name: Backend
    needs: classify
    if: needs.classify.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"

      - name: Set up UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --locked --extra dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Format check with black
        run: uv run black --check .

      - name: Run backend tests with coverage
        run: |
          uv run coverage run -m unittest
          uv run coverage report
          uv run coverage xml

      - name: Audit Python dependencies
        run: uv run pip-audit --skip-editable

      - name: Upload backend coverage
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend
    needs: classify
    if: needs.classify.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint

      - name: Format check with Prettier
        run: npm run format:check

      - name: Build frontend
        run: npm run build:ci

      - name: Run frontend tests with coverage
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/frontend/lcov.info
          if-no-files-found: error
          retention-days: 7

  npm_security:
    name: npm production security gate
    needs: classify
    if: needs.classify.outputs.npm_security == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit critical production npm dependencies
        run: npm run security:check

  documentation:
    name: Documentation
    needs: classify
    if: needs.classify.outputs.documentation == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"

      - name: Set up UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install documentation dependencies
        run: uv sync --locked --extra dev

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build documentation
        run: |
          uv run mkdocs build --strict --site-dir site
          cd frontend && npm run docs

      - name: Upload documentation
        uses: actions/upload-artifact@v7
        with:
          name: lzug-documentation
          path: site
          if-no-files-found: error
          retention-days: 7

  compose:
    name: Compose configuration
    needs: classify
    if: needs.classify.outputs.compose == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose configuration and negative cases
        env:
          LZUG_IMAGE: lzug:0.1.0-local
        run: scripts/validate-compose.sh

  e2e:
    name: Browser E2E
    needs: classify
    if: needs.classify.outputs.e2e == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"

      - name: Set up UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --locked --extra dev

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Resolve Playwright version
        id: playwright_version
        working-directory: frontend
        run: |
          node -e "console.log('version=' + require('./package-lock.json').packages['node_modules/@playwright/test'].version)" \
            >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        id: playwright_cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Playwright browser
        id: playwright_install
        working-directory: frontend
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright_cache.outputs.cache-hit }}
        run: |
          started_at="$(date +%s)"
          npx playwright install --with-deps chromium
          elapsed_seconds="$(( $(date +%s) - started_at ))"
          echo "Playwright cache hit: ${PLAYWRIGHT_CACHE_HIT:-false}"
          echo "Playwright install seconds: $elapsed_seconds"
          echo "seconds=$elapsed_seconds" >> "$GITHUB_OUTPUT"

      - name: Run browser workflows
        working-directory: frontend
        run: npm run test:e2e

      - name: Check browser artifacts
        id: artifact_guard
        if: always()
        run: python scripts/check_ci_artifacts.py frontend/playwright-report frontend/test-results

      - name: Upload browser E2E report
        uses: actions/upload-artifact@v7
        if: failure() && steps.artifact_guard.outcome == 'success'
        with:
          name: playwright-e2e-report
          path: frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7

  a11y:
    name: Accessibility
    needs: classify
    if: needs.classify.outputs.a11y == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"

      - name: Set up UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --locked --extra dev

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Resolve Playwright version
        id: playwright_version
        working-directory: frontend
        run: |
          node -e "console.log('version=' + require('./package-lock.json').packages['node_modules/@playwright/test'].version)" \
            >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        id: playwright_cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Playwright browser
        id: playwright_install
        working-directory: frontend
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright_cache.outputs.cache-hit }}
        run: |
          started_at="$(date +%s)"
          npx playwright install --with-deps chromium
          elapsed_seconds="$(( $(date +%s) - started_at ))"
          echo "Playwright cache hit: ${PLAYWRIGHT_CACHE_HIT:-false}"
          echo "Playwright install seconds: $elapsed_seconds"
          echo "seconds=$elapsed_seconds" >> "$GITHUB_OUTPUT"

      - name: Run accessibility checks
        working-directory: frontend
        run: npm run test:a11y

      - name: Check browser artifacts
        id: artifact_guard
        if: always()
        run: python scripts/check_ci_artifacts.py frontend/playwright-report frontend/test-results

      - name: Upload accessibility report
        uses: actions/upload-artifact@v7
        if: failure() && steps.artifact_guard.outcome == 'success'
        with:
          name: playwright-a11y-report
          path: frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7

  backend-gate:
    name: Quality / Backend
    needs:
      - classify
      - backend
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require the selected backend checks
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          SELECTED: ${{ needs.classify.outputs.backend }}
          DETAIL_RESULT: ${{ needs.backend.result }}
        run: |
          test "$CLASSIFY_RESULT" = "success"
          if [ "$SELECTED" = "true" ]; then
            test "$DETAIL_RESULT" = "success"
          else
            test "$SELECTED" = "false"
            test "$DETAIL_RESULT" = "skipped"
          fi

  frontend-gate:
    name: Quality / Frontend
    needs:
      - classify
      - frontend
      - npm_security
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require the selected frontend checks
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          FRONTEND_SELECTED: ${{ needs.classify.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          NPM_SECURITY_SELECTED: ${{ needs.classify.outputs.npm_security }}
          NPM_SECURITY_RESULT: ${{ needs.npm_security.result }}
        run: |
          set -eu
          test "$CLASSIFY_RESULT" = "success"

          require_result() {
            selected="$1"
            result="$2"
            if [ "$selected" = "true" ]; then
              test "$result" = "success"
            else
              test "$selected" = "false"
              test "$result" = "skipped"
            fi
          }

          require_result "$FRONTEND_SELECTED" "$FRONTEND_RESULT"
          require_result "$NPM_SECURITY_SELECTED" "$NPM_SECURITY_RESULT"

  documentation-gate:
    name: Quality / Documentation
    needs:
      - classify
      - documentation
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require the selected documentation checks
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          SELECTED: ${{ needs.classify.outputs.documentation }}
          DETAIL_RESULT: ${{ needs.documentation.result }}
        run: |
          test "$CLASSIFY_RESULT" = "success"
          if [ "$SELECTED" = "true" ]; then
            test "$DETAIL_RESULT" = "success"
          else
            test "$SELECTED" = "false"
            test "$DETAIL_RESULT" = "skipped"
          fi

  overall-gate:
    name: Quality / Overall
    needs:
      - classify
      - compose
      - e2e
      - a11y
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require every selected cross-domain check
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          OVERALL_SELECTED: ${{ needs.classify.outputs.overall }}
          COMPOSE_SELECTED: ${{ needs.classify.outputs.compose }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
          E2E_SELECTED: ${{ needs.classify.outputs.e2e }}
          E2E_RESULT: ${{ needs.e2e.result }}
          A11Y_SELECTED: ${{ needs.classify.outputs.a11y }}
          A11Y_RESULT: ${{ needs.a11y.result }}
        run: |
          set -eu
          test "$CLASSIFY_RESULT" = "success"
          test "$OVERALL_SELECTED" = "true" -o "$OVERALL_SELECTED" = "false"

          require_result() {
            selected="$1"
            result="$2"
            if [ "$selected" = "true" ]; then
              test "$result" = "success"
            else
              test "$selected" = "false"
              test "$result" = "skipped"
            fi
          }

          require_result "$COMPOSE_SELECTED" "$COMPOSE_RESULT"
          require_result "$E2E_SELECTED" "$E2E_RESULT"
          require_result "$A11Y_SELECTED" "$A11Y_RESULT"

  required-check-compatibility:
    # Kept until #305 migrates the active ruleset to the stable Quality gates.
    name: CI overall
    needs:
      - backend-gate
      - frontend-gate
      - documentation-gate
      - overall-gate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the existing required check without bypassing new gates
        env:
          BACKEND_GATE: ${{ needs.backend-gate.result }}
          FRONTEND_GATE: ${{ needs.frontend-gate.result }}
          DOCUMENTATION_GATE: ${{ needs.documentation-gate.result }}
          OVERALL_GATE: ${{ needs.overall-gate.result }}
        run: |
          test "$BACKEND_GATE" = "success"
          test "$FRONTEND_GATE" = "success"
          test "$DOCUMENTATION_GATE" = "success"
          test "$OVERALL_GATE" = "success"
