name: CodeQL

on:
  workflow_call:
    inputs:
      languages:
        description: JSON array of languages configured for the caller's security boundary.
        required: true
        type: string
      revision:
        description: Immutable revision to analyze.
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: matrix.language == 'go'
        with:
          go-version: "1.26.10"
          cache-dependency-path: operator-cli/go.sum
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}
          queries: security-extended
      - name: Build Go sources for CodeQL
        if: matrix.language == 'go'
        run: go build ./...
        working-directory: operator-cli
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          category: ".github/workflows/ci.yml:codeql/language:${{ matrix.language }}"
          upload: always
