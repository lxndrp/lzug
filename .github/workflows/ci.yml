name: Quality

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_REF: lzug-ci:0.0.0-dev.run-${{ github.run_id }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Change classification
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      operator_cli: ${{ steps.changes.outputs.operator_cli }}
      oci: ${{ steps.changes.outputs.oci }}
      documentation: ${{ steps.changes.outputs.documentation }}
      security: ${{ steps.changes.outputs.security }}
      overall: ${{ steps.changes.outputs.overall }}
      npm_security: ${{ steps.changes.outputs.npm_security }}
      codeql: ${{ steps.changes.outputs.codeql }}
      image: ${{ steps.changes.outputs.image }}
      container: ${{ steps.changes.outputs.container }}
      compose: ${{ steps.changes.outputs.compose }}
      operator_container: ${{ steps.changes.outputs.operator_container }}
      e2e: ${{ steps.changes.outputs.e2e }}
      a11y: ${{ steps.changes.outputs.a11y }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Classify changed paths conservatively
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            python3 scripts/classify_quality_paths.py \
              --full-reason "full-$EVENT_NAME" \
              | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" \
            | python3 scripts/classify_quality_paths.py \
            | tee -a "$GITHUB_OUTPUT"

  backend:
    name: Backend
    needs: classify
    if: needs.classify.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"

      - name: Set up UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --locked --extra dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Format check with black
        run: uv run black --check .

      - name: Run backend tests with coverage
        run: |
          uv run coverage run -m unittest
          uv run coverage report
          uv run coverage xml

      - name: Audit Python dependencies
        run: uv run pip-audit --skip-editable

      - name: Upload backend coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend
    needs: classify
    if: needs.classify.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint

      - name: Format check with Prettier
        run: npm run format:check

      - name: Build frontend
        run: npm run build:ci

      - name: Run frontend tests with coverage
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: frontend/coverage/frontend/lcov.info
          if-no-files-found: error
          retention-days: 7

  npm_security:
    name: npm production security gate
    needs: classify
    if: needs.classify.outputs.npm_security == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit critical production npm dependencies
        run: npm run security:check

  documentation:
    name: Documentation
    needs: classify
    if: needs.classify.outputs.documentation == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"

      - name: Set up UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install documentation dependencies
        run: uv sync --locked --extra dev

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build documentation
        run: |
          uv run mkdocs build --strict --site-dir site
          cd frontend && npm run docs

      - name: Upload documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lzug-documentation
          path: site
          if-no-files-found: error
          retention-days: 7

  operator-test:
    name: Go contract tests
    needs: classify
    if: needs.classify.outputs.operator_cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache: true
      - name: Test
        run: go test ./cmd/lzug-admin

  operator-build:
    name: Build operator CLI (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: classify
    if: needs.classify.outputs.operator_cli == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache: true
      - name: Build portable binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          application_version=$(python3 scripts/build_metadata.py \
            --revision "$GITHUB_SHA" --field identity)
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X main.applicationVersion=$application_version -X main.applicationRevision=$GITHUB_SHA" \
            -o "dist/lzug-admin-${{ matrix.goos }}-${{ matrix.goarch }}" \
            ./cmd/lzug-admin

  image-build:
    name: OCI image build
    needs: classify
    if: needs.classify.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Derive development build identity
        id: build_metadata
        run: |
          identity=$(python3 scripts/build_metadata.py \
            --revision "$GITHUB_SHA" --field identity)
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - name: Build the quality image once
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.IMAGE_REF }}
          build-args: |
            BUILD_IDENTITY=${{ steps.build_metadata.outputs.identity }}
            VCS_REF=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/lzug-image.tar
          cache-from: type=gha,scope=lzug-quality-${{ runner.arch }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope=lzug-quality-{0}', runner.arch) || '' }}
          provenance: false
          sbom: false
      - name: Record the immutable image archive checksum
        working-directory: ${{ runner.temp }}
        run: sha256sum lzug-image.tar > lzug-image.tar.sha256
      - name: Upload the built image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lzug-quality-image
          path: |
            ${{ runner.temp }}/lzug-image.tar
            ${{ runner.temp }}/lzug-image.tar.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  image-scan:
    name: Container, dependencies, and SBOM
    needs:
      - classify
      - image-build
    if: needs.classify.outputs.oci == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scan inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - name: Set up UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install the locked dependency-review environment
        run: uv sync --locked --extra dev
      - name: Download the pinned Syft binary
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.0
      - name: Download the built image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lzug-quality-image
          path: ${{ runner.temp }}/lzug-quality-image
      - name: Load the exact built image for scanning
        working-directory: ${{ runner.temp }}/lzug-quality-image
        run: |
          sha256sum --check lzug-image.tar.sha256
          docker load --input lzug-image.tar
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_REF")" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$IMAGE_REF")" = "0.0.0-dev+sha.$GITHUB_SHA"
      - name: Generate and validate both canonical CycloneDX SBOMs
        env:
          SYFT_BINARY: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          source_version=$(python3 scripts/build_metadata.py \
            --revision "$GITHUB_SHA" --field identity)
          python3 scripts/sbom.py generate-dependencies \
            --source-version "$source_version" \
            --output lzug.dependencies.sbom.cdx.json
          python3 scripts/sbom.py validate \
            --kind dependencies \
            --input lzug.dependencies.sbom.cdx.json
          python3 scripts/sbom.py generate-image \
            --image "$IMAGE_REF" \
            --output lzug.image.sbom.cdx.json
          python3 scripts/sbom.py validate \
            --kind image \
            --input lzug.image.sbom.cdx.json
      - name: Upload canonical SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lzug-sboms
          path: |
            lzug.dependencies.sbom.cdx.json
            lzug.image.sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Block high and critical image findings
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.69.3
          image-ref: ${{ env.IMAGE_REF }}
          scanners: vuln,secret,misconfig
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

  container-runtime:
    name: Container runtime contract
    needs:
      - classify
      - image-build
    if: needs.classify.outputs.container == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runtime inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download the built image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lzug-quality-image
          path: ${{ runner.temp }}/lzug-quality-image
      - name: Load and verify the exact built image
        working-directory: ${{ runner.temp }}/lzug-quality-image
        run: |
          sha256sum --check lzug-image.tar.sha256
          docker load --input lzug-image.tar
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_REF")" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE_REF")" = "10001:10001"
      - name: Verify health, API, SPA, and hardened runtime contracts
        run: scripts/container-smoke.sh "$IMAGE_REF"

  compose:
    name: Compose runtime contract
    needs:
      - classify
      - image-build
    if: needs.classify.outputs.compose == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout runtime inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download the built image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lzug-quality-image
          path: ${{ runner.temp }}/lzug-quality-image
      - name: Load the exact built image
        working-directory: ${{ runner.temp }}/lzug-quality-image
        run: |
          sha256sum --check lzug-image.tar.sha256
          docker load --input lzug-image.tar
      - name: Verify Compose configuration, health, and persistence
        env:
          LZUG_IMAGE: ${{ env.IMAGE_REF }}
        run: scripts/compose-smoke.sh

  operator-container:
    name: Operator CLI-to-container contract
    needs:
      - classify
      - image-build
    if: needs.classify.outputs.operator_container == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runtime inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache: true
      - name: Download the built image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lzug-quality-image
          path: ${{ runner.temp }}/lzug-quality-image
      - name: Load the exact built image
        working-directory: ${{ runner.temp }}/lzug-quality-image
        run: |
          sha256sum --check lzug-image.tar.sha256
          docker load --input lzug-image.tar
      - name: Verify the operator transport against the packaged application
        run: scripts/operator-container-smoke.sh "$IMAGE_REF"

  e2e:
    name: Browser E2E
    needs: classify
    if: needs.classify.outputs.e2e == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"

      - name: Set up UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --locked --extra dev

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Resolve Playwright version
        id: playwright_version
        working-directory: frontend
        run: |
          node -e "console.log('version=' + require('./package-lock.json').packages['node_modules/@playwright/test'].version)" \
            >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        id: playwright_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Playwright browser
        id: playwright_install
        working-directory: frontend
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright_cache.outputs.cache-hit }}
        run: |
          started_at="$(date +%s)"
          npx playwright install --with-deps chromium
          elapsed_seconds="$(( $(date +%s) - started_at ))"
          echo "Playwright cache hit: ${PLAYWRIGHT_CACHE_HIT:-false}"
          echo "Playwright install seconds: $elapsed_seconds"
          echo "seconds=$elapsed_seconds" >> "$GITHUB_OUTPUT"

      - name: Run browser workflows
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload browser E2E report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-e2e-report
          path: frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7

  a11y:
    name: Accessibility
    needs: classify
    if: needs.classify.outputs.a11y == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"

      - name: Set up UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --locked --extra dev

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Resolve Playwright version
        id: playwright_version
        working-directory: frontend
        run: |
          node -e "console.log('version=' + require('./package-lock.json').packages['node_modules/@playwright/test'].version)" \
            >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        id: playwright_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Playwright browser
        id: playwright_install
        working-directory: frontend
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright_cache.outputs.cache-hit }}
        run: |
          started_at="$(date +%s)"
          npx playwright install --with-deps chromium
          elapsed_seconds="$(( $(date +%s) - started_at ))"
          echo "Playwright cache hit: ${PLAYWRIGHT_CACHE_HIT:-false}"
          echo "Playwright install seconds: $elapsed_seconds"
          echo "seconds=$elapsed_seconds" >> "$GITHUB_OUTPUT"

      - name: Run accessibility checks
        working-directory: frontend
        run: npm run test:a11y

      - name: Upload accessibility report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-a11y-report
          path: frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: classify
    if: github.event_name == 'pull_request' || needs.classify.outputs.codeql == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript
          - go
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          upload: always

  source-scan:
    name: Source secrets and misconfiguration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Scan the source tree
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
          skip-dirs: .git,.venv,frontend/node_modules

  backend-gate:
    name: Quality / Backend
    needs:
      - classify
      - backend
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require the selected backend checks
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          SELECTED: ${{ needs.classify.outputs.backend }}
          DETAIL_RESULT: ${{ needs.backend.result }}
        run: |
          test "$CLASSIFY_RESULT" = "success"
          if [ "$SELECTED" = "true" ]; then
            test "$DETAIL_RESULT" = "success"
          else
            test "$SELECTED" = "false"
            test "$DETAIL_RESULT" = "skipped"
          fi

  frontend-gate:
    name: Quality / Frontend
    needs:
      - classify
      - frontend
      - npm_security
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require the selected frontend checks
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          FRONTEND_SELECTED: ${{ needs.classify.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          NPM_SECURITY_SELECTED: ${{ needs.classify.outputs.npm_security }}
          NPM_SECURITY_RESULT: ${{ needs.npm_security.result }}
        run: |
          set -eu
          test "$CLASSIFY_RESULT" = "success"

          require_result() {
            selected="$1"
            result="$2"
            if [ "$selected" = "true" ]; then
              test "$result" = "success"
            else
              test "$selected" = "false"
              test "$result" = "skipped"
            fi
          }

          require_result "$FRONTEND_SELECTED" "$FRONTEND_RESULT"
          require_result "$NPM_SECURITY_SELECTED" "$NPM_SECURITY_RESULT"

  operator-gate:
    name: Quality / Operator CLI
    needs:
      - classify
      - operator-test
      - operator-build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected operator CLI check
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          SELECTED: ${{ needs.classify.outputs.operator_cli }}
          TEST_RESULT: ${{ needs.operator-test.result }}
          BUILD_RESULT: ${{ needs.operator-build.result }}
        run: |
          test "$CLASSIFY_RESULT" = "success"
          if [ "$SELECTED" = "false" ]; then
            test "$TEST_RESULT" = "skipped"
            test "$BUILD_RESULT" = "skipped"
            exit 0
          fi
          test "$SELECTED" = "true"
          test "$TEST_RESULT" = "success"
          test "$BUILD_RESULT" = "success"

  oci-gate:
    name: Quality / OCI
    needs:
      - classify
      - image-build
      - image-scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected OCI check
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          OCI_SELECTED: ${{ needs.classify.outputs.oci }}
          IMAGE_SELECTED: ${{ needs.classify.outputs.image }}
          IMAGE_RESULT: ${{ needs.image-build.result }}
          SCAN_RESULT: ${{ needs.image-scan.result }}
        run: |
          set -eu
          test "$CLASSIFY_RESULT" = "success"
          test "$IMAGE_SELECTED" = "true" -o "$IMAGE_SELECTED" = "false"
          if [ "$OCI_SELECTED" = "false" ]; then
            test "$SCAN_RESULT" = "skipped"
            exit 0
          fi
          test "$OCI_SELECTED" = "true"
          test "$IMAGE_SELECTED" = "true"
          test "$IMAGE_RESULT" = "success"
          test "$SCAN_RESULT" = "success"

  documentation-gate:
    name: Quality / Documentation
    needs:
      - classify
      - documentation
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require the selected documentation checks
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          SELECTED: ${{ needs.classify.outputs.documentation }}
          DETAIL_RESULT: ${{ needs.documentation.result }}
        run: |
          test "$CLASSIFY_RESULT" = "success"
          if [ "$SELECTED" = "true" ]; then
            test "$DETAIL_RESULT" = "success"
          else
            test "$SELECTED" = "false"
            test "$DETAIL_RESULT" = "skipped"
          fi

  security-gate:
    name: Quality / Security
    needs:
      - classify
      - codeql
      - source-scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected security check
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          SECURITY_SELECTED: ${{ needs.classify.outputs.security }}
          CODEQL_SELECTED: ${{ needs.classify.outputs.codeql }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          SOURCE_SCAN_RESULT: ${{ needs.source-scan.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$CLASSIFY_RESULT" = "success"
          test "$SOURCE_SCAN_RESULT" = "success"
          case "$SECURITY_SELECTED:$CODEQL_SELECTED" in
            true:true | true:false | false:false) ;;
            *) exit 1 ;;
          esac
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$CODEQL_SELECTED" = "true" ]; then
            test "$CODEQL_RESULT" = "success"
          else
            test "$CODEQL_SELECTED" = "false"
            test "$CODEQL_RESULT" = "skipped"
          fi

  overall-gate:
    name: Quality / Overall
    needs:
      - classify
      - image-build
      - container-runtime
      - compose
      - operator-container
      - e2e
      - a11y
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require every selected cross-domain check
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          OVERALL_SELECTED: ${{ needs.classify.outputs.overall }}
          IMAGE_SELECTED: ${{ needs.classify.outputs.image }}
          IMAGE_RESULT: ${{ needs.image-build.result }}
          CONTAINER_SELECTED: ${{ needs.classify.outputs.container }}
          CONTAINER_RESULT: ${{ needs.container-runtime.result }}
          COMPOSE_SELECTED: ${{ needs.classify.outputs.compose }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
          OPERATOR_CONTAINER_SELECTED: ${{ needs.classify.outputs.operator_container }}
          OPERATOR_CONTAINER_RESULT: ${{ needs.operator-container.result }}
          E2E_SELECTED: ${{ needs.classify.outputs.e2e }}
          E2E_RESULT: ${{ needs.e2e.result }}
          A11Y_SELECTED: ${{ needs.classify.outputs.a11y }}
          A11Y_RESULT: ${{ needs.a11y.result }}
        run: |
          set -eu
          test "$CLASSIFY_RESULT" = "success"
          test "$OVERALL_SELECTED" = "true" -o "$OVERALL_SELECTED" = "false"

          require_result() {
            selected="$1"
            result="$2"
            if [ "$selected" = "true" ]; then
              test "$result" = "success"
            else
              test "$selected" = "false"
              test "$result" = "skipped"
            fi
          }

          require_result "$IMAGE_SELECTED" "$IMAGE_RESULT"
          require_result "$CONTAINER_SELECTED" "$CONTAINER_RESULT"
          require_result "$COMPOSE_SELECTED" "$COMPOSE_RESULT"
          require_result "$OPERATOR_CONTAINER_SELECTED" "$OPERATOR_CONTAINER_RESULT"
          require_result "$E2E_SELECTED" "$E2E_RESULT"
          require_result "$A11Y_SELECTED" "$A11Y_RESULT"
