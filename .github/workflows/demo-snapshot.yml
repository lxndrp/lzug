name: Promote demo snapshot

on:
  push:
    tags:
      - "demo/v[0-9]*.[0-9]*.[0-9]*-SNAPSHOT.[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]"

permissions: {}

concurrency:
  group: demo-deployment
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify promoted current master snapshot
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      snapshot_tag: ${{ steps.contract.outputs.snapshot_tag }}
      snapshot_identity: ${{ steps.contract.outputs.snapshot_identity }}
      oci_tag: ${{ steps.contract.outputs.oci_tag }}
      target_version: ${{ steps.contract.outputs.target_version }}
      target_sha: ${{ steps.contract.outputs.target_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify new annotated tag and current master SHA
        id: contract
        env:
          EVENT_AFTER: ${{ github.event.after }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_CREATED: ${{ github.event.created }}
          EVENT_DELETED: ${{ github.event.deleted }}
          EVENT_FORCED: ${{ github.event.forced }}
          SNAPSHOT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          zero_sha=0000000000000000000000000000000000000000
          test "$EVENT_CREATED" = true
          test "$EVENT_DELETED" = false
          test "$EVENT_FORCED" = false
          test "$EVENT_BEFORE" = "$zero_sha" || {
            echo "Snapshot tags must be new and must never be moved or replaced." >&2
            exit 1
          }
          test "$(git cat-file -t "$SNAPSHOT_TAG")" = tag || {
            echo "The snapshot tag must be an annotated Git tag." >&2
            exit 1
          }
          tag_object=$(git rev-parse "$SNAPSHOT_TAG")
          target_sha=$(git rev-parse "$SNAPSHOT_TAG^{}")
          test "$EVENT_AFTER" = "$tag_object" || test "$EVENT_AFTER" = "$target_sha" || {
            echo "The pushed tag object does not match the checked out tag." >&2
            exit 1
          }
          git fetch --no-tags origin master
          master_sha=$(git rev-parse refs/remotes/origin/master)
          test "$target_sha" = "$master_sha" || {
            echo "Snapshot tag does not point to the current master SHA." >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$target_sha"

          snapshot_identity=$(python3 scripts/demo_snapshot.py identity \
            --tag "$SNAPSHOT_TAG" --revision "$target_sha" --field identity)
          oci_tag=$(python3 scripts/demo_snapshot.py identity \
            --tag "$SNAPSHOT_TAG" --revision "$target_sha" --field oci_tag)
          target_version=$(python3 scripts/demo_snapshot.py identity \
            --tag "$SNAPSHOT_TAG" --revision "$target_sha" --field target_version)

          set +e
          product_tag_query=$(git ls-remote --exit-code --tags origin \
            "refs/tags/$target_version" 2>&1)
          product_tag_status=$?
          set -e
          case "$product_tag_status" in
            0)
              echo "Target version already exists as a product tag: $target_version" >&2
              exit 1
              ;;
            2)
              ;;
            *)
              echo "Could not verify target product-tag availability: $product_tag_query" >&2
              exit 1
              ;;
          esac

          {
            echo "snapshot_tag=$SNAPSHOT_TAG"
            echo "snapshot_identity=$snapshot_identity"
            echo "oci_tag=$oci_tag"
            echo "target_version=$target_version"
            echo "target_sha=$target_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Verify complete Quality evidence for the exact master SHA
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.contract.outputs.target_sha }}
        run: |
          set -euo pipefail
          gh api \
            "repos/$GH_REPO/actions/workflows/quality.yml/runs?head_sha=$TARGET_SHA&per_page=100" | \
            python3 scripts/demo_snapshot.py validate-quality --revision "$TARGET_SHA"

      - name: Verify existing open future release milestone
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TARGET_VERSION: ${{ steps.contract.outputs.target_version }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/milestones?state=all&per_page=100" | \
            jq -s 'add' | \
            python3 scripts/demo_snapshot.py validate-milestone \
              --target-version "$TARGET_VERSION"
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" | \
            jq -s 'add' | \
            python3 scripts/demo_snapshot.py validate-releases \
              --target-version "$TARGET_VERSION"

      - name: Verify automatic demo Environment tag policy
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment=$(gh api "repos/$GH_REPO/environments/demo")
          jq -e '
            .deployment_branch_policy.protected_branches == false and
            .deployment_branch_policy.custom_branch_policies == true and
            all(.protection_rules[]; .type != "required_reviewers")
          ' <<<"$environment" >/dev/null || {
            echo "The demo Environment must use selected branch/tag policies without required reviewers." >&2
            exit 1
          }
          policies=$(gh api \
            "repos/$GH_REPO/environments/demo/deployment-branch-policies?per_page=100")
          jq -e '
            any(.branch_policies[]; .type == "branch" and .name == "master") and
            any(.branch_policies[]; .type == "tag" and .name == "demo/*-SNAPSHOT.*")
          ' <<<"$policies" >/dev/null || {
            echo "The demo Environment must allow master and demo snapshot tags." >&2
            exit 1
          }

  publish:
    name: Build, publish, and attest snapshot pair
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      app_image: ${{ steps.pair.outputs.app_image }}@${{ steps.app.outputs.digest }}
      seed_image: ${{ steps.pair.outputs.seed_image }}@${{ steps.seed.outputs.digest }}
      schema_fingerprint: ${{ steps.pair.outputs.schema_fingerprint }}
      seed_revision: ${{ steps.pair.outputs.seed_revision }}
    env:
      GH_REPO: ${{ github.repository }}
      SNAPSHOT_IDENTITY: ${{ needs.preflight.outputs.snapshot_identity }}
      SNAPSHOT_TAG: ${{ needs.preflight.outputs.snapshot_tag }}
      TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
      TARGET_VERSION: ${{ needs.preflight.outputs.target_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.snapshot_tag }}
          fetch-depth: 0

      - name: Reverify immutable checkout before building
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$SNAPSHOT_TAG")" = tag
          test "$(git rev-parse "$SNAPSHOT_TAG^{}")" = "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the snapshot seed candidate exactly once
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.demo-seed
          load: true
          tags: lzug-demo-seed:snapshot-candidate
          build-args: |
            PRODUCT_TAG=${{ env.SNAPSHOT_TAG }}
            VCS_REF=${{ env.TARGET_SHA }}
          cache-from: type=gha,scope=lzug-demo-seed
          cache-to: type=gha,mode=max,scope=lzug-demo-seed
          provenance: false
          sbom: false

      - name: Inspect seed metadata and derive immutable references
        id: pair
        run: |
          set -euo pipefail
          temporary_directory=$(mktemp -d)
          container=$(docker create lzug-demo-seed:snapshot-candidate)
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            rm -rf "$temporary_directory"
          }
          trap cleanup EXIT
          docker cp "$container:/opt/lzug-demo/seed/lzug.sqlite" "$temporary_directory/lzug.sqlite"
          docker cp "$container:/opt/lzug-demo/seed/manifest.json" "$temporary_directory/manifest.json"
          expected_schema_fingerprint=$(python3 -c \
            'from pathlib import Path; from demo.artifacts import schema_binding; print(schema_binding(Path("."))["fingerprint"])')
          python3 -m demo.artifacts verify-seed \
            --database "$temporary_directory/lzug.sqlite" \
            --manifest "$temporary_directory/manifest.json" \
            --expected-product-tag "$SNAPSHOT_TAG" \
            --expected-product-commit "$TARGET_SHA" \
            --expected-schema-fingerprint "$expected_schema_fingerprint"
          jq -e \
            --arg channel snapshot \
            --arg commit "$TARGET_SHA" \
            --arg identity "$SNAPSHOT_IDENTITY" \
            --arg tag "$SNAPSHOT_TAG" \
            --arg target "$TARGET_VERSION" \
            '.product == {channel: $channel, commit: $commit, identity: $identity, tag: $tag, target_version: $target, version: $identity}' \
            "$temporary_directory/manifest.json" >/dev/null
          seed_revision=$(jq -er '.seed_revision' "$temporary_directory/manifest.json")
          schema_fingerprint=$(jq -er '.schema.fingerprint' "$temporary_directory/manifest.json")
          app_image="ghcr.io/${GH_REPO,,}-demo-app"
          seed_image="ghcr.io/${GH_REPO,,}-demo-seed"
          {
            echo "app_image=$app_image"
            echo "app_ref=$app_image:${{ needs.preflight.outputs.oci_tag }}"
            echo "seed_image=$seed_image"
            echo "seed_ref=$seed_image:${{ needs.preflight.outputs.oci_tag }}-seed-$seed_revision"
            echo "seed_revision=$seed_revision"
            echo "schema_fingerprint=$schema_fingerprint"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject occupied snapshot OCI references
        env:
          APP_REF: ${{ steps.pair.outputs.app_ref }}
          SEED_REF: ${{ steps.pair.outputs.seed_ref }}
        run: |
          set -euo pipefail
          for reference in "$APP_REF" "$SEED_REF"; do
            set +e
            inspection=$(docker buildx imagetools inspect "$reference" 2>&1)
            inspection_status=$?
            set -e
            if test "$inspection_status" -eq 0; then
              echo "Immutable snapshot reference already exists: $reference" >&2
              exit 1
            fi
            if ! grep -Eqi 'manifest unknown|not found|no such manifest' <<<"$inspection"; then
              echo "Could not verify snapshot reference availability: $reference" >&2
              echo "$inspection" >&2
              exit 1
            fi
          done

      - name: Build and publish snapshot application
        id: app
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.demo
          push: true
          tags: ${{ steps.pair.outputs.app_ref }}
          build-args: |
            BUILD_IDENTITY=${{ env.SNAPSHOT_IDENTITY }}
            PRODUCT_TAG=${{ env.SNAPSHOT_TAG }}
            VCS_REF=${{ env.TARGET_SHA }}
          cache-from: type=gha,scope=lzug-demo-app
          cache-to: type=gha,mode=max,scope=lzug-demo-app
          provenance: false
          sbom: false

      - name: Publish the inspected snapshot seed
        id: seed
        env:
          SEED_REF: ${{ steps.pair.outputs.seed_ref }}
        run: |
          set -euo pipefail
          docker tag lzug-demo-seed:snapshot-candidate "$SEED_REF"
          docker push "$SEED_REF"
          seed_digest=$(docker buildx imagetools inspect "$SEED_REF" | \
            awk '$1 == "Digest:" { print $2; exit }')
          printf '%s\n' "$seed_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "digest=$seed_digest" >> "$GITHUB_OUTPUT"

      - name: Validate canonical published digests
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          SEED_DIGEST: ${{ steps.seed.outputs.digest }}
        run: |
          set -euo pipefail
          for digest in "$APP_DIGEST" "$SEED_DIGEST"; do
            printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          done

      - name: Download Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.0

      - name: Generate and validate separate snapshot SBOMs
        env:
          APP_REF: ${{ steps.pair.outputs.app_ref }}
          SEED_REF: ${{ steps.pair.outputs.seed_ref }}
          SYFT_BINARY: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          python3 scripts/sbom.py generate-image \
            --image "$APP_REF" --output "$RUNNER_TEMP/lzug-demo-snapshot-app.sbom.cdx.json"
          python3 scripts/sbom.py validate \
            --kind image --input "$RUNNER_TEMP/lzug-demo-snapshot-app.sbom.cdx.json"
          python3 scripts/sbom.py generate-image \
            --image "$SEED_REF" --output "$RUNNER_TEMP/lzug-demo-snapshot-seed.sbom.cdx.json"
          python3 scripts/sbom.py validate \
            --kind image --input "$RUNNER_TEMP/lzug-demo-snapshot-seed.sbom.cdx.json"

      - name: Attest snapshot application provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.pair.outputs.app_image }}
          subject-digest: ${{ steps.app.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest snapshot application SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.pair.outputs.app_image }}
          subject-digest: ${{ steps.app.outputs.digest }}
          sbom-path: ${{ runner.temp }}/lzug-demo-snapshot-app.sbom.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest snapshot seed provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.pair.outputs.seed_image }}
          subject-digest: ${{ steps.seed.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest snapshot seed SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.pair.outputs.seed_image }}
          subject-digest: ${{ steps.seed.outputs.digest }}
          sbom-path: ${{ runner.temp }}/lzug-demo-snapshot-seed.sbom.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Record immutable snapshot publication evidence
        run: |
          {
            echo "### Demo snapshot published and attested"
            echo "- Identity: \`$SNAPSHOT_IDENTITY\` (development snapshot, not a product release)"
            echo "- Snapshot tag: \`$SNAPSHOT_TAG\`"
            echo "- Target version: \`$TARGET_VERSION\`"
            echo "- Commit: \`$TARGET_SHA\`"
            echo "- App: \`${{ steps.pair.outputs.app_image }}@${{ steps.app.outputs.digest }}\`"
            echo "- Seed: \`${{ steps.pair.outputs.seed_image }}@${{ steps.seed.outputs.digest }}\`"
            echo "- Schema fingerprint: \`${{ steps.pair.outputs.schema_fingerprint }}\`"
            echo "- Seed revision: \`${{ steps.pair.outputs.seed_revision }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy snapshot pair to public demo
    needs:
      - preflight
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: demo
      url: ${{ vars.DEMO_URL }}
    permissions:
      attestations: read
      contents: read
      id-token: write
      packages: read
    env:
      APP_IMAGE: ${{ needs.publish.outputs.app_image }}
      SEED_IMAGE: ${{ needs.publish.outputs.seed_image }}
      PRODUCT_TAG: ${{ needs.preflight.outputs.snapshot_tag }}
      PRODUCT_COMMIT: ${{ needs.preflight.outputs.target_sha }}
      SCHEMA_FINGERPRINT: ${{ needs.publish.outputs.schema_fingerprint }}
      SEED_REVISION: ${{ needs.publish.outputs.seed_revision }}
      SNAPSHOT_IDENTITY: ${{ needs.preflight.outputs.snapshot_identity }}
      TARGET_VERSION: ${{ needs.preflight.outputs.target_version }}
      DEMO_URL: ${{ vars.DEMO_URL }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}

      - name: Validate digest pair and secret-free demo Environment inputs
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_CONTAINER_APP DEMO_URL; do
            test -n "${!name:-}" || {
              echo "Required demo Environment variable is missing: $name" >&2
              exit 1
            }
          done
          python3 scripts/demo_deployment.py validate-inputs \
            --app-image "$APP_IMAGE" \
            --seed-image "$SEED_IMAGE" \
            --product-tag "$PRODUCT_TAG" \
            --product-commit "$PRODUCT_COMMIT" \
            --schema-fingerprint "$SCHEMA_FINGERPRINT" \
            --seed-revision "$SEED_REVISION" \
            --demo-url "$DEMO_URL"

      - name: Authenticate to GHCR without a long-lived credential
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify snapshot provenance and SBOM attestations for both digests
        run: |
          set -euo pipefail
          for image in "$APP_IMAGE" "$SEED_IMAGE"; do
            gh attestation verify "oci://$image" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow lxndrp/lzug/.github/workflows/demo-snapshot.yml \
              --bundle-from-oci \
              --predicate-type https://slsa.dev/provenance/v1
            gh attestation verify "oci://$image" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow lxndrp/lzug/.github/workflows/demo-snapshot.yml \
              --bundle-from-oci \
              --predicate-type https://cyclonedx.org/bom
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Log in to Azure using GitHub OIDC
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Update the app and seed as one Container Apps revision
        id: deployment
        run: |
          set -euo pipefail
          revision_suffix="snap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 scripts/demo_deployment.py deploy \
            --subscription-id "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --container-app "$AZURE_CONTAINER_APP" \
            --app-image "$APP_IMAGE" \
            --seed-image "$SEED_IMAGE" \
            --product-tag "$PRODUCT_TAG" \
            --product-commit "$PRODUCT_COMMIT" \
            --schema-fingerprint "$SCHEMA_FINGERPRINT" \
            --seed-revision "$SEED_REVISION" \
            --revision-suffix "$revision_suffix" \
            --record "$RUNNER_TEMP/demo-deployment.json"
          echo "revision_suffix=$revision_suffix" >> "$GITHUB_OUTPUT"

      - name: Wait for the new Azure revision to become ready
        run: |
          python3 scripts/demo_deployment.py wait-readiness \
            --subscription-id "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --container-app "$AZURE_CONTAINER_APP" \
            --app-image "$APP_IMAGE" --seed-image "$SEED_IMAGE" \
            --product-tag "$PRODUCT_TAG" --product-commit "$PRODUCT_COMMIT" \
            --schema-fingerprint "$SCHEMA_FINGERPRINT" --seed-revision "$SEED_REVISION" \
            --revision-suffix "${{ steps.deployment.outputs.revision_suffix }}"

      - name: Wait separately for application health
        run: |
          python3 scripts/demo_deployment.py wait-health \
            --demo-url "$DEMO_URL" \
            --app-image "$APP_IMAGE" --seed-image "$SEED_IMAGE" \
            --product-tag "$PRODUCT_TAG" --product-commit "$PRODUCT_COMMIT" \
            --schema-fingerprint "$SCHEMA_FINGERPRINT" --seed-revision "$SEED_REVISION"

      - name: Wait separately for application readiness
        run: |
          python3 scripts/demo_deployment.py wait-application-readiness \
            --demo-url "$DEMO_URL" \
            --app-image "$APP_IMAGE" --seed-image "$SEED_IMAGE" \
            --product-tag "$PRODUCT_TAG" --product-commit "$PRODUCT_COMMIT" \
            --schema-fingerprint "$SCHEMA_FINGERPRINT" --seed-revision "$SEED_REVISION"

      - name: Smoke-test health, readiness, demo API, protected OpenAPI, and the central frontend route
        run: |
          python3 scripts/demo_deployment.py smoke \
            --demo-url "$DEMO_URL" \
            --app-image "$APP_IMAGE" --seed-image "$SEED_IMAGE" \
            --product-tag "$PRODUCT_TAG" --product-commit "$PRODUCT_COMMIT" \
            --schema-fingerprint "$SCHEMA_FINGERPRINT" --seed-revision "$SEED_REVISION"

      - name: Record snapshot deployment evidence
        if: success()
        run: |
          previous_app=$(jq -er '.previous.app_image' "$RUNNER_TEMP/demo-deployment.json")
          previous_seed=$(jq -er '.previous.seed_image' "$RUNNER_TEMP/demo-deployment.json")
          {
            echo "### Demo snapshot deployment succeeded"
            echo "- Identity: \`$SNAPSHOT_IDENTITY\` (development snapshot, not a product release)"
            echo "- Target version: \`$TARGET_VERSION\`"
            echo "- Snapshot tag: \`$PRODUCT_TAG\`"
            echo "- Commit: \`$PRODUCT_COMMIT\`"
            echo "- App: \`$APP_IMAGE\`"
            echo "- Seed: \`$SEED_IMAGE\`"
            echo "- Schema fingerprint: \`$SCHEMA_FINGERPRINT\`"
            echo "- Seed revision: \`$SEED_REVISION\`"
            echo "- Azure revision suffix: \`${{ steps.deployment.outputs.revision_suffix }}\`"
            echo "- Previous app digest: \`$previous_app\`"
            echo "- Previous seed digest: \`$previous_seed\`"
            echo "- Azure readiness, HTTP liveness, application readiness, demo API, protected OpenAPI authentication boundary, and frontend checks passed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Explain failure and collect non-sensitive rollback evidence
        if: failure()
        run: |
          {
            echo "### Demo snapshot deployment failed"
            echo "The run is not deployment evidence. Never move or replace the snapshot tag or either OCI reference."
            echo "Use the existing manual rollback operation only with all six values of a previously verified complete pair."
          } >> "$GITHUB_STEP_SUMMARY"
          if test -f "$RUNNER_TEMP/demo-deployment.json"; then
            previous_app=$(jq -er '.previous.app_image' "$RUNNER_TEMP/demo-deployment.json")
            previous_seed=$(jq -er '.previous.seed_image' "$RUNNER_TEMP/demo-deployment.json")
            {
              echo "- Previous app digest: \`$previous_app\`"
              echo "- Previous seed digest: \`$previous_seed\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 scripts/demo_deployment.py diagnostics \
            --subscription-id "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --container-app "$AZURE_CONTAINER_APP" || true
