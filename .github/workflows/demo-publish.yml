name: Publish Demo Images

on:
  workflow_dispatch:
    inputs:
      product_tag:
        description: Existing annotated product tag (for example v0.1.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: demo-publish-${{ inputs.product_tag }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify immutable product release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    outputs:
      product_tag: ${{ steps.contract.outputs.product_tag }}
      product_version: ${{ steps.contract.outputs.product_version }}
      target_sha: ${{ steps.contract.outputs.target_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.product_tag }}
          fetch-depth: 0

      - name: Verify tag, product release, image, attestation, and quality evidence
        id: contract
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PRODUCT_TAG: ${{ inputs.product_tag }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          test "$(git cat-file -t "$PRODUCT_TAG")" = tag || {
            echo "The product tag must be annotated." >&2
            exit 1
          }
          target_sha=$(git rev-parse "$PRODUCT_TAG^{}")
          test "$(git rev-parse HEAD)" = "$target_sha"
          product_version=$(python3 scripts/build_metadata.py \
            --tag "$PRODUCT_TAG" --revision "$target_sha" --field identity)
          gh release view "$PRODUCT_TAG" --repo "$GH_REPO" \
            --json isDraft --jq 'select(.isDraft == false)' >/dev/null || {
            echo "The product release must be published, not a draft." >&2
            exit 1
          }

          product_image="ghcr.io/${GH_REPO,,}:$product_version"
          gh attestation verify "oci://$product_image" --repo "$GH_REPO" >/dev/null

          quality_runs=$(gh api \
            "repos/$GH_REPO/actions/workflows/quality.yml/runs?head_sha=$target_sha&status=success&per_page=100")
          jq -e --arg sha "$target_sha" '
            any(.workflow_runs[]; .head_sha == $sha and .conclusion == "success")
          ' <<<"$quality_runs" >/dev/null || {
            echo "No successful complete Quality workflow exists for $target_sha." >&2
            exit 1
          }

          {
            echo "product_tag=$PRODUCT_TAG"
            echo "product_version=$product_version"
            echo "target_sha=$target_sha"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish and attest demo image pair
    needs: preflight
    runs-on: ubuntu-latest
    environment: release
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      GH_REPO: ${{ github.repository }}
      PRODUCT_TAG: ${{ needs.preflight.outputs.product_tag }}
      PRODUCT_VERSION: ${{ needs.preflight.outputs.product_version }}
      TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the demo seed candidate exactly once
        id: seed_candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.demo-seed
          load: true
          tags: lzug-demo-seed:publish-candidate
          build-args: |
            PRODUCT_TAG=${{ env.PRODUCT_TAG }}
            VCS_REF=${{ env.TARGET_SHA }}
          cache-from: type=gha,scope=lzug-demo-seed
          cache-to: type=gha,mode=max,scope=lzug-demo-seed
          provenance: false
          sbom: false

      - name: Inspect the embedded seed and derive immutable references
        id: images
        env:
          SEED_CANDIDATE: lzug-demo-seed:publish-candidate
        run: |
          set -euo pipefail
          temporary_directory=$(mktemp -d)
          container=$(docker create "$SEED_CANDIDATE")
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            rm -rf "$temporary_directory"
          }
          trap cleanup EXIT
          docker cp \
            "$container:/opt/lzug-demo/seed/lzug.sqlite" \
            "$temporary_directory/lzug.sqlite"
          docker cp \
            "$container:/opt/lzug-demo/seed/manifest.json" \
            "$temporary_directory/manifest.json"
          expected_schema_fingerprint=$(python3 -c \
            'from pathlib import Path; from demo.artifacts import schema_binding; print(schema_binding(Path("."))["fingerprint"])')
          python3 -m demo.artifacts verify-seed \
            --database "$temporary_directory/lzug.sqlite" \
            --manifest "$temporary_directory/manifest.json" \
            --expected-product-tag "$PRODUCT_TAG" \
            --expected-product-commit "$TARGET_SHA" \
            --expected-schema-fingerprint "$expected_schema_fingerprint"
          seed_revision=$(jq -er '.seed_revision' "$temporary_directory/manifest.json")
          runtime_contract=$(jq -er '.runtime_contract' "$temporary_directory/manifest.json")
          schema_fingerprint=$(jq -er '.schema.fingerprint' "$temporary_directory/manifest.json")
          app_image="ghcr.io/${GH_REPO,,}-demo-app"
          seed_image="ghcr.io/${GH_REPO,,}-demo-seed"
          {
            echo "app_image=$app_image"
            echo "app_ref=$app_image:$PRODUCT_VERSION"
            echo "seed_image=$seed_image"
            echo "seed_ref=$seed_image:$PRODUCT_VERSION-seed-$seed_revision"
            echo "seed_revision=$seed_revision"
            echo "runtime_contract=$runtime_contract"
            echo "schema_fingerprint=$schema_fingerprint"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject moving or replacing an existing demo reference
        env:
          APP_REF: ${{ steps.images.outputs.app_ref }}
          SEED_REF: ${{ steps.images.outputs.seed_ref }}
        run: |
          set -euo pipefail
          for reference in "$APP_REF" "$SEED_REF"; do
            if docker buildx imagetools inspect "$reference" >/dev/null 2>&1; then
              echo "Immutable demo reference already exists: $reference" >&2
              exit 1
            fi
          done

      - name: Build and publish demo application
        id: app
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.demo
          push: true
          tags: ${{ steps.images.outputs.app_ref }}
          build-args: |
            BUILD_IDENTITY=${{ env.PRODUCT_VERSION }}
            PRODUCT_TAG=${{ env.PRODUCT_TAG }}
            VCS_REF=${{ env.TARGET_SHA }}
          cache-from: type=gha,scope=lzug-demo-app
          cache-to: type=gha,mode=max,scope=lzug-demo-app
          provenance: false
          sbom: false

      - name: Tag and publish the inspected demo seed
        id: seed
        env:
          SEED_CANDIDATE: lzug-demo-seed:publish-candidate
          SEED_REF: ${{ steps.images.outputs.seed_ref }}
        run: |
          set -euo pipefail
          docker tag "$SEED_CANDIDATE" "$SEED_REF"
          docker push "$SEED_REF"
          seed_digest=$(docker buildx imagetools inspect "$SEED_REF" | \
            awk '$1 == "Digest:" { print $2; exit }')
          printf '%s\n' "$seed_digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || {
            echo "Published seed reference has no valid registry digest." >&2
            exit 1
          }
          echo "digest=$seed_digest" >> "$GITHUB_OUTPUT"

      - name: Download Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.0

      - name: Generate and validate separate image SBOMs
        env:
          APP_REF: ${{ steps.images.outputs.app_ref }}
          SEED_REF: ${{ steps.images.outputs.seed_ref }}
          SYFT_BINARY: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          python3 scripts/sbom.py generate-image \
            --image "$APP_REF" --output "$RUNNER_TEMP/lzug-demo-app.sbom.cdx.json"
          python3 scripts/sbom.py validate \
            --kind image --input "$RUNNER_TEMP/lzug-demo-app.sbom.cdx.json"
          python3 scripts/sbom.py generate-image \
            --image "$SEED_REF" --output "$RUNNER_TEMP/lzug-demo-seed.sbom.cdx.json"
          python3 scripts/sbom.py validate \
            --kind image --input "$RUNNER_TEMP/lzug-demo-seed.sbom.cdx.json"

      - name: Attest demo application provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.images.outputs.app_image }}
          subject-digest: ${{ steps.app.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest demo application SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.images.outputs.app_image }}
          subject-digest: ${{ steps.app.outputs.digest }}
          sbom-path: ${{ runner.temp }}/lzug-demo-app.sbom.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest demo seed provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.images.outputs.seed_image }}
          subject-digest: ${{ steps.seed.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest demo seed SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.images.outputs.seed_image }}
          subject-digest: ${{ steps.seed.outputs.digest }}
          sbom-path: ${{ runner.temp }}/lzug-demo-seed.sbom.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Record the immutable deployable pair
        run: |
          {
            echo "### Demo image pair"
            echo "- App: \`${{ steps.images.outputs.app_image }}@${{ steps.app.outputs.digest }}\`"
            echo "- Seed: \`${{ steps.images.outputs.seed_image }}@${{ steps.seed.outputs.digest }}\`"
            echo "- Seed revision: \`${{ steps.images.outputs.seed_revision }}\`"
            echo "- Runtime contract: \`${{ steps.images.outputs.runtime_contract }}\`"
            echo "- Schema fingerprint: \`${{ steps.images.outputs.schema_fingerprint }}\`"
            echo "- Product tag: \`$PRODUCT_TAG\`"
            echo "- Product commit: \`$TARGET_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
