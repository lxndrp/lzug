name: Publish Demo Images

on:
  workflow_call:
    inputs:
      product_tag:
        description: Published stable product tag (for example v0.2.0)
        required: true
        type: string
    outputs:
      app_image:
        description: Resolved immutable demo application digest
        value: ${{ jobs.resolve.outputs.app_image }}
      seed_image:
        description: Resolved immutable demo seed digest
        value: ${{ jobs.resolve.outputs.seed_image }}
      product_tag:
        description: Stable product tag shared by the pair
        value: ${{ jobs.resolve.outputs.product_tag }}
      product_commit:
        description: Product commit shared by the pair
        value: ${{ jobs.resolve.outputs.product_commit }}
      runtime_contract:
        description: Runtime contract shared by the pair
        value: ${{ jobs.resolve.outputs.runtime_contract }}
      schema_fingerprint:
        description: Schema fingerprint shared by the pair
        value: ${{ jobs.resolve.outputs.schema_fingerprint }}
      seed_revision:
        description: Seed revision bound into the app package
        value: ${{ jobs.resolve.outputs.seed_revision }}

permissions:
  contents: read

concurrency:
  group: demo-publish-${{ inputs.product_tag }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify immutable product release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    outputs:
      product_tag: ${{ steps.contract.outputs.product_tag }}
      product_version: ${{ steps.contract.outputs.product_version }}
      target_sha: ${{ steps.contract.outputs.target_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.product_tag }}
          fetch-depth: 0

      - name: Verify stable tag, product release, image, attestation, and quality evidence
        id: contract
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PRODUCT_TAG: ${{ inputs.product_tag }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          test "$(git cat-file -t "$PRODUCT_TAG")" = tag || {
            echo "The product tag must be annotated." >&2
            exit 1
          }
          target_sha=$(git rev-parse "$PRODUCT_TAG^{}")
          test "$(git rev-parse HEAD)" = "$target_sha"
          product_version=$(python3 -m demo.contract identity \
            --tag "$PRODUCT_TAG" --commit "$target_sha" \
            --channel stable --field identity)
          gh release view "$PRODUCT_TAG" --repo "$GH_REPO" \
            --json isDraft --jq 'select(.isDraft == false)' >/dev/null || {
            echo "The product release must be published, not a draft." >&2
            exit 1
          }

          product_image="ghcr.io/${GH_REPO,,}:$product_version"
          gh attestation verify "oci://$product_image" --repo "$GH_REPO" >/dev/null

          quality_runs=$(gh api \
            "repos/$GH_REPO/actions/workflows/quality.yml/runs?branch=master&head_sha=$target_sha&status=success&per_page=100")
          jq -e --arg sha "$target_sha" '
            any(.workflow_runs[];
              .head_sha == $sha and
              .head_branch == "master" and
              .conclusion == "success")
          ' <<<"$quality_runs" >/dev/null || {
            echo "No successful complete Quality workflow exists for $target_sha." >&2
            exit 1
          }

          {
            echo "product_tag=$PRODUCT_TAG"
            echo "product_version=$product_version"
            echo "target_sha=$target_sha"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish and attest demo image pair
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      GH_REPO: ${{ github.repository }}
      PRODUCT_TAG: ${{ needs.preflight.outputs.product_tag }}
      PRODUCT_VERSION: ${{ needs.preflight.outputs.product_version }}
      TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the demo seed candidate exactly once
        id: seed_candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: demo/Dockerfile.demo-seed
          load: true
          tags: lzug-demo-seed:publish-candidate
          build-args: |
            PRODUCT_TAG=${{ env.PRODUCT_TAG }}
            VCS_REF=${{ env.TARGET_SHA }}
          cache-from: type=gha,scope=lzug-demo-seed
          cache-to: type=gha,mode=max,scope=lzug-demo-seed
          provenance: false
          sbom: false

      - name: Inspect the embedded seed and derive immutable references
        id: images
        env:
          SEED_CANDIDATE: lzug-demo-seed:publish-candidate
        run: |
          set -euo pipefail
          temporary_directory=$(mktemp -d)
          container=$(docker create "$SEED_CANDIDATE")
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            rm -rf "$temporary_directory"
          }
          trap cleanup EXIT
          docker cp \
            "$container:/opt/lzug-demo/seed/lzug.sqlite" \
            "$temporary_directory/lzug.sqlite"
          docker cp \
            "$container:/opt/lzug-demo/seed/manifest.json" \
            "$temporary_directory/manifest.json"
          expected_schema_fingerprint=$(python3 -c \
            'from pathlib import Path; from demo.artifacts import schema_binding; print(schema_binding(Path("."))["fingerprint"])')
          python3 -m demo.artifacts verify-seed \
            --database "$temporary_directory/lzug.sqlite" \
            --manifest "$temporary_directory/manifest.json" \
            --expected-product-tag "$PRODUCT_TAG" \
            --expected-product-commit "$TARGET_SHA" \
            --expected-schema-fingerprint "$expected_schema_fingerprint"
          seed_revision=$(python3 -m demo.contract manifest-field \
            --manifest "$temporary_directory/manifest.json" --kind seed \
            --expected-product-tag "$PRODUCT_TAG" --expected-product-commit "$TARGET_SHA" \
            --field seed_revision)
          runtime_contract=$(python3 -m demo.contract manifest-field \
            --manifest "$temporary_directory/manifest.json" --kind seed \
            --expected-product-tag "$PRODUCT_TAG" --expected-product-commit "$TARGET_SHA" \
            --field runtime_contract)
          schema_fingerprint=$(python3 -m demo.contract manifest-field \
            --manifest "$temporary_directory/manifest.json" --kind seed \
            --expected-product-tag "$PRODUCT_TAG" --expected-product-commit "$TARGET_SHA" \
            --field schema_fingerprint)
          app_image="ghcr.io/${GH_REPO,,}-demo-app"
          seed_image="ghcr.io/${GH_REPO,,}-demo-seed"
          {
            echo "app_image=$app_image"
            echo "app_ref=$app_image:$PRODUCT_VERSION"
            echo "seed_image=$seed_image"
            echo "seed_ref=$seed_image:$PRODUCT_VERSION-seed-$seed_revision"
            echo "seed_revision=$seed_revision"
            echo "runtime_contract=$runtime_contract"
            echo "schema_fingerprint=$schema_fingerprint"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Classify immutable package availability
        id: availability
        env:
          APP_REF: ${{ steps.images.outputs.app_ref }}
          SEED_REF: ${{ steps.images.outputs.seed_ref }}
        run: |
          set -euo pipefail
          inspect() {
            local reference=$1
            local output status
            set +e
            output=$(docker buildx imagetools inspect "$reference" 2>&1)
            status=$?
            set -e
            if test "$status" -eq 0; then
              printf 'present'
            elif grep -Eqi 'manifest unknown|not found|no such manifest' <<<"$output"; then
              printf 'absent'
            else
              echo "Could not verify immutable package availability: $reference" >&2
              echo "$output" >&2
              exit 1
            fi
          }
          app_state=$(inspect "$APP_REF")
          seed_state=$(inspect "$SEED_REF")
          case "$app_state:$seed_state" in
            absent:absent)
              echo "reuse=false" >> "$GITHUB_OUTPUT"
              ;;
            present:present)
              echo "reuse=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "The immutable demo package pair is only partially published and will not be overwritten." >&2
              exit 1
              ;;
          esac

      - name: Build and publish demo application
        id: app
        if: steps.availability.outputs.reuse != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: demo/Dockerfile.demo
          push: true
          tags: ${{ steps.images.outputs.app_ref }}
          build-args: |
            BUILD_IDENTITY=${{ env.PRODUCT_VERSION }}
            PRODUCT_TAG=${{ env.PRODUCT_TAG }}
            VCS_REF=${{ env.TARGET_SHA }}
            SEED_REVISION=${{ steps.images.outputs.seed_revision }}
          cache-from: type=gha,scope=lzug-demo-app
          cache-to: type=gha,mode=max,scope=lzug-demo-app
          provenance: false
          sbom: false

      - name: Tag and publish the inspected demo seed
        id: seed
        if: steps.availability.outputs.reuse != 'true'
        env:
          SEED_CANDIDATE: lzug-demo-seed:publish-candidate
          SEED_REF: ${{ steps.images.outputs.seed_ref }}
        run: |
          set -euo pipefail
          docker tag "$SEED_CANDIDATE" "$SEED_REF"
          docker push "$SEED_REF"
          seed_digest=$(docker buildx imagetools inspect "$SEED_REF" | \
            awk '$1 == "Digest:" { print $2; exit }')
          echo "digest=$seed_digest" >> "$GITHUB_OUTPUT"

      - name: Validate the newly published immutable pair
        if: steps.availability.outputs.reuse != 'true'
        run: >-
          python3 -m demo.contract validate-pair
          --app-image "${{ steps.images.outputs.app_image }}@${{ steps.app.outputs.digest }}"
          --seed-image "${{ steps.images.outputs.seed_image }}@${{ steps.seed.outputs.digest }}"
          --product-tag "$PRODUCT_TAG"
          --product-commit "$TARGET_SHA"
          --runtime-contract "${{ steps.images.outputs.runtime_contract }}"
          --schema-fingerprint "${{ steps.images.outputs.schema_fingerprint }}"
          --seed-revision "${{ steps.images.outputs.seed_revision }}"

      - name: Download Syft
        id: syft
        if: steps.availability.outputs.reuse != 'true'
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.0

      - name: Generate and validate separate image SBOMs
        if: steps.availability.outputs.reuse != 'true'
        env:
          APP_REF: ${{ steps.images.outputs.app_ref }}
          SEED_REF: ${{ steps.images.outputs.seed_ref }}
          SYFT_BINARY: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          python3 scripts/sbom.py generate-image \
            --image "$APP_REF" --output "$RUNNER_TEMP/lzug-demo-app.sbom.cdx.json"
          python3 scripts/sbom.py validate \
            --kind image --input "$RUNNER_TEMP/lzug-demo-app.sbom.cdx.json"
          python3 scripts/sbom.py generate-image \
            --image "$SEED_REF" --output "$RUNNER_TEMP/lzug-demo-seed.sbom.cdx.json"
          python3 scripts/sbom.py validate \
            --kind image --input "$RUNNER_TEMP/lzug-demo-seed.sbom.cdx.json"

      - name: Attest demo application provenance
        if: steps.availability.outputs.reuse != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.images.outputs.app_image }}
          subject-digest: ${{ steps.app.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest demo application SBOM
        if: steps.availability.outputs.reuse != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.images.outputs.app_image }}
          subject-digest: ${{ steps.app.outputs.digest }}
          sbom-path: ${{ runner.temp }}/lzug-demo-app.sbom.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest demo seed provenance
        if: steps.availability.outputs.reuse != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.images.outputs.seed_image }}
          subject-digest: ${{ steps.seed.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest demo seed SBOM
        if: steps.availability.outputs.reuse != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.images.outputs.seed_image }}
          subject-digest: ${{ steps.seed.outputs.digest }}
          sbom-path: ${{ runner.temp }}/lzug-demo-seed.sbom.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Record package publication outcome
        run: |
          {
            echo "### Demo package publication"
            echo "- App package: \`${{ steps.images.outputs.app_ref }}\`"
            echo "- Seed package: \`${{ steps.images.outputs.seed_ref }}\`"
            echo "- Reused immutable references: \`${{ steps.availability.outputs.reuse }}\`"
            echo "- Seed revision: \`${{ steps.images.outputs.seed_revision }}\`"
            echo "- Product tag: \`$PRODUCT_TAG\`"
            echo "- Product commit: \`$TARGET_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

  resolve:
    name: Resolve and verify immutable package pair
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: read
      packages: read
    outputs:
      app_image: ${{ steps.pair.outputs.app_image }}
      seed_image: ${{ steps.pair.outputs.seed_image }}
      product_tag: ${{ needs.preflight.outputs.product_tag }}
      product_commit: ${{ needs.preflight.outputs.target_sha }}
      runtime_contract: ${{ steps.pair.outputs.runtime_contract }}
      schema_fingerprint: ${{ steps.pair.outputs.schema_fingerprint }}
      seed_revision: ${{ steps.pair.outputs.seed_revision }}
    env:
      GH_REPO: ${{ github.repository }}
      PRODUCT_TAG: ${{ needs.preflight.outputs.product_tag }}
      PRODUCT_VERSION: ${{ needs.preflight.outputs.product_version }}
      TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Authenticate to GHCR without a long-lived credential
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Resolve app first, derive seed revision, and verify the pair
        id: pair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          app_name="ghcr.io/${GH_REPO,,}-demo-app"
          seed_name="ghcr.io/${GH_REPO,,}-demo-seed"
          app_ref="$app_name:$PRODUCT_VERSION"
          app_digest=$(docker buildx imagetools inspect "$app_ref" | \
            awk '$1 == "Digest:" { print $2; exit }')
          app_image="$app_name@$app_digest"

          temporary_directory=$(mktemp -d)
          container=""
          cleanup() {
            test -z "$container" || docker rm --force "$container" >/dev/null 2>&1 || true
            rm -rf "$temporary_directory"
          }
          trap cleanup EXIT
          docker pull "$app_image"
          container=$(docker create "$app_image")
          docker cp "$container:/app/demo-app-manifest.json" "$temporary_directory/app.json"
          docker rm "$container" >/dev/null
          container=""

          seed_revision=$(python3 -m demo.contract manifest-field \
            --manifest "$temporary_directory/app.json" --kind app \
            --expected-product-tag "$PRODUCT_TAG" --expected-product-commit "$TARGET_SHA" \
            --field seed_revision)
          runtime_contract=$(python3 -m demo.contract manifest-field \
            --manifest "$temporary_directory/app.json" --kind app \
            --expected-product-tag "$PRODUCT_TAG" --expected-product-commit "$TARGET_SHA" \
            --field runtime_contract)
          schema_fingerprint=$(python3 -m demo.contract manifest-field \
            --manifest "$temporary_directory/app.json" --kind app \
            --expected-product-tag "$PRODUCT_TAG" --expected-product-commit "$TARGET_SHA" \
            --field schema_fingerprint)

          seed_ref="$seed_name:$PRODUCT_VERSION-seed-$seed_revision"
          seed_digest=$(docker buildx imagetools inspect "$seed_ref" | \
            awk '$1 == "Digest:" { print $2; exit }')
          seed_image="$seed_name@$seed_digest"

          python3 -m demo.contract validate-pair \
            --app-image "$app_image" \
            --seed-image "$seed_image" \
            --product-tag "$PRODUCT_TAG" \
            --product-commit "$TARGET_SHA" \
            --runtime-contract "$runtime_contract" \
            --schema-fingerprint "$schema_fingerprint" \
            --seed-revision "$seed_revision"

          for image in "$app_image" "$seed_image"; do
            gh attestation verify "oci://$image" \
              --repo "$GH_REPO" \
              --signer-workflow lxndrp/lzug/.github/workflows/demo-publish.yml \
              --bundle-from-oci \
              --predicate-type https://slsa.dev/provenance/v1
          done
          scripts/verify-demo-image-pair.sh \
            "$app_image" "$seed_image" "$PRODUCT_TAG" "$TARGET_SHA" \
            "$runtime_contract" "$schema_fingerprint" "$seed_revision"

          {
            echo "app_image=$app_image"
            echo "seed_image=$seed_image"
            echo "runtime_contract=$runtime_contract"
            echo "schema_fingerprint=$schema_fingerprint"
            echo "seed_revision=$seed_revision"
          } >> "$GITHUB_OUTPUT"
