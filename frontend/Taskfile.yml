version: '3.52'

tasks:
  test:
    desc: Run frontend unit tests
    cmds:
      - cd frontend && npm run test:ci

  quality:
    desc: Run frontend lint, build, and unit tests
    cmds:
      - cd frontend && npm run lint
      - cd frontend && npm run format:check
      - cd frontend && npm run build:ci
      - cd frontend && npm run test:coverage

  transport:
    desc: Generate transport types from FastAPI and compile the frontend against them
    cmds:
      - cd frontend && npm run build:ci

  transport:generate:
    desc: Generate the low-level TypeScript transport types from FastAPI OpenAPI
    cmds:
      - 'uv run --locked --extra dev python -m backend.fastapi_assembly --profile transport build/frontend-openapi.json'
      - 'cd frontend && LZUG_OPENAPI_INPUT=../build/frontend-openapi.json LZUG_TRANSPORT_OUTPUT=src/app/api/generated ./node_modules/.bin/openapi-ts --file openapi-ts.config.mjs --no-log-file --silent'

  security:
    desc: Run the production npm critical security gate
    cmds:
      - cd frontend && npm run security:check

  dev:
    desc: Start the frontend development server
    cmds:
      - cd frontend && npm start

  setup:
    internal: true
    cmds:
      - cd frontend && npm ci

  setup:playwright:
    internal: true
    cmds:
      - cd frontend && npx playwright install chromium firefox webkit

  e2e:
    desc: Run browser end-to-end tests
    cmds:
      - cd frontend && npm run test:e2e

  a11y:
    desc: Run browser accessibility tests
    cmds:
      - cd frontend && npm run test:a11y

  ui-review:
    desc: Run the focused Chromium, Firefox, and WebKit UI review matrix
    cmds:
      - cd frontend && npm run test:ui-review
