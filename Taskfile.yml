version: '3.52'

vars:
  UV: uv run --locked --extra dev

tasks:
  setup:
    desc: Recreate the virtual environment and install locked dependencies and Chromium
    cmds:
      - uv venv --python "$(mise which python)" --clear --seed
      - uv sync --locked --extra dev
      - task: setup:frontend
      - task: setup:playwright

  doctor:
    desc: Check the local toolchain, virtual environment, and Playwright Chromium
    cmds:
      - command -v uv >/dev/null || { echo "uv is missing; run mise install"; exit 1; }
      - uv --version
      - test "$(uv cache dir)" = "$HOME/.cache/uv" || { echo "uv cache must be $HOME/.cache/uv (configure Codex globally, not in this repository)"; exit 1; }
      - test -x .venv/bin/python || { echo ".venv/bin/python is missing; run task setup"; exit 1; }
      - .venv/bin/python --version
      - command -v node >/dev/null || { echo "Node.js is missing; run mise install"; exit 1; }
      - node --version
      - command -v npm >/dev/null || { echo "npm is missing; run mise install"; exit 1; }
      - npm --version
      - command -v go >/dev/null || { echo "Go is missing; run mise install"; exit 1; }
      - go version
      - command -v goreleaser >/dev/null || { echo "GoReleaser is missing; run mise install"; exit 1; }
      - goreleaser --version
      - >-
        cd frontend && node -e "const { chromium } = require('@playwright/test'); const { existsSync } = require('node:fs'); const executablePath = chromium.executablePath(); if (!existsSync(executablePath)) { console.error('Playwright Chromium is missing at ' + executablePath + '; run task setup'); process.exit(1); } console.log('Playwright Chromium: ' + executablePath);"

  test:
    desc: Run all backend, frontend, and operator unit tests
    cmds:
      - task: test:backend
      - task: test:frontend
      - task: test:operator

  test:backend:
    desc: Run backend unit tests
    cmds:
      - '{{.UV}} python -m unittest'

  test:frontend:
    desc: Run frontend unit tests
    dir: frontend
    cmds:
      - npm run test:ci

  test:operator:
    desc: Run Go operator CLI contract tests
    cmds:
      - go test ./cmd/lzug-admin

  docs:
    desc: Build the local handbook and generated code references
    cmds:
      - task: docs:handbook
      - task: docs:frontend

  wiki:check:
    desc: Check a separately checked-out Wiki repository, its sidebar sitemap, and source links
    cmds:
      - test -n "${WIKI_ROOT:-}" || { echo "set WIKI_ROOT to a local Wiki checkout"; exit 1; }
      - >-
        temporary_directory="$(mktemp -d)" && trap 'rm -rf "$temporary_directory"' EXIT &&
        python3 scripts/check_wiki.py "$WIKI_ROOT" --sitemap "$temporary_directory/sitemap.xml" &&
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$WIKI_ROOT:/wiki:ro" -w /wiki lycheeverse/lychee:0.24.2
        --fallback-extensions md --no-progress '*.md'

  quality:
    desc: Run the complete local quality assurance suite in parallel
    deps:
      - quality:backend
      - quality:frontend
      - quality:security
      - quality:operator
      - quality:oci
      - quality:overall
      - quality:sbom
      - docs

  quality:sbom:
    desc: Generate and validate the canonical dependency SBOM
    cmds:
      - |
        set -eu
        temporary_directory="$(mktemp -d)"
        trap 'rm -rf "$temporary_directory"' EXIT
        revision="$(git rev-parse HEAD)"
        source_version="$(python3 scripts/build_metadata.py --revision "$revision" --field identity)"
        uv sync --locked --extra dev --check
        python3 scripts/sbom.py generate-dependencies \
          --source-version "$source_version" \
          --output "$temporary_directory/lzug.dependencies.sbom.cdx.json"
        python3 scripts/sbom.py validate \
          --kind dependencies \
          --input "$temporary_directory/lzug.dependencies.sbom.cdx.json"

  quality:backend:
    desc: Run backend lint, audit, tests, and coverage
    cmds:
      - task: backend:lint
      - task: backend:format
      - task: backend:audit
      - task: backend:coverage

  quality:frontend:
    desc: Run frontend lint, build, and unit tests
    dir: frontend
    cmds:
      - npm run lint
      - npm run format:check
      - npm run build:ci
      - npm run test:coverage

  quality:security:
    desc: Run the production npm critical security gate
    dir: frontend
    cmds:
      - npm run security:check

  quality:operator:
    desc: Run Go operator CLI tests and verify reproducible GoReleaser archives
    cmds:
      - task: test:operator
      - goreleaser check
      - |
        set -eu
        test ! -e dist || { echo "root dist directory must not exist before CLI verification" >&2; exit 1; }
        temporary_directory="$(mktemp -d)"
        trap 'rm -rf dist "$temporary_directory"; rm -f .goreleaser-build-metadata.json' EXIT
        revision="$(git rev-parse HEAD)"
        application_version="$(python3 scripts/build_metadata.py --revision "$revision" --field identity)"
        for run in first second; do
          goreleaser release --snapshot --clean
          mv dist "$temporary_directory/$run"
        done
        python3 scripts/verify_cli_release.py \
          --first "$temporary_directory/first" \
          --second "$temporary_directory/second" \
          --version "$application_version" \
          --revision "$revision"

  quality:oci:
    desc: Build the local OCI quality image
    deps:
      - quality:image

  quality:overall:
    desc: Run all local cross-domain integration contracts in parallel
    deps:
      - quality:container
      - quality:compose
      - quality:operator-container
      - quality:browser

  quality:browser:
    internal: true
    cmds:
      - task: quality:e2e
      - task: quality:a11y

  quality:image:
    internal: true
    run: once
    cmds:
      - |
        set -eu
        engine="${CONTAINER_ENGINE:-}"
        if [ -z "$engine" ]; then
          if command -v docker >/dev/null 2>&1; then
            engine=docker
          elif command -v podman >/dev/null 2>&1; then
            engine=podman
          else
            echo "No Docker or Podman executable found." >&2
            exit 77
          fi
        fi
        case "$engine" in
          docker|podman) ;;
          *)
            echo "CONTAINER_ENGINE must be docker or podman." >&2
            exit 64
            ;;
        esac
        if ! command -v "$engine" >/dev/null 2>&1; then
          echo "${engine} executable is unavailable." >&2
          exit 77
        fi
        if ! "$engine" info >/dev/null 2>&1; then
          echo "${engine} is installed but its engine is unavailable." >&2
          exit 77
        fi
        revision="$(git rev-parse HEAD)"
        build_identity="$(python3 scripts/build_metadata.py --revision "$revision" --field identity)"
        "$engine" build \
          --build-arg "BUILD_IDENTITY=$build_identity" \
          --build-arg "VCS_REF=$revision" \
          -t lzug:0.0.0-dev.local .

  quality:container:
    desc: Run the packaged container runtime contract
    deps:
      - quality:image
    cmds:
      - scripts/container-smoke.sh lzug:0.0.0-dev.local

  quality:operator-container:
    desc: Run the operator CLI against the packaged application container
    deps:
      - quality:image
    cmds:
      - scripts/operator-container-smoke.sh lzug:0.0.0-dev.local

  quality:compose:
    desc: Validate the Compose runtime and persistence contract
    deps:
      - quality:image
    cmds:
      - LZUG_IMAGE=lzug:0.0.0-dev.local scripts/compose-smoke.sh

  quality:e2e:
    desc: Run browser end-to-end tests
    dir: frontend
    cmds:
      - npm run test:e2e

  quality:a11y:
    desc: Run browser accessibility tests
    dir: frontend
    cmds:
      - npm run test:a11y

  dev:
    desc: Start backend and frontend development servers in parallel
    deps:
      - dev:backend
      - dev:frontend

  backend:lint:
    internal: true
    cmds:
      - '{{.UV}} python -m ruff check .'

  backend:format:
    internal: true
    cmds:
      - '{{.UV}} python -m black --check .'

  backend:audit:
    internal: true
    cmds:
      - '{{.UV}} python -m pip_audit --skip-editable --cache-dir /tmp/lzug-pip-audit'

  backend:coverage:
    internal: true
    cmds:
      - '{{.UV}} python -m coverage run -m unittest'
      - '{{.UV}} python -m coverage report'

  docs:handbook:
    internal: true
    cmds:
      - '{{.UV}} mkdocs build --strict --site-dir site'

  docs:frontend:
    internal: true
    dir: frontend
    cmds:
      - npm run docs

  setup:frontend:
    internal: true
    dir: frontend
    cmds:
      - npm ci

  setup:playwright:
    internal: true
    dir: frontend
    cmds:
      - npx playwright install chromium

  sbom:
    desc: Generate the canonical dependency and license-review CycloneDX SBOM
    vars:
      OUTPUT: '{{default "lzug.dependencies.sbom.cdx.json" .OUTPUT}}'
    cmds:
      - |
        set -eu
        revision="$(git rev-parse HEAD)"
        source_version="$(python3 scripts/build_metadata.py --revision "$revision" --field identity)"
        uv sync --locked --extra dev --check
        python3 scripts/sbom.py generate-dependencies \
          --source-version "$source_version" \
          --output "{{.OUTPUT}}"
        python3 scripts/sbom.py validate \
          --kind dependencies \
          --input "{{.OUTPUT}}"

  sbom:image:
    desc: Generate the canonical CycloneDX SBOM for an exact local OCI image
    requires:
      vars:
        - IMAGE
    vars:
      OUTPUT: '{{default "lzug.image.sbom.cdx.json" .OUTPUT}}'
    cmds:
      - >-
        python3 scripts/sbom.py generate-image
        --image "{{.IMAGE}}"
        --output "{{.OUTPUT}}"
      - >-
        python3 scripts/sbom.py validate
        --kind image
        --input "{{.OUTPUT}}"

  sbom:cli:
    desc: Generate CycloneDX for one native CLI artifact built by the caller
    requires:
      vars:
        - ARTIFACT
        - OUTPUT
    cmds:
      - |
        set -eu
        revision="$(git rev-parse HEAD)"
        source_version="$(python3 scripts/build_metadata.py --revision "$revision" --field identity)"
        python3 scripts/sbom.py generate-cli \
          --artifact "{{.ARTIFACT}}" \
          --source-name "$(basename "{{.ARTIFACT}}")" \
          --source-version "$source_version" \
          --output "{{.OUTPUT}}"
        python3 scripts/sbom.py validate \
          --kind cli \
          --input "{{.OUTPUT}}"

  dev:backend:
    desc: Start the backend development server
    cmds:
      - '{{.UV}} python -m backend.app --init'

  dev:frontend:
    desc: Start the frontend development server
    dir: frontend
    cmds:
      - npm start
