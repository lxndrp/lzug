version: '3.52'

vars:
  UV: uv run --locked --extra dev

tasks:
  setup:
    desc: Recreate the virtual environment and install locked dependencies and Chromium
    cmds:
      - uv venv --python "$(mise which python)" --clear --seed
      - uv sync --locked --extra dev
      - task: setup:frontend
      - task: setup:playwright

  doctor:
    desc: Check the local toolchain, virtual environment, and Playwright Chromium
    cmds:
      - command -v uv >/dev/null || { echo "uv is missing; run mise install"; exit 1; }
      - uv --version
      - test "$(uv cache dir)" = "$HOME/.cache/uv" || { echo "uv cache must be $HOME/.cache/uv (configure Codex globally, not in this repository)"; exit 1; }
      - test -x .venv/bin/python || { echo ".venv/bin/python is missing; run task setup"; exit 1; }
      - .venv/bin/python --version
      - command -v node >/dev/null || { echo "Node.js is missing; run mise install"; exit 1; }
      - node --version
      - command -v npm >/dev/null || { echo "npm is missing; run mise install"; exit 1; }
      - npm --version
      - command -v go >/dev/null || { echo "Go is missing; run mise install"; exit 1; }
      - go version
      - command -v goreleaser >/dev/null || { echo "GoReleaser is missing; run mise install"; exit 1; }
      - goreleaser --version
      - >-
        cd frontend && node -e "const { chromium } = require('@playwright/test'); const { existsSync } = require('node:fs'); const executablePath = chromium.executablePath(); if (!existsSync(executablePath)) { console.error('Playwright Chromium is missing at ' + executablePath + '; run task setup'); process.exit(1); } console.log('Playwright Chromium: ' + executablePath);"

  pr:create:
    desc: Create an issue-linked pull request with the standard GitHub CLI
    requires:
      vars:
        - ISSUE
        - TITLE
        - BODY_FILE
    vars:
      ASSIGNEES: '{{default "" .ASSIGNEES}}'
      MILESTONE: '{{default "" .MILESTONE}}'
      DRAFT: '{{default "false" .DRAFT}}'
    env:
      PR_ISSUE: '{{.ISSUE}}'
      PR_TITLE: '{{.TITLE}}'
      PR_BODY_FILE: '{{.BODY_FILE}}'
      PR_ASSIGNEES: '{{.ASSIGNEES}}'
      PR_MILESTONE: '{{.MILESTONE}}'
      PR_DRAFT: '{{.DRAFT}}'
    cmds:
      - |
        set -eu
        test -f "$PR_BODY_FILE" || { echo "BODY_FILE does not exist: $PR_BODY_FILE" >&2; exit 2; }
        grep -Fqx "Closes #$PR_ISSUE" "$PR_BODY_FILE" || { echo "BODY_FILE must contain an exact 'Closes #$PR_ISSUE' line" >&2; exit 2; }
        set --
        if [ -n "$PR_ASSIGNEES" ]; then
          set -- "$@" --assignee "$PR_ASSIGNEES"
        fi
        if [ -n "$PR_MILESTONE" ]; then
          set -- "$@" --milestone "$PR_MILESTONE"
        fi
        case "$PR_DRAFT" in
          true) set -- "$@" --draft ;;
          false) ;;
          *) echo "DRAFT must be true or false" >&2; exit 2 ;;
        esac
        gh pr create \
          --base master \
          --title "$PR_TITLE" \
          --body-file "$PR_BODY_FILE" \
          --project "lzug Roadmap" \
          "$@"

  test:
    desc: Run all backend, frontend, and operator unit tests
    cmds:
      - task: test:backend
      - task: test:frontend
      - task: test:operator

  test:backend:
    desc: Run backend unit tests
    cmds:
      - '{{.UV}} python -m unittest'

  test:frontend:
    desc: Run frontend unit tests
    dir: frontend
    cmds:
      - npm run test:ci

  test:operator:
    desc: Run Go operator CLI contract tests
    cmds:
      - go test ./cmd/lzug-admin

  docs:
    desc: Build the local handbook and generated code references
    cmds:
      - task: docs:handbook
      - task: docs:frontend

  wiki:check:
    desc: Check a local Wiki checkout before manually publishing it
    cmds:
      - test -n "${WIKI_ROOT:-}" || { echo "set WIKI_ROOT to a local Wiki checkout"; exit 1; }
      - python3 scripts/check_wiki.py "$WIKI_ROOT"
      - >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$WIKI_ROOT:/wiki:ro" -w /wiki lycheeverse/lychee:0.24.2
        --fallback-extensions md --no-progress '*.md'

  quality:
    desc: Run the complete local quality assurance suite in parallel
    deps:
      - quality:backend
      - quality:frontend
      - quality:security
      - quality:operator
      - quality:oci
      - quality:overall
      - quality:sbom
      - quality:infra
      - quality:demo-deployment
      - quality:demo
      - docs

  quality:infra:
    desc: Format, validate, and mock-plan the public demo infrastructure without cloud access
    dir: infra/demo
    cmds:
      - tofu fmt -check -recursive
      - tofu init -backend=false -lockfile=readonly
      - tofu validate
      - tofu test

  quality:demo-deployment:
    desc: Validate the secret-free OIDC demo deployment and smoke-test contract
    cmds:
      - '{{.UV}} python -m unittest backend.tests.test_demo_deployment'

  quality:sbom:
    desc: Generate and validate the canonical dependency SBOM
    cmds:
      - |
        set -eu
        temporary_directory="$(mktemp -d)"
        trap 'rm -rf "$temporary_directory"' EXIT
        revision="$(git rev-parse HEAD)"
        source_version="$(python3 scripts/build_metadata.py --revision "$revision" --field identity)"
        uv sync --locked --extra dev --check
        python3 scripts/sbom.py generate-dependencies \
          --source-version "$source_version" \
          --output "$temporary_directory/lzug.dependencies.sbom.cdx.json"
        python3 scripts/sbom.py validate \
          --kind dependencies \
          --input "$temporary_directory/lzug.dependencies.sbom.cdx.json"

  quality:release:
    desc: Check the release workflow, aggregate SBOM, metadata, and GoReleaser contracts
    cmds:
      - >-
        {{.UV}} python -m unittest
        backend.tests.test_release_process
        backend.tests.test_sbom
        backend.tests.test_build_metadata
        backend.tests.test_build_identity_contract
      - goreleaser check

  quality:backend:
    desc: Run backend lint, audit, tests, and coverage
    cmds:
      - task: backend:lint
      - task: backend:format
      - task: backend:audit
      - task: backend:coverage

  quality:frontend:
    desc: Run frontend lint, build, and unit tests
    dir: frontend
    cmds:
      - npm run lint
      - npm run format:check
      - npm run build:ci
      - npm run test:coverage

  quality:security:
    desc: Run the production npm critical security gate
    dir: frontend
    cmds:
      - npm run security:check

  quality:operator:
    desc: Run Go operator CLI tests and verify reproducible GoReleaser archives
    cmds:
      - task: test:operator
      - goreleaser check
      - |
        set -eu
        test ! -e dist || { echo "root dist directory must not exist before CLI verification" >&2; exit 1; }
        temporary_directory="$(mktemp -d)"
        trap 'rm -rf dist "$temporary_directory"; rm -f .goreleaser-build-metadata.json' EXIT
        revision="$(git rev-parse HEAD)"
        application_version="$(python3 scripts/build_metadata.py --revision "$revision" --field identity)"
        for run in first second; do
          goreleaser release --snapshot --clean
          mv dist "$temporary_directory/$run"
        done
        python3 scripts/verify_cli_release.py \
          --first "$temporary_directory/first" \
          --second "$temporary_directory/second" \
          --version "$application_version" \
          --revision "$revision"

  quality:oci:
    desc: Build the local OCI quality image
    deps:
      - quality:image

  quality:demo:
    desc: Build and verify the separate demo app and seed OCI pair
    deps:
      - quality:image
    cmds:
      - |
        set -eu
        . scripts/container-contract.sh
        lzug_require_container_engine
        revision="$(git rev-parse HEAD)"
        product_tag="v0.1.1"
        build_identity="$(PRODUCT_TAG="$product_tag" PRODUCT_COMMIT="$revision" python3 -c \
          'import os; from backend.build_metadata import BuildMetadata; print(BuildMetadata.create(os.environ["PRODUCT_COMMIT"], os.environ["PRODUCT_TAG"]).identity)')"
        "$engine" build -f Dockerfile.demo-seed \
          --build-arg "PRODUCT_TAG=$product_tag" \
          --build-arg "VCS_REF=$revision" \
          -t lzug-demo-seed:0.1.1-local .
        "$engine" build -f Dockerfile.demo \
          --build-arg "BUILD_IDENTITY=$build_identity" \
          --build-arg "PRODUCT_TAG=$product_tag" \
          --build-arg "VCS_REF=$revision" \
          -t lzug-demo-app:0.1.1-local .
        scripts/demo-container-smoke.sh \
          lzug-demo-app:0.1.1-local \
          lzug-demo-seed:0.1.1-local \
          lzug:0.0.0-dev.local

  quality:overall:
    desc: Run all local cross-domain integration contracts in parallel
    deps:
      - quality:container
      - quality:compose
      - quality:operator-container
      - quality:browser

  quality:browser:
    internal: true
    cmds:
      - task: quality:e2e
      - task: quality:a11y

  quality:image:
    internal: true
    run: once
    cmds:
      - |
        set -eu
        . scripts/container-contract.sh
        lzug_require_container_engine
        revision="$(git rev-parse HEAD)"
        build_identity="$(python3 scripts/build_metadata.py --revision "$revision" --field identity)"
        "$engine" build \
          --build-arg "BUILD_IDENTITY=$build_identity" \
          --build-arg "VCS_REF=$revision" \
          -t lzug:0.0.0-dev.local .

  quality:container:
    desc: Run the packaged container runtime contract
    deps:
      - quality:image
    cmds:
      - scripts/container-smoke.sh lzug:0.0.0-dev.local

  quality:operator-container:
    desc: Run the operator CLI against the packaged application container
    deps:
      - quality:image
    cmds:
      - scripts/operator-container-smoke.sh lzug:0.0.0-dev.local

  quality:compose:
    desc: Run the Compose runtime and persistence contract
    deps:
      - quality:image
      - quality:compose-config
    cmds:
      - LZUG_IMAGE=lzug:0.0.0-dev.local scripts/compose-smoke.sh

  quality:compose-config:
    desc: Validate Compose with standard tooling and the separate lzug policy
    cmds:
      - >-
        LZUG_IMAGE=ghcr.io/lxndrp/lzug:0.0.0-dev.local
        scripts/compose-command.sh config --quiet
      - >-
        LZUG_IMAGE=ghcr.io/lxndrp/lzug:0.0.0-dev.local
        scripts/validate-compose.sh
      - '{{.UV}} python -m unittest backend.tests.test_compose_policy'

  quality:e2e:
    desc: Run browser end-to-end tests
    dir: frontend
    cmds:
      - npm run test:e2e

  quality:a11y:
    desc: Run browser accessibility tests
    dir: frontend
    cmds:
      - npm run test:a11y

  dev:
    desc: Start backend and frontend development servers in parallel
    deps:
      - dev:backend
      - dev:frontend

  backend:lint:
    internal: true
    cmds:
      - '{{.UV}} python -m ruff check .'

  backend:format:
    internal: true
    cmds:
      - '{{.UV}} python -m black --check .'

  backend:audit:
    internal: true
    cmds:
      - '{{.UV}} python -m pip_audit --skip-editable --cache-dir /tmp/lzug-pip-audit'

  backend:coverage:
    internal: true
    cmds:
      - '{{.UV}} python -m coverage run -m unittest'
      - '{{.UV}} python -m coverage report'

  docs:handbook:
    internal: true
    cmds:
      - '{{.UV}} mkdocs build --strict --site-dir site'

  docs:frontend:
    internal: true
    dir: frontend
    cmds:
      - npm run docs

  setup:frontend:
    internal: true
    dir: frontend
    cmds:
      - npm ci

  setup:playwright:
    internal: true
    dir: frontend
    cmds:
      - npx playwright install chromium

  sbom:
    desc: Generate the canonical dependency and license-review CycloneDX SBOM
    vars:
      OUTPUT: '{{default "lzug.dependencies.sbom.cdx.json" .OUTPUT}}'
    cmds:
      - |
        set -eu
        revision="$(git rev-parse HEAD)"
        source_version="$(python3 scripts/build_metadata.py --revision "$revision" --field identity)"
        uv sync --locked --extra dev --check
        python3 scripts/sbom.py generate-dependencies \
          --source-version "$source_version" \
          --output "{{.OUTPUT}}"
        python3 scripts/sbom.py validate \
          --kind dependencies \
          --input "{{.OUTPUT}}"

  sbom:image:
    desc: Generate the canonical CycloneDX SBOM for an exact local OCI image
    requires:
      vars:
        - IMAGE
    vars:
      OUTPUT: '{{default "lzug.image.sbom.cdx.json" .OUTPUT}}'
    cmds:
      - >-
        python3 scripts/sbom.py generate-image
        --image "{{.IMAGE}}"
        --output "{{.OUTPUT}}"
      - >-
        python3 scripts/sbom.py validate
        --kind image
        --input "{{.OUTPUT}}"

  sbom:cli:
    desc: Generate CycloneDX for one native CLI artifact built by the caller
    requires:
      vars:
        - ARTIFACT
        - OUTPUT
    cmds:
      - |
        set -eu
        revision="$(git rev-parse HEAD)"
        source_version="$(python3 scripts/build_metadata.py --revision "$revision" --field identity)"
        python3 scripts/sbom.py generate-cli \
          --artifact "{{.ARTIFACT}}" \
          --source-name "$(basename "{{.ARTIFACT}}")" \
          --source-version "$source_version" \
          --output "{{.OUTPUT}}"
        python3 scripts/sbom.py validate \
          --kind cli \
          --input "{{.OUTPUT}}"

  dev:backend:
    desc: Start the backend development server
    cmds:
      - '{{.UV}} python -m backend.app --init'

  dev:frontend:
    desc: Start the frontend development server
    dir: frontend
    cmds:
      - npm start
