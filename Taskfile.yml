version: "3.52"

includes:
  backend:
    taskfile: backend/Taskfile.yml
  packaging:
    taskfile: packaging/Taskfile.yml
  docs:
    taskfile: docs/Taskfile.yml
  frontend:
    taskfile: frontend/Taskfile.yml
  operator:
    taskfile: operator-cli/Taskfile.yml

vars:
  UV: uv run --locked --extra dev

env:
  PYTHONPATH: "{{.ROOT_DIR}}/packaging"

tasks:
  setup:
    desc: Install locked Python and frontend dependencies
    cmds:
      - uv sync --locked --extra dev
      - task: setup:frontend

  setup:reset:
    desc: Recreate the project-local Python and frontend dependency environments
    cmds:
      - uv venv --clear
      - task: setup

  doctor:
    desc: Check the local toolchain and virtual environment
    cmds:
      - command -v uv >/dev/null || { echo "uv is missing; run mise install"; exit 1; }
      - uv --version
      - test -x .venv/bin/python || { echo ".venv/bin/python is missing; run task setup"; exit 1; }
      - .venv/bin/python --version
      - command -v node >/dev/null || { echo "Node.js is missing; run mise install"; exit 1; }
      - node --version
      - command -v npm >/dev/null || { echo "npm is missing; run mise install"; exit 1; }
      - npm --version
      - command -v go >/dev/null || { echo "Go is missing; run mise install"; exit 1; }
      - go version
      - command -v goreleaser >/dev/null || { echo "GoReleaser is missing; run mise install"; exit 1; }
      - goreleaser --version
      - command -v actionlint >/dev/null || { echo "actionlint is missing; run mise install"; exit 1; }
      - actionlint -version
      - command -v pwsh >/dev/null || { echo "PowerShell is missing; run mise install"; exit 1; }
      - pwsh --version
      - command -v lychee >/dev/null || { echo "Lychee is missing; run mise install"; exit 1; }
      - lychee --version

  doctor:playwright:
    desc: Check the installed Playwright browser executables
    cmds:
      - >-
        cd frontend && node -e "const { chromium, firefox, webkit } = require('@playwright/test'); const { existsSync } = require('node:fs'); for (const [name, browser] of Object.entries({ chromium, firefox, webkit })) { const executablePath = browser.executablePath(); if (!existsSync(executablePath)) { console.error('Playwright ' + name + ' is missing at ' + executablePath + '; run task setup:playwright'); process.exit(1); } console.log('Playwright ' + name + ': ' + executablePath); }"

  pr:create:
    desc: Create an issue-linked pull request with the standard GitHub CLI
    requires:
      vars:
        - ISSUE
        - TITLE
        - BODY_FILE
    vars:
      ASSIGNEES: '{{default "" .ASSIGNEES}}'
      MILESTONE: '{{default "" .MILESTONE}}'
      DRAFT: '{{default "false" .DRAFT}}'
      LINK_MODE: '{{default "closes" .LINK_MODE}}'
    env:
      PR_ISSUE: "{{.ISSUE}}"
      PR_TITLE: "{{.TITLE}}"
      PR_BODY_FILE: "{{.BODY_FILE}}"
      PR_ASSIGNEES: "{{.ASSIGNEES}}"
      PR_MILESTONE: "{{.MILESTONE}}"
      PR_DRAFT: "{{.DRAFT}}"
      PR_LINK_MODE: "{{.LINK_MODE}}"
    cmds:
      - |
        set -eu
        test -f "$PR_BODY_FILE" || { echo "BODY_FILE does not exist: $PR_BODY_FILE" >&2; exit 2; }
        case "$PR_LINK_MODE" in
          closes) link_line="Closes #$PR_ISSUE" ;;
          tracks) link_line="Tracks #$PR_ISSUE" ;;
          *) echo "LINK_MODE must be closes or tracks" >&2; exit 2 ;;
        esac
        grep -Fqx "$link_line" "$PR_BODY_FILE" || { echo "BODY_FILE must contain an exact '$link_line' line" >&2; exit 2; }
        set --
        if [ -n "$PR_ASSIGNEES" ]; then
          set -- "$@" --assignee "$PR_ASSIGNEES"
        fi
        if [ -n "$PR_MILESTONE" ]; then
          set -- "$@" --milestone "$PR_MILESTONE"
        fi
        case "$PR_DRAFT" in
          true) set -- "$@" --draft ;;
          false) ;;
          *) echo "DRAFT must be true or false" >&2; exit 2 ;;
        esac
        gh pr create \
          --base master \
          --title "$PR_TITLE" \
          --body-file "$PR_BODY_FILE" \
          --project "lzug Roadmap" \
          "$@"

  test:
    desc: Run all component unit and contract tests
    cmds:
      - task: test:backend
      - task: test:frontend
      - task: test:operator
      - task: test:demo
      - task: test:delivery
      - task: test:docs
      - task: test:oci
      - task: test:tooling

  test:backend:
    desc: Run all backend test tiers
    cmds:
      - task: backend:test

  test:frontend:
    desc: Run frontend unit tests
    cmds:
      - task: frontend:test

  test:operator:
    desc: Run Go operator CLI contract tests
    cmds:
      - task: operator:test

  test:demo:
    desc: Run public demo component tests
    cmds:
      - task: packaging:demo:test

  test:delivery:
    desc: Run delivery and workflow contract tests
    cmds:
      - task: packaging:test

  test:docs:
    desc: Run documentation and publication tests
    cmds:
      - task: docs:test

  test:oci:
    desc: Run OCI and Compose Pester contracts
    cmds:
      - task: packaging:oci

  test:tooling:
    desc: Run repository tooling tests
    cmds:
      - task: packaging:tooling

  docs:
    desc: Build the local technical reference and generated code references
    cmds:
      - task: docs:build

  quality:
    desc: Run the complete local quality assurance suite in parallel
    deps:
      - brand:check
      - quality:backend
      - quality:frontend
      - quality:security
      - quality:operator
      - quality:operator-packaging-and-reproducibility
      - test:delivery
      - test:demo
      - test:oci
      - test:tooling
      - quality:oci
      - quality:overall
      - quality:infra
      - quality:demo
      - docs
      - quality:workflows

  quality:ubuntu:
    desc: Run the full task quality suite in an isolated Ubuntu 24.04 container
    vars:
      PLAYWRIGHT_VERSION:
        sh: node -e "console.log(require('./frontend/package-lock.json').packages['node_modules/@playwright/test'].version)"
      MISE_VERSION:
        sh: mise --version | cut -d ' ' -f 1
      DOCKER_CLI_VERSION:
        sh: docker --version | cut -d ' ' -f 3 | tr -d ','
    cmds:
      - |
        set -eu
        command -v docker >/dev/null 2>&1 || { echo "Docker is required for task quality:ubuntu." >&2; exit 1; }
        docker info >/dev/null 2>&1 || { echo "Docker Engine is unavailable; start the configured Docker host and retry." >&2; exit 1; }
        test -S /var/run/docker.sock || { echo "The local Docker socket is unavailable at /var/run/docker.sock." >&2; exit 1; }

        worktree_root=$(pwd -P)
        git_common_dir=$(git rev-parse --path-format=absolute --git-common-dir)
        runner_fingerprint=$(
          {
            cat Taskfile.yml \
              development/ubuntu-quality/Dockerfile \
              development/ubuntu-quality/seccomp-profile.json
            printf '%s\n' "{{.PLAYWRIGHT_VERSION}}" "{{.MISE_VERSION}}" "{{.DOCKER_CLI_VERSION}}"
          } | git hash-object --stdin
        )
        resource_scope=${LZUG_DEVELOPMENT_RESOURCE_SCOPE:-}
        resource_label=
        if [ -n "$resource_scope" ]; then
          case "$resource_scope" in
            *[!a-z0-9-]*) echo "Invalid LZUG_DEVELOPMENT_RESOURCE_SCOPE: $resource_scope" >&2; exit 1 ;;
          esac
          resource_label="lzug-codex-$resource_scope"
          resource_prefix="lzug-codex-$resource_scope-ubuntu-quality"
          persistent_resources=true
        else
          resource_prefix="lzug-ubuntu-quality-$$"
          persistent_resources=false
        fi

        image="$resource_prefix:$runner_fingerprint"
        container="$resource_prefix-run"
        cache_names="mise-data mise-cache uv-cache npm-cache go-mod go-build venv frontend-node-modules"
        created_volumes=
        cleanup() {
          docker rm -f "$container" >/dev/null 2>&1 || true
          if [ "$persistent_resources" = false ]; then
            for cache_name in $created_volumes; do
              docker volume rm "$resource_prefix-$cache_name" >/dev/null 2>&1 || true
            done
            docker image rm "$image" >/dev/null 2>&1 || true
          fi
        }
        trap cleanup EXIT

        set --
        if [ -n "$resource_label" ]; then
          set -- "$@" --label "$resource_label"
        fi
        docker build \
          --pull \
          --build-arg "PLAYWRIGHT_VERSION={{.PLAYWRIGHT_VERSION}}" \
          --build-arg "MISE_VERSION={{.MISE_VERSION}}" \
          --build-arg "DOCKER_CLI_VERSION={{.DOCKER_CLI_VERSION}}" \
          "$@" \
          --tag "$image" \
          --file development/ubuntu-quality/Dockerfile \
          .

        for cache_name in $cache_names; do
          volume="$resource_prefix-$cache_name"
          if [ -n "$resource_label" ]; then
            docker volume create --name "$volume" --label "$resource_label" >/dev/null
          else
            docker volume create --name "$volume" >/dev/null
          fi
          created_volumes="$created_volumes $cache_name"
          docker run --rm --user 0:0 --mount "type=volume,source=$volume,target=/cache" --entrypoint /bin/chown "$image" 1001:1001 /cache
        done

        socket_gid=$(docker run --rm --mount type=bind,source=/var/run/docker.sock,target=/var/run/docker.sock --entrypoint stat "$image" -c %g /var/run/docker.sock)
        docker run --rm --user 1001:1001 --group-add "$socket_gid" --mount type=bind,source=/var/run/docker.sock,target=/var/run/docker.sock --entrypoint docker "$image" info >/dev/null

        set -- --rm --name "$container" --init --shm-size=1g --user 1001:1001 --group-add "$socket_gid" \
          --security-opt "seccomp=$worktree_root/development/ubuntu-quality/seccomp-profile.json"
        if [ -n "$resource_label" ]; then
          set -- "$@" --label "$resource_label"
        fi
        set -- "$@" \
          --mount "type=bind,source=$worktree_root,target=$worktree_root" \
          --mount "type=bind,source=$git_common_dir,target=$git_common_dir,readonly" \
          --mount type=bind,source=/var/run/docker.sock,target=/var/run/docker.sock \
          --mount "type=volume,source=$resource_prefix-mise-data,target=/home/pwuser/.local/share/mise,volume-nocopy" \
          --mount "type=volume,source=$resource_prefix-mise-cache,target=/home/pwuser/.cache/mise,volume-nocopy" \
          --mount "type=volume,source=$resource_prefix-uv-cache,target=/home/pwuser/.cache/uv,volume-nocopy" \
          --mount "type=volume,source=$resource_prefix-npm-cache,target=/home/pwuser/.cache/npm,volume-nocopy" \
          --mount "type=volume,source=$resource_prefix-go-mod,target=/home/pwuser/go/pkg/mod,volume-nocopy" \
          --mount "type=volume,source=$resource_prefix-go-build,target=/home/pwuser/.cache/go-build,volume-nocopy" \
          --mount "type=volume,source=$resource_prefix-venv,target=$worktree_root/.venv,volume-nocopy" \
          --mount "type=volume,source=$resource_prefix-frontend-node-modules,target=$worktree_root/frontend/node_modules,volume-nocopy" \
          --workdir "$worktree_root" \
          --env LZUG_DEVELOPMENT_RESOURCE_SCOPE \
          --env CI=true \
          --env DOCKER_BUILDKIT=1 \
          --env DOCKER_HOST=unix:///var/run/docker.sock \
          --env GIT_OPTIONAL_LOCKS=0 \
          "$image" /bin/sh -eu -c '
            git config --global --add safe.directory "$PWD"
            mise install
            mise exec -- task setup
            mise exec -- task doctor
            mise exec -- task doctor:playwright
            mise exec -- task --concurrency=4 quality
          '
        docker run "$@"

  brand:check:
    desc: Verify canonical brand sources, consumer derivatives, fonts, and icons
    cmds:
      - node brand/generate-assets.mjs --check

  brand:generate:
    desc: Generate reproducible brand derivatives from canonical vector sources
    cmds:
      - node brand/generate-assets.mjs

  quality:infra:
    desc: Format, validate, and mock-plan the public demo infrastructure without cloud access
    dir: deployment/demo/infra
    cmds:
      - tofu fmt -check -recursive
      - tofu init -backend=false -lockfile=readonly
      - tofu validate
      - tofu test

  quality:demo-deployment:
    desc: Validate release and snapshot demo promotion, OIDC deployment, and smoke contracts
    cmds:
      - task: packaging:demo:delivery

  quality:release:
    desc: Check the release workflow, metadata, and GoReleaser contracts
    cmds:
      - >-
        {{.UV}} python -m unittest
        tests.delivery.test_release_process
        tests.delivery.test_build_metadata
        tests.delivery.test_build_identity_contract
      - cd operator-cli && goreleaser check

  quality:workflows:
    desc: Validate all GitHub Actions workflows with actionlint
    cmds:
      - actionlint

  quality:backend:
    desc: Run backend lint, audit, tests, and coverage
    cmds:
      - task: backend:quality

  quality:backend:pr:
    desc: Run pull-request backend quality without coverage
    cmds:
      - task: backend:quality:pr

  quality:backend:integration:
    desc: Run backend and operator admin-socket integration contracts
    cmds:
      - task: backend:integration

  quality:frontend:
    desc: Run frontend lint, build, and unit tests
    cmds:
      - task: frontend:quality

  quality:security:
    desc: Run Python and production npm dependency security audits
    cmds:
      - task: backend:audit
      - task: frontend:security

  quality:operator:
    desc: Run Go operator CLI tests, vet, and packaging configuration validation
    cmds:
      - task: operator:quality

  quality:operator-packaging:
    desc: Build CLI release artifacts twice and verify manifest-selected outputs
    cmds:
      - task: operator:packaging-and-reproducibility

  quality:operator-packaging-and-reproducibility:
    desc: Verify the CLI packaging contract and reproducibility with two clean builds
    cmds:
      - task: operator:packaging-and-reproducibility

  quality:operator-reproducibility:
    desc: Verify byte-stable CLI archives and binaries across two clean builds
    cmds:
      - task: operator:packaging-and-reproducibility

  quality:oci:
    desc: Build the local OCI quality image
    deps:
      - quality:image

  quality:demo:
    desc: Build and verify the separate demo app and seed OCI pair
    cmds:
      - task: packaging:demo:quality

  quality:demo-matrix:
    desc: Verify demo roles, capabilities, mutation allowlist, and default-deny paths
    cmds:
      - task: packaging:demo:matrix

  quality:overall:
    desc: Run all local cross-domain integration contracts in parallel
    deps:
      - quality:pester
      - quality:browser

  quality:pester:
    desc: Build once and run the pinned real runtime contracts once
    run: once
    deps:
      - quality:image
    cmds:
      - pwsh -NoProfile -File scripts/run-pester.ps1

  quality:browser:
    internal: true
    cmds:
      - task: quality:e2e
      - task: quality:a11y
      - task: quality:ui-review

  quality:image:
    internal: true
    run: once
    cmds:
      - task: packaging:product:quality:image

  quality:container:
    desc: Run the packaged image and runtime integration smoke
    deps:
      - quality:image
    cmds:
      - pwsh -NoProfile -File scripts/run-pester.ps1 -TestFile Container.Tests.ps1

  quality:operator-container:
    desc: Run the built operator CLI PTY contract through the product runtime
    deps:
      - quality:image
    cmds:
      - pwsh -NoProfile -File scripts/run-pester.ps1 -TestFile Operator.Tests.ps1

  quality:compose:
    desc: Run the supported Compose image and runtime smoke
    cmds:
      - task: quality:container

  quality:compose-config:
    desc: Validate Compose configuration with standard tooling
    cmds:
      - docker compose --project-directory "{{.ROOT_DIR}}" --env-file deployment/self-hosted/.env.example -f deployment/self-hosted/compose.yaml config -q

  quality:e2e:
    desc: Run browser end-to-end tests
    deps:
      - frontend:production-build
    cmds:
      - task: frontend:e2e:development
      - task: frontend:e2e:production

  quality:a11y:
    desc: Run browser accessibility tests
    cmds:
      - task: frontend:a11y

  quality:ui-review:
    desc: Run the focused Chromium, Firefox, and WebKit UI review matrix
    cmds:
      - task: frontend:ui-review

  dev:
    desc: Start backend and frontend development servers in parallel
    deps:
      - dev:backend
      - dev:frontend

  setup:frontend:
    internal: true
    cmds:
      - task: frontend:setup

  setup:playwright:
    desc: Install the Playwright Chromium, Firefox, and WebKit browsers
    cmds:
      - task: frontend:setup:playwright

  dev:backend:
    desc: Start the backend development server
    cmds:
      - task: backend:dev

  dev:frontend:
    desc: Start the frontend development server
    cmds:
      - task: frontend:dev
