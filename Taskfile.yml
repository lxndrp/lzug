version: "3.52"

includes:
  backend:
    taskfile: backend/Taskfile.yml
  delivery:
    taskfile: delivery/Taskfile.yml
  demo:
    taskfile: demo/Taskfile.yml
  docs:
    taskfile: docs/Taskfile.yml
  frontend:
    taskfile: frontend/Taskfile.yml
  operator:
    taskfile: operator-cli/Taskfile.yml

vars:
  UV: uv run --locked --extra dev

tasks:
  setup:
    desc: Recreate the virtual environment and install locked dependencies and Chromium
    cmds:
      - uv venv --python "$(mise which python)" --clear --seed
      - uv sync --locked --extra dev
      - task: setup:frontend
      - task: setup:playwright

  doctor:
    desc: Check the local toolchain, virtual environment, and Playwright Chromium
    cmds:
      - command -v uv >/dev/null || { echo "uv is missing; run mise install"; exit 1; }
      - uv --version
      - test "$(uv cache dir)" = "$HOME/.cache/uv" || { echo "uv cache must be $HOME/.cache/uv (configure Codex globally, not in this repository)"; exit 1; }
      - test -x .venv/bin/python || { echo ".venv/bin/python is missing; run task setup"; exit 1; }
      - .venv/bin/python --version
      - command -v node >/dev/null || { echo "Node.js is missing; run mise install"; exit 1; }
      - node --version
      - command -v npm >/dev/null || { echo "npm is missing; run mise install"; exit 1; }
      - npm --version
      - command -v go >/dev/null || { echo "Go is missing; run mise install"; exit 1; }
      - go version
      - command -v goreleaser >/dev/null || { echo "GoReleaser is missing; run mise install"; exit 1; }
      - goreleaser --version
      - command -v lychee >/dev/null || { echo "Lychee is missing; run mise install"; exit 1; }
      - lychee --version
      - >-
        cd frontend && node -e "const { chromium } = require('@playwright/test'); const { existsSync } = require('node:fs'); const executablePath = chromium.executablePath(); if (!existsSync(executablePath)) { console.error('Playwright Chromium is missing at ' + executablePath + '; run task setup'); process.exit(1); } console.log('Playwright Chromium: ' + executablePath);"

  pr:create:
    desc: Create an issue-linked pull request with the standard GitHub CLI
    requires:
      vars:
        - ISSUE
        - TITLE
        - BODY_FILE
    vars:
      ASSIGNEES: '{{default "" .ASSIGNEES}}'
      MILESTONE: '{{default "" .MILESTONE}}'
      DRAFT: '{{default "false" .DRAFT}}'
      LINK_MODE: '{{default "closes" .LINK_MODE}}'
    env:
      PR_ISSUE: "{{.ISSUE}}"
      PR_TITLE: "{{.TITLE}}"
      PR_BODY_FILE: "{{.BODY_FILE}}"
      PR_ASSIGNEES: "{{.ASSIGNEES}}"
      PR_MILESTONE: "{{.MILESTONE}}"
      PR_DRAFT: "{{.DRAFT}}"
      PR_LINK_MODE: "{{.LINK_MODE}}"
    cmds:
      - |
        set -eu
        test -f "$PR_BODY_FILE" || { echo "BODY_FILE does not exist: $PR_BODY_FILE" >&2; exit 2; }
        case "$PR_LINK_MODE" in
          closes) link_line="Closes #$PR_ISSUE" ;;
          tracks) link_line="Tracks #$PR_ISSUE" ;;
          *) echo "LINK_MODE must be closes or tracks" >&2; exit 2 ;;
        esac
        grep -Fqx "$link_line" "$PR_BODY_FILE" || { echo "BODY_FILE must contain an exact '$link_line' line" >&2; exit 2; }
        set --
        if [ -n "$PR_ASSIGNEES" ]; then
          set -- "$@" --assignee "$PR_ASSIGNEES"
        fi
        if [ -n "$PR_MILESTONE" ]; then
          set -- "$@" --milestone "$PR_MILESTONE"
        fi
        case "$PR_DRAFT" in
          true) set -- "$@" --draft ;;
          false) ;;
          *) echo "DRAFT must be true or false" >&2; exit 2 ;;
        esac
        gh pr create \
          --base master \
          --title "$PR_TITLE" \
          --body-file "$PR_BODY_FILE" \
          --project "lzug Roadmap" \
          "$@"

  test:
    desc: Run all component unit and contract tests
    cmds:
      - task: test:backend
      - task: test:frontend
      - task: test:operator
      - task: test:demo
      - task: test:delivery
      - task: test:docs
      - task: test:fixtures
      - task: test:oci
      - task: test:tooling

  test:backend:
    desc: Run backend unit tests
    cmds:
      - task: backend:test

  test:frontend:
    desc: Run frontend unit tests
    cmds:
      - task: frontend:test

  test:operator:
    desc: Run Go operator CLI contract tests
    cmds:
      - task: operator:test

  test:demo:
    desc: Run public demo component tests
    cmds:
      - task: demo:test

  test:delivery:
    desc: Run delivery and workflow contract tests
    cmds:
      - task: delivery:test

  test:docs:
    desc: Run documentation and publication tests
    cmds:
      - task: docs:test

  test:fixtures:
    desc: Run synthetic fixture tests
    cmds:
      - task: delivery:fixtures

  test:oci:
    desc: Run OCI and Compose tests
    cmds:
      - task: delivery:oci

  test:tooling:
    desc: Run repository tooling tests
    cmds:
      - task: delivery:tooling

  docs:
    desc: Build the local technical reference and generated code references
    cmds:
      - task: docs:build

  docs:publication:
    desc: Build the complete static GitHub Pages artifact without deploying it
    deps:
      - docs:check
    vars:
      OUTPUT: '{{default "build/publication" .OUTPUT}}'
      DEMO_URL: '{{default "https://demo.example.invalid" .DEMO_URL}}'
      BASE_URL: '{{default "https://lzug.repertoire.papaspyrou.name" .BASE_URL}}'
    cmds:
      - >-
        output="{{.OUTPUT}}"; case "$output" in /*) ;; *) output="$PWD/$output";; esac;
        SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
        HUGO_PARAMS_DEMOURL="{{.DEMO_URL}}"
        HUGO_PARAMS_REPOSITORYREVISION="$(git rev-parse HEAD)"
        hugo --source docs/publication --destination "$output"
        --minify --gc --baseURL "{{.BASE_URL}}/"
      - >-
        output="{{.OUTPUT}}"; case "$output" in /*) ;; *) output="$PWD/$output";; esac;
        mkdir -p "$output/referenz/api" "$output/referenz/frontend"
        && {{.UV}} python scripts/export_openapi.py "$output/referenz/api/openapi.json"
        && cd frontend && node_modules/.bin/typedoc
        --treatWarningsAsErrors --entryPointStrategy expand
        --entryPoints src/app --out "$output/referenz/frontend"
      - >-
        output="{{.OUTPUT}}"; case "$output" in /*) ;; *) output="$PWD/$output";; esac;
        touch "$output/.nojekyll"

  docs:publication:check:
    desc: Verify that the configured public site builds byte-identically
    deps:
      - docs:check
    vars:
      DEMO_URL: '{{default "https://demo.example.invalid" .DEMO_URL}}'
      BASE_URL: '{{default "https://lzug.repertoire.papaspyrou.name" .BASE_URL}}'
    cmds:
      - |
        set -eu
        first="$(mktemp -d)"
        second="$(mktemp -d)"
        trap 'rm -rf "$first" "$second"' EXIT
        task docs:publication OUTPUT="$first" DEMO_URL="{{.DEMO_URL}}" BASE_URL="{{.BASE_URL}}"
        task docs:publication OUTPUT="$second" DEMO_URL="{{.DEMO_URL}}" BASE_URL="{{.BASE_URL}}"
        git diff --no-index --exit-code -- "$first" "$second"
        echo "Publication artifact is reproducible"

  docs:publication:linkcheck:
    desc: Check every link and fragment in the generated public site
    deps:
      - docs:publication
    vars:
      OUTPUT: '{{default "build/publication" .OUTPUT}}'
    cmds:
      - |
        set -eu
        output="{{.OUTPUT}}"
        case "$output" in
          /*) root_dir="$output" ;;
          *) root_dir="$PWD/$output" ;;
        esac
        lychee --config .lychee.toml --root-dir "$root_dir" "$output"

  docs:publication:browser:
    desc: Check the production landing flow on desktop and mobile with Playwright
    deps:
      - docs:publication
    cmds:
      - npm --prefix frontend run test:publication

  docs:publication:a11y:
    desc: Check the production landing page with Playwright and axe
    deps:
      - docs:publication
    cmds:
      - npm --prefix frontend run test:publication:a11y

  docs:media:capture:
    desc: Recreate the reviewed synthetic demo screenshots from their canonical scenario
    dir: frontend
    env:
      LZUG_CAPTURE_DEMO_MEDIA: "true"
      LZUG_E2E_RUN_ID: demo-media-v8
    cmds:
      - node e2e/run-playwright.mjs demo-workflows.spec.ts --grep "keeps isolated demo scenarios"

  quality:
    desc: Run the complete local quality assurance suite in parallel
    deps:
      - fixtures:check
      - brand:check
      - quality:backend
      - quality:frontend-transport
      - quality:frontend
      - quality:security
      - quality:operator
      - quality:operator-packaging
      - test:delivery
      - test:demo
      - test:fixtures
      - test:oci
      - test:tooling
      - quality:oci
      - quality:overall
      - quality:sbom
      - quality:infra
      - quality:demo
      - docs

  brand:check:
    desc: Verify canonical brand sources, consumer derivatives, fonts, and icons
    cmds:
      - node brand/generate-assets.mjs --check

  brand:generate:
    desc: Generate reproducible brand derivatives from canonical vector sources
    cmds:
      - node brand/generate-assets.mjs

  fixtures:check:
    desc: Compile synthetic fixture profiles and verify tracked adapters
    cmds:
      - python3 fixtures/generate.py --check

  quality:infra:
    desc: Format, validate, and mock-plan the public demo infrastructure without cloud access
    dir: demo/infra
    cmds:
      - tofu fmt -check -recursive
      - tofu init -backend=false -lockfile=readonly
      - tofu validate
      - tofu test

  quality:demo-deployment:
    desc: Validate release and snapshot demo promotion, OIDC deployment, and smoke contracts
    cmds:
      - task: demo:delivery

  quality:sbom:
    desc: Generate and validate the dependency SBOM once
    cmds:
      - task: sbom
        vars:
          OUTPUT: build/quality/lzug.dependencies.sbom.cdx.json

  quality:release:
    desc: Check the release workflow, aggregate SBOM, metadata, and GoReleaser contracts
    cmds:
      - >-
        {{.UV}} python -m unittest
        tests.delivery.test_release_process
        tests.delivery.test_sbom
        tests.delivery.test_build_metadata
        tests.delivery.test_build_identity_contract
      - cd operator-cli && goreleaser check

  quality:backend:
    desc: Run backend lint, audit, tests, and coverage
    cmds:
      - task: backend:quality

  quality:backend:pr:
    desc: Run pull-request backend quality without coverage
    cmds:
      - task: backend:quality:pr

  quality:frontend:
    desc: Run frontend lint, build, and unit tests
    cmds:
      - task: frontend:quality

  quality:frontend-transport:
    desc: Verify TypeScript transport types against the canonical FastAPI OpenAPI document
    cmds:
      - task: frontend:transport

  quality:security:
    desc: Run the production npm critical security gate
    cmds:
      - task: frontend:security

  quality:operator:
    desc: Run Go operator CLI tests, vet, and packaging configuration validation
    cmds:
      - task: operator:quality

  quality:operator-packaging:
    desc: Verify reproducible CLI archives and their native binary SBOM
    dir: operator-cli
    cmds:
      - |
        set -eu
        test ! -e dist || { echo "operator-cli dist directory must not exist before CLI verification" >&2; exit 1; }
        temporary_directory="$(mktemp -d)"
        trap 'rm -rf dist "$temporary_directory"; rm -f .goreleaser-build-metadata.json .goreleaser-license .goreleaser-third-party-notices.md' EXIT
        revision="$(git rev-parse HEAD)"
        application_version="$(python3 ../scripts/build_metadata.py --revision "$revision" --field identity)"
        for run in first second; do
          goreleaser release --snapshot --clean
          mv dist "$temporary_directory/$run"
        done
        python3 ../scripts/verify_cli_release.py \
          --first "$temporary_directory/first" \
          --second "$temporary_directory/second" \
          --version "$application_version" \
          --revision "$revision"
        artifact=$(python3 -c 'import json; from pathlib import Path; p=Path(__import__("sys").argv[1]); print(next(p / a["path"].removeprefix("dist/") for a in json.loads((p / "artifacts.json").read_text()) if a["type"] == "Binary"))' "$temporary_directory/first")
        python3 ../scripts/sbom.py generate-cli --artifact "$artifact" \
          --source-name lzug-admin --source-version "$application_version" \
          --output "$temporary_directory/cli.cdx.json"

  quality:oci:
    desc: Build the local OCI quality image
    deps:
      - quality:image

  quality:demo:
    desc: Build and verify the separate demo app and seed OCI pair
    deps:
      - quality:image
    cmds:
      - |
        set -eu
        . scripts/container-contract.sh
        lzug_require_docker
        revision="$(git rev-parse HEAD)"
        short_revision="$(echo "$revision" | cut -c1-7)"
        temporary_directory="$(mktemp -d)"
        seed_container=""
        cleanup() {
          if [ -n "$seed_container" ]; then
            docker rm --force "$seed_container" >/dev/null 2>&1 || true
          fi
          rm -rf "$temporary_directory"
        }
        trap cleanup EXIT
        product_tag="snapshot/v0.2.0-SNAPSHOT.$short_revision"
        build_identity=$(python3 -m demo.delivery.contract identity \
          --tag "$product_tag" --commit "$revision" --channel snapshot --field identity)
        seed_image="lzug-demo-seed:local"
        app_image="lzug-demo-app:local"
        docker build -f demo/containers/Dockerfile.demo-seed \
          --build-arg "PRODUCT_TAG=$product_tag" \
          --build-arg "VCS_REF=$revision" \
          -t "$seed_image" .
        seed_container=$(docker create "$seed_image")
        docker cp \
          "$seed_container:/opt/lzug-demo/seed/lzug.sqlite" \
          "$temporary_directory/lzug.sqlite"
        docker cp \
          "$seed_container:/opt/lzug-demo/seed/manifest.json" \
          "$temporary_directory/manifest.json"
        docker rm "$seed_container" >/dev/null
        seed_container=""
        expected_schema_fingerprint=$(python3 -c \
          'from pathlib import Path; from demo.delivery.artifacts import schema_binding; print(schema_binding(Path("."))["fingerprint"])')
        python3 -m demo.delivery.artifacts verify-seed \
          --database "$temporary_directory/lzug.sqlite" \
          --manifest "$temporary_directory/manifest.json" \
          --expected-product-tag "$product_tag" \
          --expected-product-commit "$revision" \
          --expected-schema-fingerprint "$expected_schema_fingerprint"
        seed_revision=$(python3 -m demo.delivery.contract manifest-field \
          --manifest "$temporary_directory/manifest.json" --kind seed \
          --expected-product-tag "$product_tag" --expected-product-commit "$revision" \
          --field seed_revision)
        docker build -f demo/containers/Dockerfile.demo \
          --build-arg "BUILD_IDENTITY=$build_identity" \
          --build-arg "PRODUCT_TAG=$product_tag" \
          --build-arg "VCS_REF=$revision" \
          --build-arg "SEED_REVISION=$seed_revision" \
          -t "$app_image" .
        scripts/demo-container-smoke.sh \
          "$app_image" \
          "$seed_image" \
          lzug-app:0.0.0-dev.local \
          "$seed_revision"

  quality:demo-matrix:
    desc: Verify demo roles, capabilities, mutation allowlist, and default-deny paths
    cmds:
      - task: demo:matrix

  quality:overall:
    desc: Run all local cross-domain integration contracts in parallel
    deps:
      - quality:container
      - quality:compose
      - quality:operator-container
      - quality:browser

  quality:browser:
    internal: true
    cmds:
      - task: quality:e2e
      - task: quality:a11y
      - task: quality:ui-review

  quality:image:
    internal: true
    run: once
    cmds:
      - |
        set -eu
        . scripts/container-contract.sh
        lzug_require_docker
        revision="$(git rev-parse HEAD)"
        build_identity="$(python3 scripts/build_metadata.py --revision "$revision" --field identity)"
        docker build \
          --build-arg "BUILD_IDENTITY=$build_identity" \
          --build-arg "VCS_REF=$revision" \
          -t lzug-app:0.0.0-dev.local .
      - task: sbom:image
        vars:
          IMAGE: lzug-app:0.0.0-dev.local
          OUTPUT: build/quality/lzug.image.sbom.cdx.json

  quality:container:
    desc: Run the packaged container runtime contract
    deps:
      - quality:image
    cmds:
      - scripts/container-smoke.sh lzug-app:0.0.0-dev.local

  quality:operator-container:
    desc: Run the operator CLI against the packaged application container
    deps:
      - quality:image
    cmds:
      - scripts/operator-container-smoke.sh lzug-app:0.0.0-dev.local
      - tests/compatibility/v060-age-migration-smoke.sh lzug-app:0.0.0-dev.local

  quality:compose:
    desc: Run the Compose runtime and persistence contract
    deps:
      - quality:image
      - quality:compose-config
    cmds:
      - LZUG_IMAGE=lzug-app:0.0.0-dev.local scripts/compose-smoke.sh

  quality:compose-config:
    desc: Validate Compose with standard tooling and the separate lzug policy
    cmds:
      - |
        set -eu
        . scripts/container-contract.sh
        lzug_require_docker
        LZUG_IMAGE=ghcr.io/lxndrp/lzug-app:0.0.0-dev.local \
          docker compose -f compose.yaml config --quiet
      - |
        set -eu
        . scripts/container-contract.sh
        lzug_require_docker
        config_file="$(mktemp "${TMPDIR:-/tmp}/lzug-compose-config.XXXXXX")"
        trap 'rm -f "$config_file"' EXIT
        LZUG_IMAGE=ghcr.io/lxndrp/lzug-app:0.0.0-dev.local \
          docker compose -f compose.yaml config --format json >"$config_file"
        python3 scripts/compose_policy.py "$config_file"
      - "{{.UV}} python -m unittest tests.oci.test_compose_policy"

  quality:e2e:
    desc: Run browser end-to-end tests
    cmds:
      - task: frontend:e2e

  quality:a11y:
    desc: Run browser accessibility tests
    cmds:
      - task: frontend:a11y

  quality:ui-review:
    desc: Run the focused Chromium, Firefox, and WebKit UI review matrix
    cmds:
      - task: frontend:ui-review

  dev:
    desc: Start backend and frontend development servers in parallel
    deps:
      - dev:backend
      - dev:frontend

  setup:frontend:
    internal: true
    cmds:
      - task: frontend:setup

  setup:playwright:
    internal: true
    cmds:
      - task: frontend:setup:playwright

  sbom:
    desc: Generate the canonical dependency and license-review CycloneDX SBOM
    vars:
      OUTPUT: '{{default "lzug.dependencies.sbom.cdx.json" .OUTPUT}}'
    cmds:
      - |
        set -eu
        revision="$(git rev-parse HEAD)"
        source_version="$(python3 scripts/build_metadata.py --revision "$revision" --field identity)"
        uv sync --locked --extra dev --check
        python3 scripts/sbom.py generate-dependencies \
          --source-version "$source_version" \
          --output "{{.OUTPUT}}"
        python3 scripts/sbom.py validate \
          --kind dependencies \
          --input "{{.OUTPUT}}"

  sbom:image:
    desc: Generate the canonical CycloneDX SBOM for an exact local OCI image
    requires:
      vars:
        - IMAGE
    vars:
      OUTPUT: '{{default "lzug.image.sbom.cdx.json" .OUTPUT}}'
    cmds:
      - >-
        python3 scripts/sbom.py generate-image
        --image "{{.IMAGE}}"
        --output "{{.OUTPUT}}"
      - >-
        python3 scripts/sbom.py validate
        --kind image
        --input "{{.OUTPUT}}"

  sbom:cli:
    desc: Generate CycloneDX for one native CLI artifact built by the caller
    requires:
      vars:
        - ARTIFACT
        - OUTPUT
    cmds:
      - |
        set -eu
        revision="$(git rev-parse HEAD)"
        source_version="$(python3 scripts/build_metadata.py --revision "$revision" --field identity)"
        python3 scripts/sbom.py generate-cli \
          --artifact "{{.ARTIFACT}}" \
          --source-name "$(basename "{{.ARTIFACT}}")" \
          --source-version "$source_version" \
          --output "{{.OUTPUT}}"

  dev:backend:
    desc: Start the backend development server
    cmds:
      - task: backend:dev

  dev:frontend:
    desc: Start the frontend development server
    cmds:
      - task: frontend:dev
