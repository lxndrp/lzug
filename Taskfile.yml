version: '3.52'

vars:
  UV: uv run --locked --extra dev

tasks:
  setup:
    desc: Recreate the virtual environment and install locked dependencies and Chromium
    cmds:
      - uv venv --python "$(mise which python)" --clear --seed
      - uv sync --locked --extra dev
      - task: setup:frontend
      - task: setup:playwright

  doctor:
    desc: Check the local toolchain, virtual environment, and Playwright Chromium
    cmds:
      - command -v uv >/dev/null || { echo "uv is missing; run mise install"; exit 1; }
      - uv --version
      - test "$(uv cache dir)" = "$HOME/.cache/uv" || { echo "uv cache must be $HOME/.cache/uv (configure Codex globally, not in this repository)"; exit 1; }
      - test -x .venv/bin/python || { echo ".venv/bin/python is missing; run task setup"; exit 1; }
      - .venv/bin/python --version
      - command -v node >/dev/null || { echo "Node.js is missing; run mise install"; exit 1; }
      - node --version
      - command -v npm >/dev/null || { echo "npm is missing; run mise install"; exit 1; }
      - npm --version
      - command -v go >/dev/null || { echo "Go is missing; run mise install"; exit 1; }
      - go version
      - >-
        cd frontend && node -e "const { chromium } = require('@playwright/test'); const { existsSync } = require('node:fs'); const executablePath = chromium.executablePath(); if (!existsSync(executablePath)) { console.error('Playwright Chromium is missing at ' + executablePath + '; run task setup'); process.exit(1); } console.log('Playwright Chromium: ' + executablePath);"

  test:
    desc: Run all backend, frontend, and operator unit tests
    cmds:
      - task: test:backend
      - task: test:frontend
      - task: test:operator

  test:backend:
    desc: Run backend unit tests
    cmds:
      - '{{.UV}} python -m unittest'

  test:frontend:
    desc: Run frontend unit tests
    dir: frontend
    cmds:
      - npm run test:ci

  test:operator:
    desc: Run Go operator CLI contract tests
    cmds:
      - go test ./cmd/lzug-admin

  docs:
    desc: Build the local handbook and generated code references
    cmds:
      - task: docs:handbook
      - task: docs:frontend

  wiki:check:
    desc: Check a separately checked-out Wiki repository, its sidebar sitemap, and source links
    cmds:
      - test -n "${WIKI_ROOT:-}" || { echo "set WIKI_ROOT to a local Wiki checkout"; exit 1; }
      - >-
        temporary_directory="$(mktemp -d)" && trap 'rm -rf "$temporary_directory"' EXIT &&
        python3 scripts/check_wiki.py "$WIKI_ROOT" --sitemap "$temporary_directory/sitemap.xml" &&
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$WIKI_ROOT:/wiki:ro" -w /wiki lycheeverse/lychee:0.24.2
        --fallback-extensions md --no-progress '*.md'

  quality:
    desc: Run the complete local quality assurance suite in parallel
    deps:
      - quality:backend
      - quality:frontend
      - quality:security
      - quality:operator
      - quality:oci
      - quality:overall
      - docs

  quality:backend:
    desc: Run backend lint, audit, tests, and coverage
    cmds:
      - task: backend:lint
      - task: backend:format
      - task: backend:audit
      - task: backend:coverage

  quality:frontend:
    desc: Run frontend lint, build, and unit tests
    dir: frontend
    cmds:
      - npm run lint
      - npm run format:check
      - npm run build:ci
      - npm run test:coverage

  quality:security:
    desc: Run the production npm critical security gate
    dir: frontend
    cmds:
      - npm run security:check

  quality:operator:
    desc: Run Go operator CLI tests and all portable CI builds
    cmds:
      - task: test:operator
      - |
        set -eu
        temporary_directory="$(mktemp -d)"
        trap 'rm -rf "$temporary_directory"' EXIT
        application_version="$(cat VERSION)"
        for goos in linux darwin windows; do
          for goarch in amd64 arm64; do
            GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w -X main.applicationVersion=$application_version" \
              -o "$temporary_directory/lzug-admin-$goos-$goarch" \
              ./cmd/lzug-admin
          done
        done

  quality:oci:
    desc: Build the local OCI quality image
    deps:
      - quality:image

  quality:overall:
    desc: Run all local cross-domain integration contracts in parallel
    deps:
      - quality:container
      - quality:compose
      - quality:operator-container
      - quality:browser

  quality:browser:
    internal: true
    cmds:
      - task: quality:e2e
      - task: quality:a11y

  quality:image:
    internal: true
    run: once
    cmds:
      - docker build --build-arg VCS_REF=local -t lzug:0.1.0-quality .

  quality:container:
    desc: Run the packaged container runtime contract
    deps:
      - quality:image
    cmds:
      - scripts/container-smoke.sh lzug:0.1.0-quality

  quality:operator-container:
    desc: Run the operator CLI against the packaged application container
    deps:
      - quality:image
    cmds:
      - scripts/operator-container-smoke.sh lzug:0.1.0-quality

  quality:compose:
    desc: Validate the Compose runtime and persistence contract
    deps:
      - quality:image
    cmds:
      - LZUG_IMAGE=lzug:0.1.0-quality scripts/compose-smoke.sh

  quality:e2e:
    desc: Run browser end-to-end tests
    dir: frontend
    cmds:
      - npm run test:e2e

  quality:a11y:
    desc: Run browser accessibility tests
    dir: frontend
    cmds:
      - npm run test:a11y

  dev:
    desc: Start backend and frontend development servers in parallel
    deps:
      - dev:backend
      - dev:frontend

  backend:lint:
    internal: true
    cmds:
      - '{{.UV}} python -m ruff check .'

  backend:format:
    internal: true
    cmds:
      - '{{.UV}} python -m black --check .'

  backend:audit:
    internal: true
    cmds:
      - '{{.UV}} python -m pip_audit --skip-editable --cache-dir /tmp/lzug-pip-audit'

  backend:coverage:
    internal: true
    cmds:
      - '{{.UV}} python -m coverage run -m unittest'
      - '{{.UV}} python -m coverage report'

  docs:handbook:
    internal: true
    cmds:
      - '{{.UV}} mkdocs build --strict --site-dir site'

  docs:frontend:
    internal: true
    dir: frontend
    cmds:
      - npm run docs

  setup:frontend:
    internal: true
    dir: frontend
    cmds:
      - npm ci

  setup:playwright:
    internal: true
    dir: frontend
    cmds:
      - npx playwright install chromium

  dev:backend:
    desc: Start the backend development server
    cmds:
      - '{{.UV}} python -m backend.app --init'

  dev:frontend:
    desc: Start the frontend development server
    dir: frontend
    cmds:
      - npm start
